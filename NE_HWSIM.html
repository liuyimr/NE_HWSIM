    out.push(`${p.name} current state : ${up ? 'UP' : 'DOWN'}`);
    out.push(`Line protocol current state : ${up ? 'UP' : 'DOWN'}`);
    out.push(`Description:${p.desc || ''}`);

    if (routed) {
      out.push('Route Port,The Maximum Transmit Unit is 1500');
      out.push(`Internet Address is ${p.ip ? `${p.ip}/${p.mask}` : 'unassigned'}`);
    } else {
      out.push(`Switch Port, PVID : ${E.portVlan(p)}, TPID : 8100(Hex), The Maximum Frame Length is 9216`);
      out.push(`Port link-type : ${p.mode === 'trunk' ? 'Trunk' : p.mode === 'hybrid' ? 'Hybrid' : 'Access'}`);
      if (p.mode === 'trunk') {
        const list = p.allowedVlans === 'all' ? 'all' : (p.allowedVlans || []).join(', ');
        out.push(`Trunk VLAN List : ${list || 'none'}`);
      }
      const st = dev.stpState && dev.stpState.portRole ? dev.stpState.portRole[p.id] : null;
      if (st && st === 'alternate') out.push(`Stp Port State : DISCARDING   (端口被生成树阻塞)`);
    }

    out.push(`IP Sending Frames' Format is PKTFMT_ETHNT_2, Hardware address is ${hwAddr(dev)}`);
    out.push('Port Mode: COMMON COPPER');
    out.push('Speed : 1000,   Loopback: NONE');
    out.push('Duplex: FULL,   Negotiation: ENABLE');
    out.push('Mdi: AUTO');
    out.push('Last 300 seconds input rate 0 bits/sec, 0 packets/sec');
    out.push('Last 300 seconds output rate 0 bits/sec, 0 packets/sec');
    out.push('Input:  0 packets, 0 bytes');
    out.push('  Unicast: 0, Multicast: 0');
    out.push('  Broadcast: 0, Jumbo: 0');
    out.push('  Discard: 0, Total Error: 0');
    out.push('Output: 0 packets, 0 bytes');
    out.push('  Unicast: 0, Multicast: 0');
    out.push('  Broadcast: 0, Jumbo: 0');
    out.push('  Discard: 0, Total Error: 0');
    return out;
  }

  function vlanifInterfaceLines(dev, vi) {
    const up = vi.enabled;
    return [
      `Vlanif${vi.vlanId} current state : ${up ? 'UP' : 'DOWN'}`,
      `Line protocol current state : ${up ? 'UP' : 'DOWN'}`,
      `Description:${vi.desc || ''}`,
      'The Maximum Transmit Unit is 1500',
      `Internet Address is ${vi.ip ? `${vi.ip}/${vi.mask}` : 'unassigned'}`,
      `IP Sending Frames' Format is PKTFMT_ETHNT_2, Hardware address is ${hwAddr(dev)}`,
      '    Last 300 seconds input rate 0 bits/sec, 0 packets/sec',
      '    Last 300 seconds output rate 0 bits/sec, 0 packets/sec',
      '    Input:  0 packets, 0 bytes',
      '    Output: 0 packets, 0 bytes'
    ];
  }

  function ethTrunkInterfaceLines(dev, t) {
    const up = t.members.some((m) => m.cableId && !m.shutdown);
    const withIp = t.members.find((m) => m.ip);
    const out = [
      `Eth-Trunk${t.id} current state : ${up ? 'UP' : 'DOWN'}`,
      `Line protocol current state : ${up ? 'UP' : 'DOWN'}`,
      'Description:',
      'Switch Port, PVID : 1, TPID : 8100(Hex), The Maximum Frame Length is 9216',
      `Internet Address is ${withIp ? `${withIp.ip}/${withIp.mask}` : 'unassigned'}`,
      `IP Sending Frames' Format is PKTFMT_ETHNT_2, Hardware address is ${hwAddr(dev)}`,
      `WorkingMode: ${t.mode === 'lacp' ? 'LACP' : 'NORMAL'}`,
      `Number of members: ${t.members.length}`,
      '    Input:  0 packets, 0 bytes',
      '    Output: 0 packets, 0 bytes'
    ];
    for (const m of t.members) {
      out.push(`  ${padEnd(m.name, 24)}${padEnd(m.cableId && !m.shutdown ? 'Up' : 'Down', 8)}${t.mode === 'lacp' ? 'Selected' : 'Unselected'}`);
    }
    return out;
  }

  function cmdDisplayInterface(dev, token) {
    if (!token) return errIncomplete('display interface');
    const iface = resolveIface(dev, token);
    if (!iface) return errWrong(token);
    if (iface.kind === 'vlanif') {
      const vi = dev.vlanifs.find((v) => v.vlanId === iface.vlanId);
      if (!vi) return [`Error: The interface Vlanif${iface.vlanId} does not exist.`];
      return vlanifInterfaceLines(dev, vi);
    }
    if (iface.kind === 'trunk') {
      const t = E.ethTrunks(dev).find((x) => x.id === iface.trunkId);
      if (!t) return [`Error: The interface Eth-Trunk${iface.trunkId} does not exist.`];
      return ethTrunkInterfaceLines(dev, t);
    }
    return ethInterfaceLines(dev, iface.port);
  }

  /* ------------------------- display port vlan ------------------------- */

  function cmdDisplayPortVlan(dev) {
    const out = [
      padEnd('Port', 24) + padEnd('Link Type', 13) + padEnd('PVID', 6) + 'Trunk VLAN List',
      '-'.repeat(79)
    ];
    for (const p of dev.ports) {
      if (p.mode === 'routed') continue;
      const type = p.mode === 'trunk' ? 'trunk' : p.mode === 'hybrid' ? 'hybrid' : 'access';
      let list = '-';
      if (p.mode === 'trunk') {
        list = p.allowedVlans === 'all' ? 'all' : (p.allowedVlans || []).join(', ') || '-';
      } else if (p.mode === 'hybrid') {
        list = String(p.vlan);
      }
      out.push(padEnd(p.name, 24) + padEnd(type, 13) + padEnd(E.portVlan(p), 6) + list);
    }
    return out;
  }

  /* ------------------------ display ospf interface ------------------------ */

  /** 按 OSPF 的 DR 选举规则（网段内最高接口 IP 当选）判断接口状态 */
  function ospfIfaceState(dev, iface) {
    let best = iface.ip;
    for (const cable of E.Net.cables) {
      if (cable.aDeviceId !== dev.id && cable.bDeviceId !== dev.id) continue;
      const otherId = cable.aDeviceId === dev.id ? cable.bDeviceId : cable.aDeviceId;
      const other = E.Net.getDevice(otherId);
      if (!other || !other.ospf || !other.ospf.enabled) continue;
      for (const oi of other.ospfActiveIfaces || []) {
        if (!E.sameSubnet(iface.ip, iface.mask, oi.ip)) continue;
        if (E.ipToInt(oi.ip) > E.ipToInt(best)) best = oi.ip;
      }
    }
    return best === iface.ip ? 'DR' : 'DROther';
  }

  function cmdDisplayOspfInterface(dev) {
    if (!dev.ospf.enabled) return ['Error: OSPF is not enabled.'];
    E.recomputeOspf();
    const list = dev.ospfActiveIfaces || [];
    const out = [`OSPF Process ${dev.ospf.pid || 1} with Router ID ${dev.ospf.routerId || '0.0.0.0'}`];
    if (!list.length) {
      out.push(' No OSPF interface is up.');
      return out;
    }
    const byArea = new Map();
    for (const i of list) {
      const k = String(i.area);
      if (!byArea.has(k)) byArea.set(k, []);
      byArea.get(k).push(i);
    }
    for (const [area, ifs] of byArea) {
      out.push(' Interfaces');
      out.push(` Area: ${area}          (MPLS TE not enabled)`);
      out.push(' IP Address       State    Cost  Type       MTU   Interface');
      for (const i of ifs) {
        out.push(
          ' ' + padEnd(i.ip, 17) + padEnd(ospfIfaceState(dev, i), 9) + padEnd(1, 6) + padEnd('Broadcast', 11) + padEnd(1500, 6) + i.name
        );
      }
    }
    if (dev.ospfNeighbors && dev.ospfNeighbors.length) {
      out.push('');
      out.push(` Neighbor Count is ${dev.ospfNeighbors.length}`);
    }
    return out;
  }

  function dispatchDisplay(dev, args) {
    const a = args.map((x) => x.toLowerCase());
    const rest = args.slice(1);

    if (!a[1]) return cmdDisplayVersion(dev);
    switch (a[1]) {
      case 'version':
        return cmdDisplayVersion(dev);
      case 'current-configuration':
        return cmdDisplayCurrentConfig(dev);
      case 'this':
        return cmdDisplayThis(dev);
      case 'ip':
        if (a[2] === 'interface' && a[3] === 'brief') return cmdDisplayIpInterfaceBrief(dev);
        if (a[2] === 'routing-table') return cmdDisplayIpRoutingTable(dev);
        if (a[2] === 'pool') return cmdDisplayIpPool(dev, rest[2]);
        return errUnrecognized('display ip');
      case 'interface':
        if (a[2] === 'brief') return cmdDisplayInterfaceBrief(dev);
        return cmdDisplayInterface(dev, rest.slice(1).join(''));
      case 'port':
        if (a[2] === 'vlan') return cmdDisplayPortVlan(dev);
        return errUnrecognized('display port');
      case 'vlan':
        return cmdDisplayVlan(dev, rest[1]);
      case 'mac-address':
        return cmdDisplayMacAddress(dev);
      case 'arp':
        return cmdDisplayArp(dev);
      case 'stp':
        if (a[2] === 'brief') return cmdDisplayStpBrief(dev);
        return cmdDisplayStp(dev);
      case 'eth-trunk':
        return cmdDisplayEthTrunk(dev);
      case 'ospf':
        if (a[2] === 'peer') return cmdDisplayOspfPeer(dev, a[3] === 'brief');
        if (a[2] === 'routing') return cmdDisplayOspfRouting(dev);
        if (a[2] === 'interface') return cmdDisplayOspfInterface(dev);
        if (a[2] === 'brief') return cmdDisplayOspfPeer(dev, true);
        return errUnrecognized('display ospf');
      case 'port-security':
        return cmdDisplayPortSecurity(dev);
      case 'saved-configuration':
        return dev.savedConfig ? ['#', ...dev.savedConfig, 'return'] : ['Error: The saved configuration file does not exist.'];
      default:
        return errUnrecognized('display');
    }
  }

  /* --------------------------- ping / tracert --------------------------- */

  function cmdPing(dev, args) {
    // ping [-c count] <ip>
    let count = 5;
    let ip = null;
    for (let i = 0; i < args.length; i++) {
      if (args[i] === '-c') {
        count = parseInt(args[++i], 10) || 5;
      } else if (E.isValidIp(args[i])) {
        ip = args[i];
      }
    }
    if (!ip) return errIncomplete('ping');

    if (dev.type === 'pc') {
      const res = E.ping(dev, ip);
      const out = [`Pinging ${ip} with 32 bytes of data:`];
      if (res.ok) {
        for (let i = 0; i < 4; i++) out.push(`Reply from ${ip}: bytes=32 time=${2 + i}ms TTL=${20 + res.path.length * 3}`);
        out.push('');
        out.push(`Ping statistics for ${ip}:`);
        out.push('    Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),');
        return { lines: out, traffic: res };
      }
      for (let i = 0; i < 4; i++) out.push('Request timed out.');
      out.push('');
      out.push(`Ping statistics for ${ip}:`);
      out.push('    Packets: Sent = 4, Received = 0, Lost = 4 (100% loss),');
      out.push(`失败原因：${res.reason}`);
      return { lines: out, traffic: res };
    }

    const res = E.ping(dev, ip);
    const out = [`  PING ${ip}: ${count === 5 ? 5 : count} data bytes, press CTRL_C to break`];
    if (res.ok) {
      for (let i = 0; i < count; i++) {
        out.push(`    Reply from ${ip}: bytes=56 Sequence=${i + 1} ttl=${64 - res.path.length} time=${2 + i * 2} ms`);
      }
      out.push('');
      out.push(`  --- ${ip} ping statistics ---`);
      out.push(`    ${count} packet(s) transmitted`);
      out.push(`    ${count} packet(s) received`);
      out.push(`    0.00% packet loss`);
      out.push(`    round-trip min/avg/max = 2/3/6 ms`);
      return { lines: out, traffic: res };
    }
    out.push(`    Request time out`);
    out.push('');
    out.push(`  --- ${ip} ping statistics ---`);
    out.push(`    5 packet(s) transmitted`);
    out.push(`    0 packet(s) received`);
    out.push(`    100.00% packet loss`);
    out.push(`失败原因：${res.reason}`);
    return { lines: out, traffic: res };
  }

  function cmdTracert(dev, args) {
    const ip = args.find((a) => E.isValidIp(a));
    if (!ip) return errIncomplete('tracert');
    const res = E.traceroute(dev, ip);
    const isPc = dev.type === 'pc';
    const out = [];
    if (isPc) out.push(`Tracing route to ${ip} over a maximum of 30 hops:`);
    else out.push(`traceroute to ${ip}, 8 hops max, press CTRL_C to break`);

    let i = 0;
    for (const h of res.hops) {
      i++;
      if (isPc) {
        out.push(`  ${padStart(i, 2)}    ${padEnd(4 + i, 6)} ms    ${padEnd(2 + i, 6)} ms    ${padEnd(3 + i, 6)} ms  ${h.ip}`);
      } else {
        out.push(`${padStart(i, 2)}  ${padEnd(h.ip, 20)} ${padEnd(4 + i, 8)} ms  ${padEnd(2 + i, 8)} ms  ${3 + i} ms`);
      }
    }
    if (res.ok) {
      out.push('');
      if (isPc) out.push('Trace complete.');
      else out.push(`  Trace complete.`);
    } else {
      out.push(` ${isPc ? 'Trace incomplete:' : 'trace incomplete:'} ${res.reason}`);
    }
    return { lines: out, traffic: { ...res, ok: res.ok, path: res.hops.map((h) => h.device.id) } };
  }

  /* --------------------------- PC 专用命令 --------------------------- */

  function cmdIpconfig(dev, args) {
    const p = dev.ports[0];
    if (args[1] === '/renew' || args[1] === '/refresh') {
      return { lines: doDhcp(dev), device: dev };
    }
    if (args[1] === '/release') {
      p.ip = null;
      p.mask = null;
      p.gateway = null;
      return { lines: ['IP 地址已释放。'], device: dev };
    }
    const out = ['', 'Windows IP Configuration', ''];
    out.push('Ethernet adapter Ethernet0/0/0:');
    out.push('');
    out.push('   Connection-specific DNS Suffix  . :');
    out.push('   Link-local IPv6 Address . . . . . : fe80::1%4');
    out.push(`   IPv4 Address. . . . . . . . . . . : ${p.ip || '（未配置）'}`);
    out.push(`   Subnet Mask . . . . . . . . . . . : ${p.ip ? E.prefixToMask(p.mask) : '（未配置）'}`);
    out.push(`   Default Gateway . . . . . . . . . : ${p.gateway || '（未配置）'}`);
    if (p.dhcp) out.push('   DHCP Enabled. . . . . . . . . . . : Yes');
    else out.push('   DHCP Enabled. . . . . . . . . . . : No');
    return { lines: out, device: dev };
  }

  function doDhcp(pc) {
    const found = E.findDhcpServer(pc);
    if (!found) {
      return [
        'DHCP 请求失败：没有找到可用的 DHCP 服务器。',
        '请检查：① 服务器是否执行 dhcp enable ② 是否创建 ip pool ③ 三层接口是否配置 dhcp select global ④ 链路与 VLAN 是否正确。'
      ];
    }
    const { server, pool } = found;
    server.dhcp.leases = server.dhcp.leases || [];
    const usedIps = server.dhcp.leases.map((l) => l.ip);
    const ip = E.allocateFromPool(server, pool, usedIps);
    if (!ip) return ['DHCP 请求失败：地址池中没有空闲地址。'];
    const p = pc.ports[0];
    p.ip = ip;
    p.mask = pool.mask;
    p.gateway = pool.gateway;
    p.dhcp = true;
    server.dhcp.leases.push({ ip, mac: E.macOf(pc), poolName: pool.name, t: Date.now() });
    return [
      `已通过 DHCP 获取地址：${ip}/${pool.mask}`,
      `  网关：${pool.gateway || '--'}    DNS：${pool.dns || '--'}`,
      `  （来自 ${server.hostname} 的地址池 ${pool.name}）`
    ];
  }

  /* --------------------------- 主执行入口 --------------------------- */

  /**
   * 执行一条命令（对外入口，统一返回 { lines, traffic? }）
   * 错误标记在这里统一展开成 ^ 定位行 + Error 行。
   */
  function execute(dev, rawLine) {
    // 出错时的 ^ 要对齐"敲命令那一刻"显示的提示符，所以先进场先记下来
    const prompt = promptOf(dev);
    const r = executeInner(dev, rawLine);
    let out;
    if (Array.isArray(r)) out = { lines: r };
    else if (!r || typeof r !== 'object') out = { lines: [] };
    else out = r;
    if (!out.lines) out.lines = [];
    out.lines = expandErrors(prompt, rawLine, out.lines);
    return out;
  }

  /* --------------------------- 交互式确认 ---------------------------
   * save 这类命令真实设备会停下来等用户输入，这里用 dev.cli.pending 记录等待状态。
   * 下一步输入（y/n、文件名）由 handlePending 消化，不再走正常命令解析。
   * ------------------------------------------------------------------ */

  function handlePending(dev, line) {
    const p = dev.cli.pending;
    dev.cli.pending = null;
    const ans = line.trim();
    const low = ans.toLowerCase();

    if (p.kind === 'save-confirm') {
      if (low === 'y' || low === 'yes') {
        dev.cli.pending = { kind: 'save-name' };
        return { lines: ['Info: Please input the file name(*.cfg, *.zip)[vrpcfg.zip]:'] };
      }
      // 选 n 或直接回车：真实 VRP 静默返回提示符
      return { lines: [] };
    }

    if (p.kind === 'save-name') {
      dev.savedConfig = E.runningConfig(dev);
      dev.lastSaved = Date.now();
      dev.savedFile = ans || 'vrpcfg.zip';
      return {
        lines: [
          'Now saving the current configuration to the slot 0.',
          'Save the configuration successfully.'
        ]
      };
    }

    if (p.kind === 'reset-confirm') {
      if (low === 'y' || low === 'yes') {
        dev.savedConfig = null;
        return { lines: ['Configuration file are reset successfully.'] };
      }
      return { lines: [] };
    }

    return { lines: [] };
  }

  function executeInner(dev, rawLine) {
    const line = rawLine.trim();

    // ---- 交互式等待中：这一行是给上一条命令的回答 ----
    if (dev.cli.pending) return handlePending(dev, line);

    if (!line) return { lines: [] };

    const args = line.split(/\s+/);
    const cmd = args[0].toLowerCase();
    const view = dev.cli.view;

    // ---- 帮助 ----
    if (line === '?' || cmd === 'help') {
      return { lines: helpLines(dev) };
    }

    // ---- 视图切换：quit 逐级返回，return 直接回用户视图 ----
    if (cmd === 'quit') {
      if (view === 'user-view') {
        return { lines: ['  ---- 已退出登录（模拟环境中保持连接）----'] };
      }
      quitView(dev);
      return { lines: [] };
    }
    if (cmd === 'return') {
      if (view === 'user-view') return { lines: [] };
      returnUserView(dev);
      return { lines: [] };
    }
    if (cmd === 'system-view' || line.toLowerCase() === 'sys') {
      if (view !== 'user-view') return errUnrecognized(cmd);
      // 从用户视图进系统视图，视图栈一定是干净的
      dev.cli.stack = [];
      resetCliCtx(dev);
      dev.cli.view = 'system-view';
      return { lines: ['Enter system view, return user view with Ctrl+Z.'] };
    }

    // ---- display / show ----
    // PC 没有 VRP 命令行，不支持 display
    if (cmd === 'display' || cmd === 'dis') {
      if (dev.type === 'pc') return errUnrecognized(cmd);
      return { lines: dispatchDisplay(dev, args) };
    }

    // ---- ping / tracert ----
    if (cmd === 'ping') return cmdPing(dev, args);
    if (cmd === 'tracert' || cmd === 'traceroute') return cmdTracert(dev, args);

    // ---- save：真实设备会先问 y/n，再问文件名 ----
    if (cmd === 'save') {
      if (view !== 'user-view') return errUnrecognized(cmd);
      if (args[1]) {
        // 直接带文件名（save vrpcfg.cfg）→ 跳过交互
        dev.savedConfig = E.runningConfig(dev);
        dev.lastSaved = Date.now();
        dev.savedFile = args[1];
        return {
          lines: [
            'Now saving the current configuration to the slot 0.',
            'Save the configuration successfully.'
          ]
        };
      }
      dev.cli.pending = { kind: 'save-confirm' };
      return {
        lines: [
          'The current configuration will be written to the device.',
          'Are you sure to continue? (y/n)[n]:'
        ]
      };
    }
    if (cmd === 'reset' && args[1] === 'saved-configuration') {
      dev.cli.pending = { kind: 'reset-confirm' };
      return {
        lines: [
          'The configuration file will be reset to the factory settings.',
          'Warning: All configuration will be lost, continue? (y/n)[n]:'
        ]
      };
    }

    /* ================= 用户视图以下为 PC 命令 ================= */
    if (dev.type === 'pc' && view === 'user-view') {
      if (cmd === 'ipconfig') return cmdIpconfig(dev, args);
      if (cmd === 'ip') {
        // ip 192.168.10.2 255.255.255.0 192.168.10.1
        const ip = args[1];
        const mask = parseMask(args[2]);
        const gw = args[3] || null;
        if (!E.isValidIp(ip) || mask == null) return errWrong('ip');
        if (gw && !E.isValidIp(gw)) return errWrong('ip');

        p.ip = ip;
        p.mask = mask;
        p.gateway = gw;

    /* ================= 系统视图 ================= */
    if (view === 'system-view') {
      if (cmd === 'sysname') {
        if (!args[1]) return errIncomplete('sysname');

      }
      if (cmd === 'vlan') {
        if (args[1] === 'batch') {
          const list = vlanList(args.slice(2).join(' '));
          if (!list || list === 'all') return errWrong('vlan batch');

        }
        const n = parseInt(args[1], 10);
        if (isNaN(n) || n < 1 || n > 4094) return errWrong(args[1]);

      if (cmd === 'undo' && args[1] === 'vlan') {
        const n = parseInt(args[2], 10);

        if (n === 1) return { lines: ['Error: The default VLAN cannot be deleted.'] };
        // 有接口还挂在上面时不允许直接删，真实 VRP 也是这个行为
        const used = dev.ports.filter((p) => E.portVlan(p) === n || (p.mode === 'trunk' && Array.isArray(p.allowedVlans) && p.allowedVlans.includes(n)));
        if (used.length) {
          return {
            lines: [
              `Error: VLAN ${n} is in use by ${used.length} port(s): ${used.map((p) => p.name).join(', ')}.`,
              `// 提示：请先把这些端口的 VLAN 配置改掉，再删除该 VLAN。`

        if (args[1] && args[1].toLowerCase() === 'range') {

        let ifaceTok = args[1];
        if (ifaceTok && /^(vlanif|eth-?trunk)$/i.test(ifaceTok) && args[2]) {
          ifaceTok = ifaceTok + args[2];
        }
        const iface = resolveIface(dev, ifaceTok);
        if (!iface) return errWrong('interface');
        if (iface.kind === 'vlanif') {
          if (dev.l2only) {
            return { lines: ['Error: This is a layer 2 switch, Vlanif is not supported.', '// 提示：S3700 是二层交换机，三层接口请用 S5700/路由器。'] };
          }
          if (!dev.vlans.includes(iface.vlanId)) dev.vlans.push(iface.vlanId);
          if (!dev.vlanifs.find((v) => v.vlanId === iface.vlanId)) {
            dev.vlanifs.push({ vlanId: iface.vlanId, enabled: true, ip: null, mask: null, desc: '', dhcpSelect: false });
          }
          enterView(dev, 'vlanif-view', { vlanifId: iface.vlanId });
          return { lines: [] };
        }
        if (iface.kind === 'trunk') {
          const members = dev.ports.filter((p) => p.trunkId === iface.trunkId);
          if (!members.length) return { lines: [`Error: Eth-Trunk${iface.trunkId} does not exist.`, `// 提示：请先进入物理端口执行 eth-trunk ${iface.trunkId} 加入成员口。`] };
          enterView(dev, 'trunk-view', { trunkId: iface.trunkId });
          return { lines: [] };
        }
        enterView(dev, 'interface-view', { ifaceId: iface.port.id });
        return { lines: [] };
      }
      if (cmd === 'ip' && args[1] === 'route-static') {
        const dest = args[2];
        const mask = parseMask(args[3]);
        const nh = args[4];
        let pre = 60;
        const pIdx = args.findIndex((a) => a.toLowerCase() === 'preference');
        if (pIdx > 0) pre = parseInt(args[pIdx + 1], 10) || 60;
        if (!E.isValidIp(dest) || mask == null || !E.isValidIp(nh)) return errWrong(!E.isValidIp(dest) ? dest : mask == null ? args[3] : nh);
        dev.routes = dev.routes.filter((r) => !(r.proto === 'Static' && r.dest === dest && r.mask === mask));
        dev.routes.push({ dest, mask, nextHop: nh, proto: 'Static', pre, cost: 0 });
        return { lines: [] };
      }
      if (cmd === 'undo' && args[1] === 'ip' && args[2] === 'route-static') {
        const dest = args[3];
        const mask = parseMask(args[4]);
        dev.routes = dev.routes.filter((r) => !(r.proto === 'Static' && r.dest === dest && r.mask === mask));
        return { lines: [] };
      }
      if (cmd === 'ip' && args[1] === 'pool') {
        if (!args[2]) return errIncomplete('ip pool');
        if (!dev.dhcp.pools.find((p) => p.name === args[2])) {
          dev.dhcp.pools.push({ name: args[2], network: null, mask: null, gateway: null, dns: null, excluded: [], leaseDays: 1 });
        }
        enterView(dev, 'pool-view', { poolName: args[2] });
        return { lines: [] };
      }
      if (cmd === 'dhcp') {
        if (args[1] === 'enable') {
          dev.dhcp.enabled = true;
          return { lines: [] };
        }
        if (args[1] === 'disable') {
          dev.dhcp.enabled = false;
          return { lines: [] };
        }
        return errWrong('dhcp');
      }
      if (cmd === 'undo' && args[1] === 'dhcp' && args[2] === 'enable') {
        dev.dhcp.enabled = false;
        return { lines: [] };
      }
      if (cmd === 'ospf') {
        const pid = parseInt(args[1], 10);
        if (isNaN(pid)) return errWrong(args[1]);
        const ridIdx = args.findIndex((a) => a.toLowerCase() === 'router-id');
        dev.ospf.enabled = true;
        dev.ospf.pid = pid;
        if (ridIdx > 0 && E.isValidIp(args[ridIdx + 1])) dev.ospf.routerId = args[ridIdx + 1];
        enterView(dev, 'ospf-view', { ospfPid: pid });
        return { lines: [] };
      }
      if (cmd === 'undo' && args[1] === 'ospf') {
        dev.ospf = { enabled: false, pid: null, routerId: null, areas: [], ifaces: [], neighbors: [] };
        dev.routes = dev.routes.filter((r) => r.proto !== 'OSPF');
        return { lines: [] };
      }
      if (cmd === 'acl') {
        let id = args[1];
        if (id && id.toLowerCase() === 'number') id = args[2];
        const n = parseInt(id, 10);
        if (isNaN(n)) return errWrong(id);
        if (!dev.acl.find((a) => a.id === n)) dev.acl.push({ id: n, rules: [] });
        enterView(dev, 'acl-view', { aclId: n });
        return { lines: [] };
      }
      if (cmd === 'stp') {
        if (args[1] === 'mode') {
          if (!['stp', 'rstp', 'mstp'].includes(args[2])) return errWrong(args[2]);
          dev.stp.mode = args[2];
          return { lines: [] };
        }
        if (args[1] === 'priority') {
          const n = parseInt(args[2], 10);
          if (isNaN(n) || n % 4096 !== 0)
            return [...errWrong(args[2]), '// 提示：STP 优先级必须是 4096 的倍数（4096/8192/16384/32768）。'];

          return { lines: [] };

      }

      }
      return errUnrecognized(cmd);
    }

    /* ================= VLAN 视图 ================= */
    if (view === 'vlan-view') {
      const n = dev.cli.vlanId;
      if (!dev.vlans.includes(n)) { quitView(dev); return errUnrecognized(cmd); }
      dev.vlanMeta = dev.vlanMeta || {};
      const meta = dev.vlanMeta[n] || (dev.vlanMeta[n] = {});

      if (cmd === 'description') {
        meta.desc = args.slice(1).join(' ');
        return { lines: [] };
      }
      if (cmd === 'undo' && args[1] === 'description') {
        delete meta.desc;
        return { lines: [] };
      }
      if (cmd === 'name') {
        if (!args[1]) return errIncomplete('name');
        meta.name = args[1];
        return { lines: [] };
      }
      if (cmd === 'undo' && args[1] === 'name') {
        delete meta.name;
        return { lines: [] };
      }
      return errUnrecognized(cmd);
    }

    /* ================= 接口视图 ================= */
    if (view === 'interface-view') {
      const p = E.Net.getPort(dev, dev.cli.ifaceId);
      if (!p) { quitView(dev); return errUnrecognized(cmd); }

      if (cmd === 'description') {
        p.desc = args.slice(1).join(' ');
        return { lines: [] };
      }
      if (cmd === 'shutdown') {
        p.shutdown = true;
        return { lines: [] };
      }
      if (cmd === 'undo' && args[1] === 'shutdown') {
        p.shutdown = false;
        return { lines: [] };
      }
      if (cmd === 'port') {
        if (args[1] === 'link-type') {
          const t = args[2];
          if (!['access', 'trunk', 'hybrid'].includes(t)) return errWrong(t);
          p.mode = t;
          if (t === 'trunk') p.allowedVlans = 'all';
          if (t === 'access') p.allowedVlans = 'all';
          return { lines: [] };
        }
        if (args[1] === 'default' && args[2] === 'vlan') {
          const n = parseInt(args[3], 10);
          if (isNaN(n) || n < 1 || n > 4094) return errWrong(args[3]);
          if (!dev.vlans.includes(n)) dev.vlans.push(n);
          p.vlan = n;
          return { lines: [] };
        }
        if (args[1] === 'trunk' && args[2] === 'allow-pass' && args[3] === 'vlan') {
          const list = vlanList(args.slice(4).join(' '));
          if (!list) return errWrong('port trunk allow-pass vlan');
          p.allowedVlans = list;
          if (list !== 'all') list.forEach((v) => { if (!dev.vlans.includes(v)) dev.vlans.push(v); });
          return { lines: [] };
        }
        if (args[1] === 'hybrid') {
          const n = parseInt(args[3], 10);
          if (isNaN(n)) return errWrong('port hybrid');
          p.vlan = n;
          if (!dev.vlans.includes(n)) dev.vlans.push(n);
          return { lines: [] };
        }
        return errWrong('port');
      }
      if (cmd === 'undo' && args[1] === 'port') {
        if (args[2] === 'trunk' && args[3] === 'allow-pass') {
          p.allowedVlans = [];
          return { lines: [] };
        }
        if (args[2] === 'default') {
          p.vlan = 1;
          return { lines: [] };
        }
        return errWrong('undo port');
      }
      if (cmd === 'ip' && args[1] === 'address') {
        if (p.mode !== 'routed') {
          return { lines: ['Error: Wrong parameter found at \'^\' position.', '// 提示：只有路由口才能直接配 IP，请先 undo portswitch，或在 Vlanif 接口下配置。'] };
        }
        const ip = args[2];
        const mask = parseMask(args[3]);
        if (!E.isValidIp(ip) || mask == null) return errWrong(!E.isValidIp(ip) ? ip : args[3]);
        p.ip = ip;
        p.mask = mask;
        return { lines: [] };
      }
      if (cmd === 'undo' && args[1] === 'ip' && args[2] === 'address') {
        p.ip = null;
        p.mask = null;
        return { lines: [] };
      }
      if (cmd === 'undo' && args[1] === 'portswitch') {
        p.mode = 'routed';
        return { lines: [] };
      }
      if (cmd === 'eth-trunk') {
        const n = parseInt(args[1], 10);
        if (isNaN(n)) return errWrong(args[1]);

        if (p.trunkMode == null) p.trunkMode = 'lacp';
        return { lines: [] };
      }
      if (cmd === 'undo' && args[1] === 'eth-trunk') {
        p.trunkId = null;
        return { lines: [] };
      }
      if (cmd === 'mode') {
        if (args[1] === 'lacp-static') { p.trunkMode = 'lacp'; return { lines: [] }; }
        if (args[1] === 'manual') { p.trunkMode = 'manual'; return { lines: [] }; }

      }
      if (cmd === 'stp') {
        if (args[1] === 'edged-port') {
          p.stpEdged = args[2] === 'enable' || args[2] === undefined;
          return { lines: [] };
        }
        return errWrong('stp');
      }
      if (cmd === 'undo' && args[1] === 'stp' && args[2] === 'edged-port') {
        p.stpEdged = false;
        return { lines: [] };
      }
      if (cmd === 'bpdu-protection' || (cmd === 'stp' && args[1] === 'bpdu-protection')) {
        p.bpduProtect = true;
        return { lines: [] };
      }
      if (cmd === 'undo' && args[1] === 'bpdu-protection') {
        p.bpduProtect = false;
        return { lines: [] };
      }
      if (cmd === 'port-security') {
        if (args[1] === 'enable') { p.portSec.enabled = true; return { lines: [] }; }
        if (args[1] === 'max-mac-num') {
          const n = parseInt(args[2], 10);
          if (isNaN(n) || n < 1) return errWrong(args[2]);
          p.portSec.maxMac = n;
          return { lines: [] };
        }
        return errWrong('port-security');
      }
      if (cmd === 'undo' && args[1] === 'port-security') {
        if (args[2] === 'enable') p.portSec.enabled = false;
        return { lines: [] };
      }
      if (cmd === 'dhcp' && args[1] === 'select') {
        p.dhcpSelect = true;
        return { lines: [] };
      }
      if (cmd === 'traffic-filter') {
        const dir = args[1];
        const aclIdx = args.findIndex((a) => a.toLowerCase() === 'acl');
        const aclId = aclIdx > 0 ? parseInt(args[aclIdx + 1], 10) : NaN;
        if (!['inbound', 'outbound'].includes(dir) || isNaN(aclId)) return errWrong(!['inbound', 'outbound'].includes(dir) ? dir : args[aclIdx + 1]);
        if (!dev.acl.find((a) => a.id === aclId)) {
          return { lines: [`Error: ACL ${aclId} does not exist.`, `// 提示：请先在系统视图执行 acl ${aclId} 创建该 ACL。`] };
        }
        dev.aclBindings = dev.aclBindings.filter((b) => !(b.portId === p.id && b.direction === dir));
        dev.aclBindings.push({ portId: p.id, direction: dir, aclId });
        return { lines: [] };
      }
      if (cmd === 'undo' && args[1] === 'traffic-filter') {
        const dir = args[2];

        return { lines: [] };
      }
      return errUnrecognized(cmd);
    }

    /* ================= Vlanif 视图 ================= */
    if (view === 'vlanif-view') {
      const vi = dev.vlanifs.find((v) => v.vlanId === dev.cli.vlanifId);
      if (!vi) { quitView(dev); return errUnrecognized(cmd); }

      if (cmd === 'ip' && args[1] === 'address') {
        const ip = args[2];
        const mask = parseMask(args[3]);
        if (!E.isValidIp(ip) || mask == null) return errWrong(!E.isValidIp(ip) ? ip : args[3]);
        vi.ip = ip;
        vi.mask = mask;
        return { lines: [] };
      }
      if (cmd === 'undo' && args[1] === 'ip' && args[2] === 'address') {
        vi.ip = null;
        vi.mask = null;
        return { lines: [] };
      }
      if (cmd === 'description') { vi.desc = args.slice(1).join(' '); return { lines: [] }; }
      if (cmd === 'shutdown') { vi.enabled = false; return { lines: [] }; }
      if (cmd === 'undo' && args[1] === 'shutdown') { vi.enabled = true; return { lines: [] }; }
      if (cmd === 'dhcp' && args[1] === 'select') { vi.dhcpSelect = true; return { lines: [] }; }

    /* ================= Eth-Trunk 视图 ================= */
    if (view === 'trunk-view') {

      if (cmd === 'mode') {

        if (!['lacp-static', 'manual'].includes(args[1])) return errWrong(args[1]);
        if (args[1] === 'manual' && args[2] !== 'load-balance') return errWrong('mode');
        members.forEach((m) => { m.trunkMode = args[1] === 'manual' ? 'manual' : 'lacp'; });
        return { lines: [] };
      }
      if (cmd === 'ip' && args[1] === 'address') {
        const ip = args[2];
        const mask = parseMask(args[3]);
        if (!E.isValidIp(ip) || mask == null) return errWrong(!E.isValidIp(ip) ? ip : args[3]);
        members.forEach((m) => { m.mode = 'routed'; m.ip = ip; m.mask = mask; });
        return { lines: [] };
      }
      if (cmd === 'undo' && args[1] === 'ip' && args[2] === 'address') {
        members.forEach((m) => { m.ip = null; m.mask = null; });
        return { lines: [] };
      }
      if (cmd === 'description') {
        members.forEach((m) => (m.desc = args.slice(1).join(' ')));
        return { lines: [] };
      }
      return errUnrecognized(cmd);
    }

    /* ================= 地址池视图 ================= */
    if (view === 'pool-view') {
      const pool = dev.dhcp.pools.find((p) => p.name === dev.cli.poolName);
      if (!pool) { quitView(dev); return errUnrecognized(cmd); }

      if (cmd === 'network') {
        const net = args[1];
        const mi = args.findIndex((a) => a.toLowerCase() === 'mask');
        const mask = mi > 0 ? parseMask(args[mi + 1]) : null;
        if (!E.isValidIp(net) || mask == null) return errWrong(!E.isValidIp(net) ? net : args[mi + 1]);
        pool.network = E.networkOf(net, mask);
        pool.mask = mask;
        return { lines: [] };
      }
      if (cmd === 'gateway-list') {
        if (!E.isValidIp(args[1])) return errWrong(args[1]);
        pool.gateway = args[1];
        return { lines: [] };
      }
      if (cmd === 'dns-list') {
        if (!E.isValidIp(args[1])) return errWrong(args[1]);
        pool.dns = args[1];
        return { lines: [] };
      }
      if (cmd === 'excluded-ip-address') {
        if (!E.isValidIp(args[1])) return errWrong(args[1]);
        pool.excluded = pool.excluded || [];
        pool.excluded.push(args[1]);
        return { lines: [] };
      }
      if (cmd === 'lease') {
        const n = parseInt(args[2], 10) || 1;
        pool.leaseDays = n;
        return { lines: [] };
      }
      if (cmd === 'static-bind') {
        return { lines: ['（本模拟器暂不校验静态绑定，配置已记录）'] };
      }
      return errUnrecognized(cmd);
    }

    /* ================= ACL 视图 ================= */
    if (view === 'acl-view') {
      const acl = dev.acl.find((a) => a.id === dev.cli.aclId);
      if (!acl) { quitView(dev); return errUnrecognized(cmd); }

      if (cmd === 'rule') {
        const ruleId = parseInt(args[1], 10);
        const action = args[2];
        if (isNaN(ruleId) || !['permit', 'deny'].includes(action)) return errWrong(!['permit', 'deny'].includes(action) ? action : args[1]);
        const rule = { ruleId, action, src: null, srcWildcard: null };
        const si = args.findIndex((a) => a.toLowerCase() === 'source');
        if (si > 0) {
          if (!E.isValidIp(args[si + 1])) return errWrong(args[si + 1]);
          rule.src = args[si + 1];
          rule.srcWildcard = E.isValidIp(args[si + 2]) ? args[si + 2] : '0.0.0.0';
        }
        acl.rules = acl.rules.filter((r) => r.ruleId !== ruleId);
        acl.rules.push(rule);
        acl.rules.sort((x, y) => x.ruleId - y.ruleId);
        return { lines: [] };
      }
      if (cmd === 'undo' && args[1] === 'rule') {
        const ruleId = parseInt(args[2], 10);
        acl.rules = acl.rules.filter((r) => r.ruleId !== ruleId);
        return { lines: [] };
      }
      return errUnrecognized(cmd);
    }

    /* ================= OSPF 视图 ================= */
    if (view === 'ospf-view') {
      if (cmd === 'router-id') {
        if (!E.isValidIp(args[1])) return errWrong(args[1]);
        dev.ospf.routerId = args[1];
        return { lines: [] };
      }
      if (cmd === 'area') {
        const areaId = args[1];
        if (areaId == null) return errIncomplete('area');
        const norm = areaId === '0' ? '0.0.0.0' : areaId;
        if (!dev.ospf.areas.find((a) => String(a.areaId) === String(norm))) {
          dev.ospf.areas.push({ areaId: norm, networks: [] });
        }
        enterView(dev, 'ospf-area-view', { ospfPid: dev.ospf.pid, areaId: norm });
        return { lines: [] };
      }
      return errUnrecognized(cmd);
    }

    /* ================= OSPF 区域视图 ================= */
    // quit 从这里只回上一级（OSPF 视图），不会直接跳到系统视图
    if (view === 'ospf-area-view') {
      const area = dev.ospf.areas.find((a) => String(a.areaId) === String(dev.cli.areaId));
      if (!area) { quitView(dev); return errUnrecognized(cmd); }
      if (cmd === 'network') {
        const ip = args[1];
        const wc = args[2];
        if (!E.isValidIp(ip) || !E.isValidIp(wc)) return errWrong(!E.isValidIp(ip) ? ip : wc);
        area.networks = area.networks.filter((n) => !(n.ip === ip && n.wildcard === wc));
        area.networks.push({ ip, wildcard: wc });
        return { lines: [] };
      }
      if (cmd === 'undo' && args[1] === 'network') {
        area.networks = area.networks.filter((n) => !(n.ip === args[2] && n.wildcard === args[3]));
        return { lines: [] };
      }
      return errUnrecognized(cmd);
    }

    return errUnrecognized(cmd);
  }

  /* ------------------------------ 帮助提示 ------------------------------ */

  const VIEW_LABEL = {
    'user-view': '用户视图',
    'system-view': '系统视图',
    'vlan-view': 'VLAN 视图',
    'interface-view': '接口视图',
    'vlanif-view': 'Vlanif 视图',
    'trunk-view': 'Eth-Trunk 视图',
    'pool-view': '地址池视图',
    'acl-view': 'ACL 视图',
    'ospf-view': 'OSPF 视图',
    'ospf-area-view': 'OSPF 区域视图'
  };

  /** 把视图栈拼成"一级一级"的路径，帮学生搞清自己在第几层 */
  function viewChain(dev) {
    const chain = dev.cli.stack.map((f) => VIEW_LABEL[f.view] || f.view);
    chain.push(VIEW_LABEL[dev.cli.view] || dev.cli.view);
    return chain;
  }

  function helpLines(dev) {
    const v = dev.cli.view;
    const chain = viewChain(dev);
    const common = ['', `  ---- 当前视图路径：${chain.join('  ›  ')} ----`];
    if (chain.length > 1) common.push('  ---- quit 回上一级，return 直接回用户视图 ----');
    common.push('', '  ---- 本视图可用命令（模拟器提供）----');
    const map = {
      'user-view': [
        'system-view                  进入系统视图',
        'display version              查看版本信息',
        'display current-configuration  查看当前配置',
        'display ip interface brief   查看接口 IP 简要信息',
        'display interface <接口名>   查看接口详细信息',
        'display port vlan            查看端口 VLAN 归属',
        'display vlan                 查看 VLAN',
        'display ip routing-table     查看路由表',
        'display mac-address          查看 MAC 地址表',
        'display arp                  查看 ARP 表',
        'display stp brief            查看生成树状态',
        'display eth-trunk            查看链路聚合',
        'display ospf peer brief      查看 OSPF 邻居',
        'display ospf interface       查看 OSPF 接口状态',
        'display ip pool              查看 DHCP 地址池',
        'ping <ip>                    连通性测试',
        'tracert <ip>                 路由跟踪',
        'save                         保存配置（会先问 y/n，再问文件名）'
      ],
      'system-view': [
        'sysname <名字>               修改设备名',
        'vlan <id>                    创建并进入 VLAN 视图',
        'vlan batch <ids>             批量创建 VLAN（不进入视图）',
        'undo vlan <id>               删除 VLAN',
        'interface <接口名>           进入接口视图',
        'ip route-static <目的> <掩码> <下一跳>   配置静态路由',
        'ip pool <名字>               创建 DHCP 地址池',
        'dhcp enable                  开启 DHCP 服务',
        'ospf <进程号> router-id <id> 开启 OSPF',
        'acl number <3000-3999>       创建高级 ACL',
        'stp mode rstp                设置生成树模式',
        'stp priority <4096的倍数>    设置桥优先级'
      ],
      'vlan-view': [
        'description <描述>           给 VLAN 加备注',
        'name <名称>                  给 VLAN 命名（display vlan 的 Description 列）',
        'display this                 查看本 VLAN 配置'
      ],
      'interface-view': [
        'description <描述>           接口描述',
        'shutdown / undo shutdown     关闭 / 开启接口',
        'port link-type access|trunk|hybrid   端口类型',
        'port default vlan <id>       Access 口加入 VLAN',
        'port trunk allow-pass vlan <列表|all>  Trunk 放行 VLAN',
        'undo portswitch              转为路由口（可配 IP）',
        'ip address <ip> <掩码>       配置 IP（路由口）',
        'eth-trunk <编号>             加入链路聚合组',
        'stp edged-port enable        配置边缘端口',
        'port-security enable         开启端口安全',
        'port-security max-mac-num <n>  限制 MAC 数量',
        'traffic-filter inbound acl <编号>  应用 ACL',
        'display this                 查看本接口配置'
      ],
      'vlanif-view': [
        'ip address <ip> <掩码>       配置 VLAN 三层网关地址',
        'dhcp select global           指定使用全局地址池',
        'description <描述>           接口描述',
        'shutdown / undo shutdown     关闭 / 开启接口',
        'display this                 查看本接口配置'
      ],
      'trunk-view': [
        'mode lacp-static             设置为 LACP 模式',
        'mode manual load-balance     设置为手工负载分担',
        'ip address <ip> <掩码>       配置 IP',
        'display this                 查看本接口配置'
      ],
      'pool-view': [
        'network <网段> mask <掩码>   地址池网段',
        'gateway-list <ip>            网关',
        'dns-list <ip>                DNS',
        'excluded-ip-address <ip>     排除地址',
        'lease day <n>                租期',
        'display this                 查看本地址池配置'
      ],
      'acl-view': [
        'rule <序号> permit|deny source <ip> <通配符>    配置规则',
        'display this                 查看本 ACL 配置'
      ],
      'ospf-view': [
        'router-id <ip>               指定 Router ID',
        'area 0                       进入区域视图',
        'display this                 查看 OSPF 配置'
      ],
      'ospf-area-view': [
        'network <网段> <通配符>      通告网段',
        'display this                 查看本区域配置'
      ]
    };
    if (dev.type === 'pc') {
      return [
        '',
        '  ---- PC 可用命令 ----',
        'ipconfig                     查看 IP 配置',
        'ipconfig /renew              通过 DHCP 重新获取地址',
        'ipconfig /release            释放地址',
        'ip <地址> <掩码> <网关>      手工配置 IP',
        'ping <ip>                    连通性测试',
        'tracert <ip>                 路由跟踪'
      ];
    }
    return [...common, ...(map[v] || [])];
  }

  global.NE = global.NE || {};
  Object.assign(global.NE, {
    execute,
    promptOf,
    resolveIface,
    helpLines,
    computeMacTable,
    viewChain,
    VIEW_LABEL
  });
})(window);

</script>
<script>
/* =========================================================================
 * NE_HWSIM —— 华为 VRP 网络实训模拟器
 * 模块：界面与交互（画布 / 拖拽 / 连线 / 终端 / 持久化 / 实训实验）
 *
 * Copyright (c) 2026 新易科技工作室 NewE
 * 作者：Liuyi  <yimr@sohu.com>
 * 协议：MIT License
 *
 * 本项目为独立的非官方教学演示工具，与华为技术有限公司无任何关联。
 * ========================================================================= */
(function (global) {
  'use strict';

  const E = global.NE;
  const $ = (id) => document.getElementById(id);

  /* ------------------------------ 布局常量 ------------------------------ */
  const COLS = 14;
  const CARD_W = 260;
  const PAD_X = 13;
  const GAP = 3;
  const PORT_H = 14;
  const HEAD_H = 46;
  const PORTS_PAD_TOP = 6;
  const COL_W = (CARD_W - 2 * PAD_X - (COLS - 1) * GAP) / COLS;

  /* ------------------------------ 运行时状态 ------------------------------ */
  const UI = {
    scale: 1,
    panX: 0,
    panY: 0,
    selDev: null,
    pend: null, // { devId, portId }
    tabs: [],
    activeTab: null,
    hist: {},
    histIdx: -1,
    labs: [],
    currentLab: null
  };

  /* ------------------------------ 提示条 ------------------------------ */
  let toastTimer = null;
  function toast(msg, kind) {
    const el = $('toast');
    el.textContent = msg;
    el.className = 'toast on' + (kind ? ' ' + kind : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => (el.className = 'toast'), 2200);
  }

  /* ------------------------------ 坐标换算 ------------------------------ */
  function portCenter(dev, idx) {
    const col = idx % COLS;
    const row = Math.floor(idx / COLS);
    return {
      x: dev.x + PAD_X + col * (COL_W + GAP) + COL_W / 2,
      y: dev.y + HEAD_H + PORTS_PAD_TOP + row * (PORT_H + GAP) + PORT_H / 2
    };
  }

  function cardHeight(dev) {
    const rows = Math.ceil(dev.ports.length / COLS) || 1;
    return HEAD_H + PORTS_PAD_TOP + rows * PORT_H + (rows - 1) * GAP + 12;
  }

  function screenToWorld(sx, sy) {
    const rect = $('stage').getBoundingClientRect();
    return {
      x: (sx - rect.left - UI.panX) / UI.scale,
      y: (sy - rect.top - UI.panY) / UI.scale
    };
  }

  function applyTransform() {
    $('stageInner').style.transform = `translate(${UI.panX}px, ${UI.panY}px) scale(${UI.scale})`;
  }

  /* ------------------------------ 设备库 ------------------------------ */
  function renderPalette() {
    const items = [
      { key: 'S5700', ic: '🔀', name: '三层交换机', sub: 'S5700-28TP-EI' },
      { key: 'S3700', ic: '🔀', name: '二层交换机', sub: 'S3700-28TP-EI' },
      { key: 'AR6121', ic: '📡', name: '路由器', sub: 'AR6121' },
      { key: 'PC', ic: '💻', name: 'PC 终端', sub: 'Windows 主机' }
    ];
    $('palette').innerHTML = items
      .map(
        (it) => `<button class="pal" data-k="${it.key}">
          <span class="ic">${it.ic}</span>
          <span class="tx"><b>${it.name}</b><span>${it.sub}</span></span>
        </button>`
      )
      .join('');
    $('palette').querySelectorAll('.pal').forEach((b) => {
      b.onclick = () => {
        const w = screenToWorld(window.innerWidth / 2, window.innerHeight / 2);
        const d = E.Net.addDevice(b.dataset.k, Math.round(w.x - CARD_W / 2 + Math.random() * 60), Math.round(w.y - 60 + Math.random() * 40));
        autoName(d);
        render();
        toast(`已添加 ${d.hostname}`, 'good');
      };
    });
  }

  let nameSeq = {};
  function autoName(dev) {
    const base = dev.type === 'pc' ? 'PC' : dev.type === 'router' ? 'R' : 'SW';
    nameSeq[base] = (nameSeq[base] || 0) + 1;
    dev.hostname = base + nameSeq[base];
  }

  /* ------------------------------ 画布渲染 ------------------------------ */
  function render() {
    const cards = $('cards');
    cards.innerHTML = '';

    for (const d of E.Net.devices) {
      const el = document.createElement('div');
      el.className = 'card' + (UI.selDev === d.id ? ' sel' : '');
      el.style.left = d.x + 'px';
      el.style.top = d.y + 'px';
      el.style.width = CARD_W + 'px';
      el.dataset.id = d.id;

      const tagTxt = d.type === 'pc' ? 'PC' : d.type === 'router' ? 'Router' : d.key === 'S3700' ? 'L2 Switch' : 'L3 Switch';
      el.innerHTML = `
        <div class="head">
          <div style="min-width:0">
            <div class="nm">${esc(d.hostname)}</div>
            <div class="md">${d.model}</div>
          </div>
          <span class="tag">${tagTxt}</span>
          <span class="x" title="删除设备">×</span>
        </div>
        <div class="ports" style="grid-template-columns:repeat(${COLS},1fr)"></div>`;

      const portsEl = el.querySelector('.ports');
      d.ports.forEach((p, i) => {
        const pe = document.createElement('div');
        pe.className = 'port ' + portClass(d, p);
        pe.title = `${p.name}\n${portTitle(d, p)}`;
        pe.innerHTML = `<span class="lab">${p.name.replace('GigabitEthernet', 'GE')}</span>`;
        pe.onmousedown = (ev) => ev.stopPropagation();
        pe.onclick = (ev) => {
          ev.stopPropagation();
          onPortClick(d, p);
        };
        portsEl.appendChild(pe);
      });

      const head = el.querySelector('.head');
      head.onmousedown = (ev) => startDrag(ev, d, el);
      head.ondblclick = () => openConsole(d);
      el.querySelector('.x').onclick = (ev) => {
        ev.stopPropagation();
        removeDevice(d);
      };
      el.onclick = () => {
        UI.selDev = d.id;
        render();
      };
      el.oncontextmenu = (ev) => {
        ev.preventDefault();
        removeDevice(d);
      };

      cards.appendChild(el);
    }

    renderWires();
    $('empty').style.display = E.Net.devices.length ? 'none' : 'flex';
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  }

  function portClass(dev, p) {
    const cls = [];
    if (p.cableId && !p.shutdown) cls.push('up');
    if (p.shutdown) cls.push('shut');
    if (p.mode === 'trunk') cls.push('trunk');
    if (UI.pend && UI.pend.devId === dev.id && UI.pend.portId === p.id) cls.push('pend');
    return cls.join(' ');
  }

  function portTitle(dev, p) {
    const rows = [];
    rows.push(p.shutdown ? '状态：已关闭（shutdown）' : p.cableId ? '状态：已连线 Up' : '状态：未连线 Down');
    rows.push('类型：' + (p.mode === 'routed' ? '路由口' : p.mode === 'trunk' ? 'Trunk' : p.mode === 'hybrid' ? 'Hybrid' : 'Access'));
    if (p.mode === 'access') rows.push('VLAN：' + p.vlan);
    if (p.mode === 'trunk') rows.push('放行 VLAN：' + (p.allowedVlans === 'all' ? 'all' : (p.allowedVlans || []).join(',')));
    if (p.ip) rows.push('IP：' + p.ip + '/' + p.mask);
    if (p.trunkId != null) rows.push('Eth-Trunk' + p.trunkId);
    return rows.join('  |  ');
  }

  function renderWires() {
    const svg = $('wires');
    let html = '';
    for (const c of E.Net.cables) {
      const a = E.Net.getDevice(c.aDeviceId);
      const b = E.Net.getDevice(c.bDeviceId);
      if (!a || !b) continue;
      const ia = a.ports.findIndex((p) => p.id === c.aPortId);
      const ib = b.ports.findIndex((p) => p.id === c.bPortId);
      if (ia < 0 || ib < 0) continue;
      const pa = portCenter(a, ia);
      const pb = portCenter(b, ib);
      const alive = !a.ports[ia].shutdown && !b.ports[ib].shutdown;
      html += `<line x1="${pa.x}" y1="${pa.y}" x2="${pb.x}" y2="${pb.y}"
        stroke="${alive ? '#3fb950' : '#6e7681'}" stroke-width="2" vector-effect="non-scaling-stroke" opacity="0.85"/>`;
    }
    svg.innerHTML = html;
  }

  /* ------------------------------ 拖动 ------------------------------ */
  function startDrag(ev, dev, el) {
    if (ev.button !== 0) return;
    ev.preventDefault();
    const startX = ev.clientX;
    const startY = ev.clientY;
    const ox = dev.x;
    const oy = dev.y;
    let moved = false;

    const onMove = (e) => {
      const dx = (e.clientX - startX) / UI.scale;
      const dy = (e.clientY - startY) / UI.scale;
      if (Math.abs(dx) > 2 || Math.abs(dy) > 2) moved = true;
      dev.x = Math.round(ox + dx);
      dev.y = Math.round(oy + dy);
      el.style.left = dev.x + 'px';
      el.style.top = dev.y + 'px';
      renderWires();
    };
    const onUp = () => {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      if (moved) {
        persist();
        UI.selDev = dev.id;
        render();
      }
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  }

  /* ------------------------------ 连线 ------------------------------ */
  function onPortClick(dev, port) {
    if (!UI.pend) {
      UI.pend = { devId: dev.id, portId: port.id };
      render();
      return;
    }
    if (UI.pend.devId === dev.id && UI.pend.portId === port.id) {
      UI.pend = null;
      render();
      return;
    }
    const from = E.Net.getDevice(UI.pend.devId);
    const fromPort = from && E.Net.getPort(from, UI.pend.portId);
    if (!from || !fromPort) {
      UI.pend = null;
      render();
      return;
    }
    const res = E.Net.addCable(from, fromPort, dev, port);
    UI.pend = null;
    if (!res.ok) {
      toast(res.message, 'bad');
      render();
      return;
    }
    E.recomputeOspf();
    E.recomputeStp();
    persist();
    render();
    toast(`${from.hostname} ${fromPort.name} ↔ ${dev.hostname} ${port.name} 连接成功`, 'good');
  }

  function removeDevice(dev) {
    if (!confirm(`确定删除设备 ${dev.hostname} 吗？相关连线会一并删除。`)) return;
    E.Net.removeDevice(dev.id);
    UI.tabs = UI.tabs.filter((t) => t !== dev.id);
    if (UI.activeTab === dev.id) UI.activeTab = UI.tabs[UI.tabs.length - 1] || null;
    if (UI.selDev === dev.id) UI.selDev = null;
    E.recomputeOspf();
    E.recomputeStp();
    persist();
    render();
    renderConsole();
  }

  /* ------------------------------ 终端 ------------------------------ */
  function openConsole(dev) {
    if (!UI.tabs.includes(dev.id)) UI.tabs.push(dev.id);
    UI.activeTab = dev.id;
    $('term').classList.add('open');
    renderConsole();
    setTimeout(() => $('cmd').focus(), 60);
  }

  function closeConsole(id) {
    UI.tabs = UI.tabs.filter((t) => t !== id);
    if (UI.activeTab === id) UI.activeTab = UI.tabs[UI.tabs.length - 1] || null;
    if (!UI.tabs.length) $('term').classList.remove('open');
    renderConsole();
  }

  function activeDev() {
    return UI.activeTab ? E.Net.getDevice(UI.activeTab) : null;
  }

  function renderConsole() {
    const tabsEl = $('tabs');
    if (!UI.tabs.length) {
      tabsEl.innerHTML = '';
      $('screen').innerHTML = '';
      return;
    }
    tabsEl.innerHTML =
      UI.tabs
        .map((id) => {
          const d = E.Net.getDevice(id);
          if (!d) return '';
          return `<div class="tab ${id === UI.activeTab ? 'on' : ''}" data-id="${id}">
            <span style="width:7px;height:7px;border-radius:50%;background:${id === UI.activeTab ? '#3fb950' : '#484f58'}"></span>
            ${esc(d.hostname)}
            <span class="cl" data-close="${id}">×</span>
          </div>`;
        })
        .join('') +
      `<div class="sp">
         <button class="btn" id="btnClearLog" title="清屏">清屏</button>
         <button class="btn" id="btnMax" title="最大化 / 还原">⤢</button>
       </div>`;

    tabsEl.querySelectorAll('.tab').forEach((t) => {
      t.onclick = (ev) => {
        if (ev.target.dataset.close) return;
        UI.activeTab = t.dataset.id;
        renderConsole();
        $('cmd').focus();
      };
    });
    tabsEl.querySelectorAll('[data-close]').forEach((el) => {
      el.onclick = (ev) => {
        ev.stopPropagation();
        closeConsole(el.dataset.close);
      };
    });
    tabsEl.querySelector('#btnClearLog').onclick = () => {
      const d = activeDev();
      if (d) {
        d.logs = [];
        renderConsole();
      }
    };
    tabsEl.querySelector('#btnMax').onclick = () => {
      $('term').classList.toggle('max');
    };

    const d = activeDev();
    if (!d) return;
    const screen = $('screen');
    if (!d.logs.length) {
      d.logs.push({ t: `--- 已进入 ${d.hostname} 的命令行（${d.model}）---`, c: 'dim' });
      d.logs.push({ t: '提示：输入 ? 查看可用命令；双击其他设备可切换会话。', c: 'dim' });
    }
    screen.innerHTML = d.logs
      .map((l) => `<div class="ln ${l.c || ''}">${esc(l.t)}</div>`)
      .join('');
    screen.scrollTop = screen.scrollHeight;
    // 等待 y/n 或文件名输入时，真实 VRP 不显示提示符
    $('prompt').textContent = d.cli.pending ? '' : E.promptOf(d);
  }

  function classify(line) {
    const s = line.trim();
    if (/^\^$/.test(s)) return 'err'; // 真实 VRP 的错误插入符行
    if (/^\/\/ /.test(s)) return 'hl'; // 模拟器附加的中文提示，区别于设备真实回显
    if (/^Error[:：]|^Error |失败原因|请求失败|无法到达|已被占用/.test(s)) return 'err';
    if (/^(Warning|警告)|失败/.test(s)) return 'warn';
    if (/成功|reply|Reply|ping statistics|Save the configuration successfully/.test(s)) return 'ok';
    if (/^#|^return$|^\(no /.test(s)) return 'dim';
    return '';
  }

  function runCommand(line) {
    const d = activeDev();
    if (!d) return;
    const waiting = !!d.cli.pending;
    // 非等待状态下空回车没有意义，直接忽略
    if (!waiting && !line.trim()) return;

    if (waiting) {
      // 真实控制台里 y / 文件名是紧跟在问题后面的，所以追加到上一行末尾
      const last = d.logs[d.logs.length - 1];
      if (last) last.t += line;
    } else {
      d.logs.push({ t: `${E.promptOf(d)} ${line}`, c: 'cmd' });
    }

    let res;
    try {
      res = E.execute(d, line);
    } catch (e) {
      d.logs.push({ t: '内部错误：' + e.message, c: 'err' });
      renderConsole();
      return;
    }
    for (const l of res.lines || []) d.logs.push({ t: l, c: classify(l) });
    if (res.traffic) showTraffic(d, res.traffic);
    E.recomputeOspf();
    E.recomputeStp();
    persist();
    renderConsole();
    render();
  }

  /** 高亮本次通信路径 */
  function showTraffic(dev, traffic) {
    const path = (traffic.path || []).filter(Boolean);
    if (!path.length) return;
    const names = path.map((id) => (E.Net.getDevice(id) || {}).hostname || '?').join(' → ');

  /* ------------------------------ 命令输入 ------------------------------ */
  function setupInput() {
    const inp = $('cmd');
    inp.addEventListener('keydown', (ev) => {
      const d = activeDev();
      if (!d) return;
      const key = ev.key;
      if (key === 'Enter') {
        ev.preventDefault();
        const v = inp.value;
        inp.value = '';
        // 等待确认的回答（y / 文件名）不进历史，避免 ↑ 翻出一堆 y
        if (v.trim() && !d.cli.pending) {
          if (!UI.hist[d.id]) UI.hist[d.id] = [];
          UI.hist[d.id].push(v.trim());
          UI.histIdx = UI.hist[d.id].length;
        }
        runCommand(v);
      } else if (key === 'ArrowUp') {
        ev.preventDefault();
        const h = UI.hist[d.id] || [];
        if (!h.length) return;
        UI.histIdx = Math.max(0, (UI.histIdx == null ? h.length : UI.histIdx) - 1);
        inp.value = h[UI.histIdx] || '';
      } else if (key === 'ArrowDown') {
        ev.preventDefault();
        const h = UI.hist[d.id] || [];
        UI.histIdx = Math.min(h.length, (UI.histIdx == null ? 0 : UI.histIdx) + 1);
        inp.value = h[UI.histIdx] || '';
      } else if (key === 'Tab') {
        ev.preventDefault();
        autocomplete(d, inp);
      } else if (key === '?' && !inp.value) {
        ev.preventDefault();
        runCommand('?');
      }
    });
  }

  function autocomplete(d, inp) {
    const cur = inp.value;
    let list = CANDIDATES[d.cli.view] || [];
    if (d.type === 'pc') list = ['ipconfig', 'ipconfig /renew', 'ipconfig /release', 'ip ', 'ping ', 'tracert ', 'help'];

    if (!cur.trim()) {
      const d2 = activeDev();
      d2.logs.push({ t: '', c: '' });
      d2.logs.push({ t: '  可输入的命令：', c: 'dim' });
      for (const c of list) d2.logs.push({ t: '    ' + c, c: 'hl' });
      renderConsole();
      return;
    }
    const hits = list.filter((c) => c.toLowerCase().startsWith(cur.toLowerCase()));
    if (hits.length === 1) {
      inp.value = hits[0];
      return;
    }
    if (hits.length > 1) {
      const common = commonPrefix(hits);
      if (common.length > cur.length) inp.value = common;
      else {
        const d2 = activeDev();
        d2.logs.push({ t: '', c: '' });
        d2.logs.push({ t: '  匹配到的命令：', c: 'dim' });
        for (const c of hits) d2.logs.push({ t: '    ' + c, c: 'hl' });
        renderConsole();
      }
    }
  }

  function commonPrefix(arr) {
    if (!arr.length) return '';
    let p = arr[0];
    for (const s of arr) {
      while (s.toLowerCase().indexOf(p.toLowerCase()) !== 0) {
        p = p.slice(0, -1);
        if (!p) return '';
      }
    }
    return p;
  }

  /* ------------------------------ 画布平移缩放 ------------------------------ */
  function setupStage() {
    const stage = $('stage');
    stage.addEventListener('mousedown', (ev) => {
      if (ev.target !== stage && ev.target.id !== 'stageInner' && ev.target.tagName !== 'svg') return;
      if (ev.button === 1 || ev.button === 0) {
        UI.pend = null;
        UI.selDev = null;
        render();
        const sx = ev.clientX;
        const sy = ev.clientY;
        const ox = UI.panX;
        const oy = UI.panY;
        const mv = (e) => {
          UI.panX = ox + (e.clientX - sx);
          UI.panY = oy + (e.clientY - sy);
          applyTransform();
        };
        const up = () => {
          document.removeEventListener('mousemove', mv);
          document.removeEventListener('mouseup', up);
        };
        document.addEventListener('mousemove', mv);
        document.addEventListener('mouseup', up);
      }
    });
    stage.addEventListener('wheel', (ev) => {
      if (!ev.ctrlKey && !ev.metaKey) return;
      ev.preventDefault();
      const rect = stage.getBoundingClientRect();
      const mx = ev.clientX - rect.left;
      const my = ev.clientY - rect.top;
      const old = UI.scale;
      const next = Math.min(2, Math.max(0.35, old * (ev.deltaY < 0 ? 1.12 : 0.89)));
      UI.panX = mx - (mx - UI.panX) * (next / old);
      UI.panY = my - (my - UI.panY) * (next / old);
      UI.scale = next;
      applyTransform();
    }, { passive: false });
    document.addEventListener('keydown', (ev) => {
      if (ev.key === 'Escape') {
        UI.pend = null;
        render();
      }
      if (ev.key === 'Delete' && UI.selDev) {
        const d = E.Net.getDevice(UI.selDev);
        if (d) removeDevice(d);
      }
    });
  }

  /* ------------------------------ 持久化 ------------------------------ */
  const LS_KEY = 'hw-netsim-lite-v1';

  function persist() {
    try {
      localStorage.setItem(
        LS_KEY,
        JSON.stringify({
          devices: E.Net.devices,
          cables: E.Net.cables,
          seq: nameSeq,
          pan: { x: UI.panX, y: UI.panY, s: UI.scale }
        })
      );
    } catch (e) {
      /* 忽略存储异常 */
    }
  }

  function restore() {
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (!raw) return false;
      const data = JSON.parse(raw);
      if (!data.devices || !data.devices.length) return false;
      E.Net.devices = (data.devices || []).map((d) => E.normalizeDevice(d));
      E.Net.cables = data.cables || [];
      nameSeq = data.seq || {};
      if (data.pan) {
        UI.panX = data.pan.x || 0;
        UI.panY = data.pan.y || 0;
        UI.scale = data.pan.s || 1;
      }
      return true;
    } catch (e) {
      return false;
    }
  }

  /* ------------------------------ 实验预设 ------------------------------ */
  function mk(key, x, y, name) {
    const d = E.Net.addDevice(key, x, y);
    d.hostname = name;
    nameSeq[d.type === 'pc' ? 'PC' : d.type === 'router' ? 'R' : 'SW'] = Math.max(
      nameSeq[d.type === 'pc' ? 'PC' : d.type === 'router' ? 'R' : 'SW'] || 0,
      parseInt(String(name).replace(/\D/g, ''), 10) || 0
    );
    return d;
  }

  function link(a, ai, b, bi) {
    const res = E.Net.addCable(a, a.ports[ai], b, b.ports[bi]);
    if (!res.ok) console.warn('连线失败：' + res.message);
    return res.ok;
  }

  function setPort(dev, idx, patch) {
    Object.assign(dev.ports[idx], patch);
  }

  function setName(dev, name) {
    dev.hostname = name;
  }

  function clearAll() {
    E.Net.reset();
    nameSeq = {};
    UI.tabs = [];

    UI.pend = null;

    if (devs.length) {
      const minX = Math.min(...devs.map((d) => d.x));
      const maxX = Math.max(...devs.map((d) => d.x)) + CARD_W;
      const minY = Math.min(...devs.map((d) => d.y));
      const maxY = Math.max(...devs.map((d) => d.y)) + 180;
      const rect = $('stage').getBoundingClientRect();
      const s = Math.min(1.1, Math.min(rect.width / (maxX - minX + 80), rect.height / (maxY - minY + 80)));
      UI.scale = Math.max(0.35, s);
      UI.panX = (rect.width - (maxX - minX) * UI.scale) / 2 - minX * UI.scale;
      UI.panY = (rect.height - (maxY - minY) * UI.scale) / 2 - minY * UI.scale;
      applyTransform();
    }
    UI.currentLab = lab;
    persist();
    render();
    if (info.focus) openConsole(info.focus);
    showLabBrief(lab);
  }

  /* ------------------------------ 导出配置 ------------------------------ */
  function exportConfig() {
    if (!E.Net.devices.length) {
      toast('当前没有设备可导出', 'bad');
      return;
    }
    const parts = ['配置导出时间：' + new Date().toLocaleString(), ''];
    for (const d of E.Net.devices) {
      parts.push('='.repeat(66));
      parts.push(`设备：${d.hostname}（${d.model}）`);
      parts.push('='.repeat(66));
      parts.push(...E.runningConfig(d));
      parts.push('');
    }
    const blob = new Blob([parts.join('\n')], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = '网络设备配置_' + new Date().toISOString().slice(0, 10) + '.txt';
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 3000);
    toast('配置已导出', 'good');
  }

  /* ------------------------------ 启动 ------------------------------ */
  function boot() {
    renderPalette();
    setupStage();
    setupInput();

    $('btnLab').onclick = showLabs;
    $('btnHelp').onclick = showHelp;
    $('btnSave').onclick = exportConfig;
    $('btnClear').onclick = () => {
      if (confirm('确定清空当前拓扑吗？此操作不可撤销。')) {
        clearAll();
        toast('拓扑已清空');
      }
    };
    $('mask').onclick = (ev) => {
      if (ev.target.id === 'mask') closeModal();
    };
    document.addEventListener('keydown', (ev) => {
      if (ev.key === 'Escape') closeModal();
    });

    const restored = restore();
    applyTransform();
    E.recomputeOspf();
    E.recomputeStp();
    render();
    renderConsole();

    if (restored && E.Net.devices.length) {
      // 恢复上次的拓扑：自动打开第一台网络设备的命令行，学生可直接开始输入
      const first = E.Net.devices.find((d) => d.type !== 'pc') || E.Net.devices[0];
      openConsole(first);
      toast('已恢复上次的拓扑');
    } else {
      // 首次打开：直接加载实验一，让学生立刻有东西可玩
      loadLab('vlan-basic');
      toast('已加载「实验一 · VLAN 基础」，点击「开始配置」即可');
    }
  }

  // 对外可编程接口：便于自动化测试与二次集成（NE.UI.openConsole(dev) 等）
  UI.openConsole = openConsole;
  UI.closeConsole = closeConsole;
  UI.runCommand = runCommand;
  UI.loadLab = loadLab;
  UI.clearAll = clearAll;
  UI.toast = toast;

  global.NE = global.NE || {};
  global.NE.UI = UI;
  global.NE.LABS = LABS;

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})(window);

</script>
