          const n = parseInt(args[3], 10);
          if (isNaN(n) || n < 1 || n > 4094) return errWrong(args[3]);
          if (!dev.vlans.includes(n)) dev.vlans.push(n);
          ports.forEach((p) => { p.vlan = n; });
          return { lines: [] };
        }
        if (args[1] === 'trunk' && args[2] === 'allow-pass' && args[3] === 'vlan') {
          const list = vlanList(args.slice(4).join(' '));
          if (!list) return errWrong('port trunk allow-pass vlan');
          if (list !== 'all') list.forEach((v) => { if (!dev.vlans.includes(v)) dev.vlans.push(v); });
          ports.forEach((p) => { p.allowedVlans = list; });
          return { lines: [] };
        }
        if (args[1] === 'hybrid') {
          const n = parseInt(args[3], 10);
          if (isNaN(n)) return errWrong('port hybrid');
          if (!dev.vlans.includes(n)) dev.vlans.push(n);
          ports.forEach((p) => { p.vlan = n; });
          return { lines: [] };
        }
        return errWrong('port');
      }
      if (cmd === 'undo' && args[1] === 'port') {
        if (args[2] === 'trunk' && args[3] === 'allow-pass') {
          ports.forEach((p) => { p.allowedVlans = []; });
          return { lines: [] };
        }
        if (args[2] === 'default') {
          ports.forEach((p) => { p.vlan = 1; });
          return { lines: [] };
        }
        return errWrong('undo port');
      }
      if (cmd === 'ip' && args[1] === 'address') {
        if (ports.some((p) => p.mode !== 'routed')) {
          return { lines: ['Error: Wrong parameter found at \'^\' position.', '// 提示：只有路由口才能直接配 IP，请先 undo portswitch，或在 Vlanif 接口下配置。'] };
        }
        const ip = args[2];
        const mask = parseMask(args[3]);
        if (!E.isValidIp(ip) || mask == null) return errWrong(!E.isValidIp(ip) ? ip : args[3]);
        ports.forEach((p) => { p.ip = ip; p.mask = mask; });
        return { lines: [] };
      }
      if (cmd === 'undo' && args[1] === 'ip' && args[2] === 'address') {
        ports.forEach((p) => { p.ip = null; p.mask = null; });
        return { lines: [] };
      }
      if (cmd === 'undo' && args[1] === 'portswitch') {
        ports.forEach((p) => { p.mode = 'routed'; });
        return { lines: [] };
      }
      if (cmd === 'eth-trunk') {
        const n = parseInt(args[1], 10);
        if (isNaN(n)) return errWrong(args[1]);
        ports.forEach((p) => {
          p.trunkId = n;
          if (p.trunkMode == null) p.trunkMode = 'lacp';
        });
        return { lines: [] };
      }
      if (cmd === 'undo' && args[1] === 'eth-trunk') {
        ports.forEach((p) => { p.trunkId = null; });
        return { lines: [] };
      }
      if (cmd === 'mode') {
        if (!['lacp-static', 'manual'].includes(args[1])) return errWrong(args[1]);
        if (args[1] === 'manual' && args[2] !== 'load-balance') return errWrong('mode');
        ports.forEach((p) => { p.trunkMode = args[1] === 'manual' ? 'manual' : 'lacp'; });
        return { lines: [] };
      }
      if (cmd === 'stp') {
        if (args[1] === 'edged-port') {
          const v = args[2] === 'enable' || args[2] === undefined;
          ports.forEach((p) => { p.stpEdged = v; });
          return { lines: [] };
        }
        return errWrong('stp');
      }
      if (cmd === 'undo' && args[1] === 'stp' && args[2] === 'edged-port') {
        ports.forEach((p) => { p.stpEdged = false; });
        return { lines: [] };
      }
      if (cmd === 'bpdu-protection' || (cmd === 'stp' && args[1] === 'bpdu-protection')) {
        ports.forEach((p) => { p.bpduProtect = true; });
        return { lines: [] };
      }
      if (cmd === 'undo' && args[1] === 'bpdu-protection') {
        ports.forEach((p) => { p.bpduProtect = false; });
        return { lines: [] };
      }
      if (cmd === 'port-security') {
        if (args[1] === 'enable') {
          ports.forEach((p) => { p.portSec.enabled = true; });
          return { lines: [] };
        }
        if (args[1] === 'max-mac-num') {
          const n = parseInt(args[2], 10);
          if (isNaN(n) || n < 1) return errWrong(args[2]);
          ports.forEach((p) => { p.portSec.maxMac = n; });
          return { lines: [] };
        }
        return errWrong('port-security');
      }
      if (cmd === 'undo' && args[1] === 'port-security') {
        if (args[2] === 'enable') ports.forEach((p) => { p.portSec.enabled = false; });
        return { lines: [] };
      }
      if (cmd === 'dhcp' && args[1] === 'select') {
        ports.forEach((p) => { p.dhcpSelect = true; });
        return { lines: [] };
      }
      if (cmd === 'traffic-filter') {
        const dir = args[1];
        const aclIdx = args.findIndex((a) => a.toLowerCase() === 'acl');
        const aclId = aclIdx > 0 ? parseInt(args[aclIdx + 1], 10) : NaN;
        if (!['inbound', 'outbound'].includes(dir) || isNaN(aclId)) return errWrong(!['inbound', 'outbound'].includes(dir) ? dir : args[aclIdx + 1]);
        if (!dev.acl.find((a) => a.id === aclId)) {
          return { lines: [`Error: ACL ${aclId} does not exist.`, `// 提示：请先在系统视图执行 acl number ${aclId} 创建该 ACL。`] };
        }
        ports.forEach((p) => {
          dev.aclBindings = dev.aclBindings.filter((b) => !(b.portId === p.id && b.direction === dir));
          dev.aclBindings.push({ portId: p.id, direction: dir, aclId });
        });
        return { lines: [] };
      }
      if (cmd === 'undo' && args[1] === 'traffic-filter') {
        const dir = args[2];
        ports.forEach((p) => {
          dev.aclBindings = dev.aclBindings.filter((b) => !(b.portId === p.id && b.direction === dir));
        });
        return { lines: [] };
      }
      if (cmd === 'nat') {
        if (args[1] !== 'outbound') {
          return [...errWrong('nat'), '// 提示：接口下 NAT 的写法为 nat outbound <ACL编号> [address-group <编号>]。'];
        }
        const aclId = parseInt(args[2], 10);
        if (isNaN(aclId)) return errWrong(args[2]);
        if (!dev.acl.find((a) => a.id === aclId)) {
          return { lines: [`Error: ACL ${aclId} does not exist.`, '// 提示：nat outbound 要用 ACL 指定需要转换的内网流量，请先创建该 ACL。'] };
        }
        const gi = args.findIndex((a) => a.toLowerCase() === 'address-group');
        const ag = gi > 0 ? parseInt(args[gi + 1], 10) : null;
        if (ag != null && !(dev.natAddrGroups || []).find((g) => g.id === ag)) {
          return { lines: [`Error: NAT address-group ${ag} does not exist.`, `// 提示：请先在系统视图执行 nat address-group ${ag} 创建公网地址池。`] };
        }
        ports.forEach((p) => { p.nat = { aclId, addrGroup: ag }; });
        return { lines: [] };
      }
      if (cmd === 'undo' && args[1] === 'nat' && args[2] === 'outbound') {
        ports.forEach((p) => { p.nat = null; });
        return { lines: [] };
      }
      return errUnrecognized(cmd);
    }

    /* ================= Vlanif 视图 ================= */
    if (view === 'vlanif-view') {
      const vi = dev.vlanifs.find((v) => v.vlanId === dev.cli.vlanifId);
      if (!vi) { quitView(dev); return errUnrecognized(cmd); }

      if (cmd === 'ip' && args[1] === 'address') {
        const ip = args[2];
        const mask = parseMask(args[3]);
        if (!E.isValidIp(ip) || mask == null) return errWrong(!E.isValidIp(ip) ? ip : args[3]);
        vi.ip = ip;
        vi.mask = mask;
        return { lines: [] };
      }
      if (cmd === 'undo' && args[1] === 'ip' && args[2] === 'address') {
        vi.ip = null;
        vi.mask = null;
        return { lines: [] };
      }
      if (cmd === 'description') { vi.desc = args.slice(1).join(' '); return { lines: [] }; }
      if (cmd === 'shutdown') { vi.enabled = false; return { lines: [] }; }
      if (cmd === 'undo' && args[1] === 'shutdown') { vi.enabled = true; return { lines: [] }; }
      if (cmd === 'dhcp' && args[1] === 'select') { vi.dhcpSelect = true; return { lines: [] }; }
      if (cmd === 'undo' && args[1] === 'dhcp' && args[2] === 'select') { vi.dhcpSelect = false; return { lines: [] }; }
      // Vlanif 上应用 ACL：过滤该 VLAN 内主机进出三层的流量（最常用的 ACL 应用方式）
      if (cmd === 'traffic-filter') {
        const dir = args[1];
        const aclIdx = args.findIndex((a) => a.toLowerCase() === 'acl');
        const aclId = aclIdx > 0 ? parseInt(args[aclIdx + 1], 10) : NaN;
        if (!['inbound', 'outbound'].includes(dir) || isNaN(aclId)) return errWrong(!['inbound', 'outbound'].includes(dir) ? dir : args[aclIdx + 1]);
        if (!dev.acl.find((a) => a.id === aclId)) {
          return { lines: [`Error: ACL ${aclId} does not exist.`, `// 提示：请先在系统视图执行 acl number ${aclId} 创建该 ACL。`] };
        }
        dev.aclBindings = dev.aclBindings.filter((b) => !(b.vlanifId === vi.vlanId && b.direction === dir));
        dev.aclBindings.push({ vlanifId: vi.vlanId, direction: dir, aclId });
        return { lines: [] };
      }
      if (cmd === 'undo' && args[1] === 'traffic-filter') {
        dev.aclBindings = dev.aclBindings.filter((b) => !(b.vlanifId === vi.vlanId && b.direction === args[2]));
        return { lines: [] };
      }
      return errUnrecognized(cmd);
    }

    /* ================= NAT 公网地址池视图 ================= */
    if (view === 'nat-group-view') {
      const g = (dev.natAddrGroups || []).find((x) => x.id === dev.cli.natGroupId);
      if (!g) { quitView(dev); return errUnrecognized(cmd); }

      if (cmd === 'section') {
        const index = parseInt(args[1], 10);
        const start = args[2];
        const end = args[3];
        if (isNaN(index)) return errWrong(args[1]);
        if (!E.isValidIp(start)) return errWrong(start);
        if (!E.isValidIp(end)) return errWrong(end);
        g.sections = g.sections.filter((s) => s.index !== index);
        g.sections.push({ index, start, end });
        g.sections.sort((a, b) => a.index - b.index);
        return { lines: [] };
      }
      if (cmd === 'undo' && args[1] === 'section') {
        const index = parseInt(args[2], 10);
        g.sections = g.sections.filter((s) => s.index !== index);
        return { lines: [] };
      }
      return errUnrecognized(cmd);
    }

    /* ================= Eth-Trunk 视图 ================= */
    if (view === 'trunk-view') {
      const members = dev.ports.filter((p) => p.trunkId === dev.cli.trunkId);
      if (!members.length) { quitView(dev); return errUnrecognized(cmd); }

      if (cmd === 'mode') {
        // 先校验再落配置，避免参数写错时配置已被改掉
        if (!['lacp-static', 'manual'].includes(args[1])) return errWrong(args[1]);
        if (args[1] === 'manual' && args[2] !== 'load-balance') return errWrong('mode');
        members.forEach((m) => { m.trunkMode = args[1] === 'manual' ? 'manual' : 'lacp'; });
        return { lines: [] };
      }
      if (cmd === 'ip' && args[1] === 'address') {
        const ip = args[2];
        const mask = parseMask(args[3]);
        if (!E.isValidIp(ip) || mask == null) return errWrong(!E.isValidIp(ip) ? ip : args[3]);
        members.forEach((m) => { m.mode = 'routed'; m.ip = ip; m.mask = mask; });
        return { lines: [] };
      }
      if (cmd === 'undo' && args[1] === 'ip' && args[2] === 'address') {
        members.forEach((m) => { m.ip = null; m.mask = null; });
        return { lines: [] };
      }
      if (cmd === 'description') {
        members.forEach((m) => (m.desc = args.slice(1).join(' ')));
        return { lines: [] };
      }
      return errUnrecognized(cmd);
    }

    /* ================= 地址池视图 ================= */
    if (view === 'pool-view') {
      const pool = dev.dhcp.pools.find((p) => p.name === dev.cli.poolName);
      if (!pool) { quitView(dev); return errUnrecognized(cmd); }

      if (cmd === 'network') {
        const net = args[1];
        const mi = args.findIndex((a) => a.toLowerCase() === 'mask');
        const mask = mi > 0 ? parseMask(args[mi + 1]) : null;
        if (!E.isValidIp(net) || mask == null) return errWrong(!E.isValidIp(net) ? net : args[mi + 1]);
        pool.network = E.networkOf(net, mask);
        pool.mask = mask;
        return { lines: [] };
      }
      if (cmd === 'gateway-list') {
        if (!E.isValidIp(args[1])) return errWrong(args[1]);
        pool.gateway = args[1];
        return { lines: [] };
      }
      if (cmd === 'dns-list') {
        if (!E.isValidIp(args[1])) return errWrong(args[1]);
        pool.dns = args[1];
        return { lines: [] };
      }
      if (cmd === 'excluded-ip-address') {
        if (!E.isValidIp(args[1])) return errWrong(args[1]);
        pool.excluded = pool.excluded || [];
        pool.excluded.push(args[1]);
        return { lines: [] };
      }
      if (cmd === 'lease') {
        const n = parseInt(args[2], 10) || 1;
        pool.leaseDays = n;
        return { lines: [] };
      }
      if (cmd === 'static-bind') {
        return { lines: ['（本模拟器暂不校验静态绑定，配置已记录）'] };
      }
      return errUnrecognized(cmd);
    }

    /* ================= ACL 视图 ================= */
    if (view === 'acl-view') {
      const acl = dev.acl.find((a) => a.id === dev.cli.aclId);
      if (!acl) { quitView(dev); return errUnrecognized(cmd); }

      if (cmd === 'rule') {
        const parsed = parseAclRule(args.slice(1));
        if (parsed.err) return parsed.err;
        const rule = parsed.rule;
        acl.rules = acl.rules.filter((r) => r.ruleId !== rule.ruleId);
        acl.rules.push(rule);
        acl.rules.sort((x, y) => x.ruleId - y.ruleId);
        return { lines: [] };
      }
      if (cmd === 'undo' && args[1] === 'rule') {
        if (String(args[2]).toLowerCase() === 'all') {
          acl.rules = [];
          return { lines: [] };
        }
        const ruleId = parseInt(args[2], 10);
        if (isNaN(ruleId)) return errWrong(args[2]);
        acl.rules = acl.rules.filter((r) => r.ruleId !== ruleId);
        return { lines: [] };
      }
      if (cmd === 'description') {
        acl.desc = args.slice(1).join(' ');
        return { lines: [] };
      }
      if (cmd === 'step') {
        const n = parseInt(args[1], 10);
        if (isNaN(n)) return errWrong(args[1]);
        acl.step = n;
        return { lines: [] };
      }
      return errUnrecognized(cmd);
    }

    /* ================= OSPF 视图 ================= */
    if (view === 'ospf-view') {
      if (cmd === 'router-id') {
        if (!E.isValidIp(args[1])) return errWrong(args[1]);
        dev.ospf.routerId = args[1];
        return { lines: [] };
      }
      if (cmd === 'area') {
        const areaId = args[1];
        if (areaId == null) return errIncomplete('area');
        const norm = areaId === '0' ? '0.0.0.0' : areaId;
        if (!dev.ospf.areas.find((a) => String(a.areaId) === String(norm))) {
          dev.ospf.areas.push({ areaId: norm, networks: [] });
        }
        enterView(dev, 'ospf-area-view', { ospfPid: dev.ospf.pid, areaId: norm });
        return { lines: [] };
      }
      return errUnrecognized(cmd);
    }

    /* ================= OSPF 区域视图 ================= */
    // quit 从这里只回上一级（OSPF 视图），不会直接跳到系统视图
    if (view === 'ospf-area-view') {
      const area = dev.ospf.areas.find((a) => String(a.areaId) === String(dev.cli.areaId));
      if (!area) { quitView(dev); return errUnrecognized(cmd); }
      if (cmd === 'network') {
        const ip = args[1];
        const wcArg = args[2];
        if (!E.isValidIp(ip) || !E.isValidIp(wcArg)) return errWrong(!E.isValidIp(ip) ? ip : wcArg);
        // network 要写反掩码（通配符掩码）。学生常把子网掩码 255.255.255.0 写进来 ——
        // 那样一个网段都不会命中、邻居永远起不来，而且原版不会有任何报错。这里自动换算并提示。
        const lines = [];
        let wc = wcArg;
        if (isSubnetMask(wcArg)) {
          wc = maskToWildcard(wcArg);
          lines.push(`// 提示：network 用的是反掩码（通配符掩码），已把 ${wcArg} 换算成 ${wc}。`);
        }
        area.networks = area.networks.filter((n) => !(n.ip === ip && n.wildcard === wc));
        area.networks.push({ ip, wildcard: wc });
        return { lines };
      }
      if (cmd === 'undo' && args[1] === 'network') {
        area.networks = area.networks.filter((n) => !(n.ip === args[2] && n.wildcard === args[3]));
        return { lines: [] };
      }
      return errUnrecognized(cmd);
    }

    /* ================= RIP 视图 ================= */
    if (view === 'rip-view') {
      const rip = dev.rip || (dev.rip = { enabled: false, pid: null, version: 1, networks: [], silent: [] });
      if (cmd === 'version') {
        const v = parseInt(args[1], 10);
        if (v !== 1 && v !== 2) return errWrong(args[1]);
        rip.version = v;
        return {
          lines:
            v === 2
              ? ['// 提示：本机已用 v2（组播 224.0.0.9）。对端也必须配 version 2，否则两端学不到路由。']
              : ['// 提示：v1 用广播、只按主类网络通告（不能带反掩码）。对端也必须是不配 version 的 v1。']
        };
      }
      if (cmd === 'network') {
        const ip = args[1];
        if (!E.isValidIp(ip)) return errWrong(ip);
        const lines = [];
        let wildcard = null;
        if (args[2] != null) {
          if (!E.isValidIp(args[2])) return errWrong(args[2]);
          wildcard = isSubnetMask(args[2]) ? maskToWildcard(args[2]) : args[2];
          if (isSubnetMask(args[2])) lines.push(`// 提示：反掩码写法应为 ${wildcard}（这里已自动换算）。`);
        }
        rip.networks = rip.networks.filter((n) => n.ip !== ip);
        rip.networks.push({ ip, wildcard });
        return { lines };
      }
      if (cmd === 'undo' && args[1] === 'network') {
        rip.networks = rip.networks.filter((n) => n.ip !== args[2]);
        return { lines: [] };
      }
      if (cmd === 'silent-interface') {
        const t = args[1];
        if (!t) return errIncomplete('silent-interface');
        if (t.toLowerCase() === 'all') {
          rip.silent = ['all'];
          return { lines: [] };
        }
        const r = resolveIface(dev, t);
        if (!r || r.kind === 'trunk') return errWrong(t);
        const name = r.kind === 'eth' ? r.port.name : r.label;
        if (!rip.silent.includes(name)) rip.silent.push(name);
        return { lines: [] };
      }
      if (cmd === 'undo' && args[1] === 'silent-interface') {
        const t = args[2];
        if (!t) rip.silent = [];
        else {
          const r = resolveIface(dev, t);
          const name = r ? (r.kind === 'eth' ? r.port.name : r.label) : t;
          rip.silent = rip.silent.filter((x) => x !== name);
        }
        return { lines: [] };
      }
      return errUnrecognized(cmd);
    }

    return errUnrecognized(cmd);
  }

  /* ------------------------------ 帮助提示 ------------------------------ */

  const VIEW_LABEL = {
    'user-view': '用户视图',
    'system-view': '系统视图',
    'vlan-view': 'VLAN 视图',
    'interface-view': '接口视图',
    'portgroup-view': '端口组视图',
    'vlanif-view': 'Vlanif 视图',
    'trunk-view': 'Eth-Trunk 视图',
    'pool-view': '地址池视图',
    'acl-view': 'ACL 视图',
    'nat-group-view': 'NAT 地址池视图',
    'ospf-view': 'OSPF 视图',
    'ospf-area-view': 'OSPF 区域视图',
    'rip-view': 'RIP 视图'
  };

  /** 把视图栈拼成"一级一级"的路径，帮学生搞清自己在第几层 */
  function viewChain(dev) {
    const chain = dev.cli.stack.map((f) => VIEW_LABEL[f.view] || f.view);
    chain.push(VIEW_LABEL[dev.cli.view] || dev.cli.view);
    return chain;
  }

  function helpLines(dev) {
    const v = dev.cli.view;
    const chain = viewChain(dev);
    const common = ['', `  ---- 当前视图路径：${chain.join('  ›  ')} ----`];
    if (chain.length > 1) common.push('  ---- quit 回上一级，return 直接回用户视图 ----');
    common.push('', '  ---- 本视图可用命令（模拟器提供）----');
    const map = {
      'user-view': [
        'system-view                  进入系统视图',
        'display version              查看版本信息',
        'display current-configuration  查看当前配置',
        'display ip interface brief   查看接口 IP 简要信息',
        'display interface <接口名>   查看接口详细信息',
        'display port vlan            查看端口 VLAN 归属',
        'display vlan                 查看 VLAN',
        'display ip routing-table     查看路由表',
        'display mac-address          查看 MAC 地址表',
        'display arp                  查看 ARP 表',
        'display stp brief            查看生成树状态',
        'display eth-trunk            查看链路聚合',
        'display ospf peer brief      查看 OSPF 邻居',
        'display ospf interface       查看 OSPF 接口状态',
        'display rip                  查看 RIP 进程与邻居',
        'display rip routing          查看 RIP 学到的路由',
        'display rip neighbor         查看 RIP 邻居',
        'display ip pool              查看 DHCP 地址池',
        'display acl all              查看所有 ACL 规则',
        'display nat session all      查看 NAT 地址转换表项',
        'display port-group all       查看永久端口组',
        'ping <ip>                    连通性测试',
        'tracert <ip>                 路由跟踪',
        'save                         保存配置（会先问 y/n，再问文件名）'
      ],

      ],
      'rip-view': [
        'version 1|2                  设置 RIP 版本（缺省 1；两端必须一致，一般都用 2）',
        'network <网段>               通告网段（只写 IP 时按 A/B/C 主类网络处理）',
        'network <网段> <反掩码>      按反掩码精确通告',

    };
    if (dev.type === 'pc') {
      return [
        '',
        '  ---- PC 可用命令 ----',
        'ipconfig                     查看 IP 配置',
        'ipconfig /renew              通过 DHCP 重新获取地址',
        'ipconfig /release            释放地址',
        'ip <地址> <掩码> <网关>      手工配置 IP',

    }
    return [...common, ...(map[v] || [])];
  }

  global.NE = global.NE || {};
  Object.assign(global.NE, {
    execute,
    promptOf,
    resolveIface,
    helpLines,
    computeMacTable,

  });
})(window);

</script>
<script>
/* =========================================================================
 * NE_HWSIM —— 华为 VRP 网络实训模拟器
 * 模块：配置导入（把「导出配置」生成的 running-config 文本重放回设备）
 *
 * Copyright (c) 2026 新易科技工作室 NewE
 * 作者：Liuyi  <yimr@sohu.com>
 * 协议：MIT License
 *
 * 本项目为独立的非官方教学演示工具，与华为技术有限公司无任何关联。
 * ========================================================================= */
(function (global) {
  'use strict';

  const E = global.NE;

  /* ------------------------------ 文本格式 ------------------------------
   * 导出文件长这样（每个设备一段）：
   *
   *   配置导出时间：2026/10/8 下午10:00
   *
   *   ==================================================================
   *   设备：SW1（S5700-28TP-EI）
   *   ==================================================================
   *   #
   *   sysname SW1
   *   ...
   * ---------------------------------------------------------------------- */

  /** 设备段表头：设备：SW1（S5700-28TP-EI） */
  const RE_HEAD = /^\s*设备\s*[:：]\s*(.+?)\s*[（(]\s*([^（()）]*?)\s*[)）]\s*$/;
  /** 段间分隔线 ====== */
  const RE_SEP = /^\s*={6,}\s*$/;
  /** 导出时间戳行 */
  const RE_STAMP = /^\s*(配置导出时间|导出时间|生成时间)\s*[:：]/;
  /** 纯分段符（VRP 里 # 表示一段配置结束） */
  const RE_META = /^(#+|!)$/;
  /** 会进入子视图的命令：遇到它说明上一段配置结束了 */
  const RE_VIEW_START = /^(vlan\s+\d+|interface\s+\S+|port-group\s+\S+|acl\s+(?:number\s+)?\d+|nat\s+address-group\s+\d+)$/i;

  /** 回显里是否出现错误行 */
  function isError(lines) {
    return (lines || []).some((l) => /^Error[: ]/.test(String(l).trim()));
  }

  /* ------------------------------ 拓扑段格式 ------------------------------
   * 导出的文件开头有一段给模拟器自己读的拓扑信息（人看也不难）：
   *
   *   @topology v1
   *   @device 0 S5700 120 80 SW1
   *   @device 1 PC 60 460 PC1
   *   @cable 0 GigabitEthernet0/0/1 1 Ethernet0/0/0
   *   @note 200 30 "办公区 192.168.10.0/24"
   *   @end
   *
   * 设备用序号引用（@cable 里写 0/1），这样设备名里有空格也不影响解析。
   * 没有这段也没关系 —— 那就退化成「只导入配置」，按设备表头重建。
   * ---------------------------------------------------------------------- */
  const RE_TOPO_START = /^@topology\b/i;
  const RE_TOPO_END = /^@end\b/i;
  const RE_DEVICE = /^@device\s+(\d+)\s+(\S+)\s+(-?\d+)\s+(-?\d+)\s+(.+)$/;
  const RE_CABLE = /^@cable\s+(\d+)\s+(\S+)\s+(\d+)\s+(\S+)$/;
  const RE_NOTE = /^@note\s+(-?\d+)\s+(-?\d+)\s+(.+)$/;

  /** 从整份文本里抽出拓扑段（没有就返回 null） */
  function parseTopology(lines) {
    const topo = { devices: [], cables: [], notes: [] };
    let inTopo = false;
    for (const raw of lines) {
      const t = String(raw).trim();
      if (RE_TOPO_START.test(t)) {
        inTopo = true;
        continue;
      }
      if (!inTopo) continue;
      if (RE_TOPO_END.test(t)) {
        inTopo = false;
        continue;
      }
      if (!t) continue;
      let m = t.match(RE_DEVICE);
      if (m) {
        topo.devices.push({ idx: +m[1], key: m[2], x: +m[3], y: +m[4], hostname: m[5].trim() });
        continue;
      }
      m = t.match(RE_CABLE);
      if (m) {
        topo.cables.push({ a: +m[1], aPort: m[2], b: +m[3], bPort: m[4] });
        continue;
      }
      m = t.match(RE_NOTE);
      if (m) {
        let text = m[3];
        try {
          text = JSON.parse(m[3]);
        } catch (e) {
          /* 容错：不是合法 JSON 就按原样当纯文本 */
        }
        topo.notes.push({ x: +m[1], y: +m[2], text: String(text == null ? '' : text) });
      }
    }
    return topo.devices.length || topo.cables.length || topo.notes.length ? topo : null;
  }

  /** 型号字符串 → 设备库 key（先按模板精确匹配，再按关键字兜底） */
  function modelToKey(model) {
    const m = String(model == null ? '' : model).trim();
    if (!m) return null;
    const T = E.TEMPLATES || {};
    for (const k of Object.keys(T)) {
      if (T[k].model === m) return k;
    }
    const up = m.toUpperCase();
    if (/S37\d\d|S27\d\d/.test(up)) return 'S3700';
    if (/S57\d\d|S67\d\d|S127\d\d/.test(up)) return 'S5700';
    if (/^AR\d/.test(up) || up.includes('ROUTER') || /^NE\d/.test(up)) return 'AR6121';
    if (up === 'PC' || up.includes('HOST') || up.includes('WINDOWS')) return 'PC';
    return null;
  }

  /* ------------------------------ 解析 ------------------------------ */

  /**
   * 把导出文本拆成若干设备段。
   * 有「设备：xxx（型号）」表头的走分段模式；
   * 完全没有表头时（例如直接从终端复制的 current-configuration），整份当成一段匿名配置。
   */
  function parse(text) {
    const lines = String(text == null ? '' : text).replace(/\r\n?/g, '\n').split('\n');
    const blocks = [];
    const orphans = [];
    const topo = parseTopology(lines);
    let cur = null;
    let headered = false;

    for (const raw of lines) {
      const t = raw.trim();
      if (RE_SEP.test(t) || RE_STAMP.test(t)) continue;
      if (RE_TOPO_START.test(t) || RE_TOPO_END.test(t)) continue;
      if (/^@(device|cable|note)\b/i.test(t)) continue; // 拓扑段的行不算设备配置
      const hm = t.match(RE_HEAD);
      if (hm) {
        headered = true;
        cur = { hostname: hm[1], model: hm[2], lines: [] };
        blocks.push(cur);
        continue;
      }
      if (cur) cur.lines.push(raw);
      else orphans.push(raw);
    }

    if (!headered) {
      const keep = orphans.filter((l) => {
        const t = l.trim();
        return t && !RE_SEP.test(t) && !RE_STAMP.test(t);
      });
      if (keep.length) blocks.push({ hostname: null, model: null, lines: keep });
    }

    return { blocks: blocks.filter((b) => b.lines.some((l) => l.trim())), headered, topo };
  }

  /* ------------------------------ 重放计划 ------------------------------ */

  /** ACL / NAT 地址池这类「被别的配置引用」的定义段：必须比引用者先重放 */
  const RE_DEFINITION = /^(acl\s+(?:number\s+)?\d+|nat\s+address-group\s+\d+)$/i;

  /**
   * running-config 里 ACL、NAT 地址池都排在 interface 段落之后，
   * 但 traffic-filter / nat outbound 会校验「引用的对象是否存在」，
   * 照原顺序逐行重放必然报 "does not exist"。所以把定义段整体提到最前面，
   * 原位置只留一个 # 分段符，保持其余段落的切分不变。
   */
  function hoistDefinitions(src) {
    const head = [];
    const rest = [];
    let i = 0;
    while (i < src.length) {
      if (RE_DEFINITION.test(src[i])) {
        while (i < src.length && !RE_META.test(src[i])) head.push(src[i++]);
        if (i < src.length) i++; // 吃掉定义段末尾的 #
        rest.push('#');
        continue;
      }
      rest.push(src[i++]);
    }
    return { head, rest };
  }

  /**
   * 把一份 running-config 变成可以喂给 E.execute 的命令序列。
   * running-config 是「结果快照」，没有视图层级信息，所以这里要按段落补回
   * quit / return / system-view，否则重放到第二个段落就会因为停在旧视图里而报错。
   */
  function plan(dev, lines) {
    const cmds = [];
    const unknown = [];
    const src = (lines || []).map((l) => String(l).trim()).filter(Boolean);

    /* --- PC 没有 VRP 命令行：导出的是 ip address / ip gateway 两行，要合并成一条 ip 命令 --- */
    if (dev.type === 'pc') {
      let ip = null;
      let mask = null;
      let gw = null;
      const flush = () => {
        if (ip && mask) cmds.push(`ip ${ip} ${mask}${gw ? ' ' + gw : ''}`);
        ip = mask = gw = null;
      };
      for (const t of src) {
        if (RE_META.test(t) || /^sysname\b/i.test(t)) continue; // 主机名由设备本身维护，重放会覆盖成导出时的名字
        let m = t.match(/^ip\s+address\s+(\S+)\s+(\S+)$/i);
        if (m) {
          flush();
          ip = m[1];
          mask = m[2];
          continue;
        }
        m = t.match(/^ip\s+gateway\s+(\S+)$/i);
        if (m) {
          gw = m[1];
          continue;
        }
        m = t.match(/^ip\s+(\S+)\s+(\S+)(?:\s+(\S+))?$/i); // 已经是 ip <地址> <掩码> [网关] 形式
        if (m) {
          flush();
          ip = m[1];
          mask = m[2];
          gw = m[3] || null;
          continue;
        }
        unknown.push(t);
      }
      flush();
      return { cmds, unknown };
    }

    let inView = false; // 是否正停在 vlan / interface / acl / port-group / nat address-group 这类子视图里
    let inSystem = false; // 是否已在系统视图

    // 回用户视图：VRP 的 return 从任意深度都能一步回用户视图，不用逐级 quit
    const toUser = () => {
      if (!inView && !inSystem) return;
      cmds.push('return');
      inView = false;
      inSystem = false;
    };
    // 回系统视图：子视图里退一级就回到系统视图，否则从用户视图进系统视图
    const toSystem = () => {
      if (inView) {
        cmds.push('quit');
        inView = false;
        return;
      }
      if (!inSystem) {
        cmds.push('system-view');
        inSystem = true;
      }
    };

    const hoisted = hoistDefinitions(src);
    for (const t of hoisted.head.concat(hoisted.rest)) {
      if (RE_META.test(t) || /^return$/i.test(t)) {
        toUser(); // 一个 # 代表一段配置结束，先退回用户视图再看下一段
        continue;
      }
      // port-group group-member 是临时端口组命令，不会进入命名端口组视图
      if (RE_VIEW_START.test(t) && !/^port-group\s+group-member\b/i.test(t)) {
        toSystem();
        cmds.push(t);
        inView = true;
        continue;
      }
      if (!inSystem) toSystem();
      cmds.push(t);
    }
    toUser();
    return { cmds, unknown };
  }

  /* ------------------------------ 导出 ------------------------------ */

  /**
   * 生成一份「拓扑 + 配置」文本。
   *   · 开头 @topology 段：设备（型号/坐标）、连线、文字标签 —— 给模拟器自己读回用；
   *   · 后面每台设备一段 running-config —— 给人看，也能单独复制粘贴到命令行。
   * 只有这个格式能「原样搬走」一张画布（以前只导配置，导入后设备全堆在一起、连线全丢）。
   */
  function buildText(opts) {
    const o = opts || {};
    const devs = (E.Net && E.Net.devices) || [];
    const cables = (E.Net && E.Net.cables) || [];
    const notes = (E.Net && E.Net.labels) || [];
    const idxOf = new Map(devs.map((d, i) => [d.id, i]));

    const out = [];
    out.push('# ============================================================');
    out.push('# NE_HWSIM 拓扑与配置导出');
    out.push('# 时间：' + (o.time || new Date().toLocaleString()));
    out.push('# 读回：在模拟器里点「导入配置」——会先按下面的 @topology 段还原设备位置与连线，');
    out.push('#       再逐台重放 running-config。只想抄某台设备，复制它那一段即可。');
    out.push('# ============================================================');
    out.push('');
    out.push('# ---------- 拓扑段（模拟器自用；删掉它就只导入配置）----------');
    out.push('@topology v1');
    devs.forEach((d, i) => {
      out.push(`@device ${i} ${d.key} ${Math.round(d.x)} ${Math.round(d.y)} ${d.hostname}`);
    });
    for (const c of cables) {
      const a = idxOf.get(c.aDeviceId);
      const b = idxOf.get(c.bDeviceId);
      if (a == null || b == null) continue;
      const pa = devs[a].ports.find((p) => p.id === c.aPortId);
      const pb = devs[b].ports.find((p) => p.id === c.bPortId);
      if (!pa || !pb) continue;
      out.push(`@cable ${a} ${pa.name} ${b} ${pb.name}`);
    }
    for (const n of notes) {
      if (!String(n.text || '').trim()) continue;
      out.push(`@note ${Math.round(n.x)} ${Math.round(n.y)} ${JSON.stringify(String(n.text))}`);
    }
    out.push('@end');
    out.push('');

    for (const d of devs) {
      out.push('='.repeat(66));
      out.push(`设备：${d.hostname}（${d.model}）`);
      out.push('='.repeat(66));
      out.push(...E.runningConfig(d));
      out.push('');
    }
    return out.join('\n');
  }

  /* ------------------------------ 应用 ------------------------------ */

  /**
   * 把配置文本应用到拓扑上。
   *  · 有同名设备 → 直接配到那台设备上
   *  · 没有同名设备 → 按表头里的型号新建一台（摆放在现有设备下方）
   *  · 文本没有表头 → 配到 opts.target 指定的设备上（一般传当前打开的设备）
   *
   * 注意：导出的是「设备配置」，不含连线。导入只会还原地址、VLAN、ACL、NAT 这些配置，
   * 线缆仍需在画布上自己连。
   */
  function applyConfigText(text, opts) {
    const o = opts || {};
    const parsed = parse(text);
    if (!parsed.blocks.length) {
      return {
        ok: false,
        message:
          '没有从文件里找到可识别的配置内容。请选择由「导出配置」生成的文件，或任意 VRP 的 current-configuration 文本。',
        results: []
      };
    }

    // 无表头的裸配置：只有画布上恰好一台设备时才敢推断目标
    let target = o.target || null;
    if (!parsed.headered && !target && E.Net.devices.length === 1) target = E.Net.devices[0];
    // 既没有设备表头、又不知道配给谁 → 直接说清楚，别让用户对着「已跳过」发呆
    if (!parsed.headered && !target) {
      return {
        ok: false,
        message:
          '文件里没有「设备：xxx（型号）」这样的表头，无法判断这份配置该配到哪台设备上。' +
          '请先双击一台设备打开它的命令行，再重新导入；或者导入由「导出配置」生成的完整文件。',
        results: []
      };
    }

    const results = [];
    let created = 0;
    let cursor = 0;
    const startY = E.Net.devices.length ? Math.max(...E.Net.devices.map((d) => d.y)) + 190 : 60;
    const place = () => {
      const x = 60 + (cursor % 4) * 300;
      const y = startY + Math.floor(cursor / 4) * 220;
      cursor++;
      return { x, y };
    };

    /* ---------------- 先还原拓扑（文件里带了 @topology 段才有） ----------------
     * 顺序很重要：设备得先就位（并挪到导出时的坐标），连线和配置才有地方落。
     * 同名设备一律复用，不会重复建一台。 */
    const createdByTopo = new Set();
    const warnings = [];
    let wires = 0;
    let notes = 0;
    if (parsed.topo) {
      const byIdx = [];
      for (const td of parsed.topo.devices) {
        let dev = E.Net.devices.find((d) => d.hostname === td.hostname) || null;
        if (dev) {
          dev.x = td.x;
          dev.y = td.y;
        } else {
          const key = (E.TEMPLATES && E.TEMPLATES[td.key] ? td.key : null) || modelToKey(td.key);
          if (!key) {
            warnings.push(`设备「${td.hostname}」的型号 ${td.key} 无法识别，已跳过`);
            byIdx[td.idx] = null;
            continue;
          }
          dev = E.Net.addDevice(key, td.x, td.y);
          dev.hostname = td.hostname;
          created += 1;
          createdByTopo.add(dev.hostname);
        }
        byIdx[td.idx] = dev;
      }

      for (const c of parsed.topo.cables) {
        const A = byIdx[c.a];
        const B = byIdx[c.b];
        if (!A || !B) {
          warnings.push(`连线 ${c.a}:${c.aPort} ↔ ${c.b}:${c.bPort}：设备缺失，已跳过`);
          continue;
        }
        const pa = A.ports.find((p) => p.name === c.aPort);
        const pb = B.ports.find((p) => p.name === c.bPort);
        if (!pa || !pb) {
          warnings.push(`${A.hostname} ${c.aPort} ↔ ${B.hostname} ${c.bPort}：端口不存在，已跳过`);
          continue;
        }
        const already = E.Net.cables.some(
          (x) =>
            (x.aDeviceId === A.id && x.aPortId === pa.id && x.bDeviceId === B.id && x.bPortId === pb.id) ||
            (x.aDeviceId === B.id && x.aPortId === pb.id && x.bDeviceId === A.id && x.bPortId === pa.id)
        );
        if (already) {
          wires += 1;
          continue;
        }
        if (pa.cableId || pb.cableId) {
          warnings.push(`${A.hostname} ${pa.name} 或 ${B.hostname} ${pb.name} 已被占用，这条线跳过`);
          continue;
        }
        const r = E.Net.addCable(A, pa, B, pb);
        if (r && r.ok) wires += 1;
        else warnings.push(`${A.hostname} ${pa.name} ↔ ${B.hostname} ${pb.name}：${(r && r.message) || '连接失败'}`);
      }

      for (const n of parsed.topo.notes) {
        const dup = (E.Net.labels || []).some(
          (l) => Math.abs(l.x - n.x) < 2 && Math.abs(l.y - n.y) < 2 && String(l.text) === String(n.text)
        );
        if (dup) continue;
        E.Net.addLabel(n.x, n.y, n.text);
        notes += 1;
      }
    }

    for (const b of parsed.blocks) {
      let dev = null;
      let isNew = false;
      if (b.hostname) dev = E.Net.devices.find((d) => d.hostname === b.hostname) || null;
      if (!dev && !b.hostname) dev = target;
      if (dev && createdByTopo.has(dev.hostname)) isNew = true;

      if (!dev) {
        const key = modelToKey(b.model);
        if (!key) {
          results.push({
            hostname: b.hostname || '(未命名)',
            model: b.model || '',
            isNew: false,
            total: 0,
            applied: 0,
            failed: [],
            unknown: [],
            skip: b.hostname
              ? `无法识别型号${b.model ? '「' + b.model + '」' : ''}，且拓扑里没有叫「${b.hostname}」的设备，已跳过。`
              : '文件没有设备表头，也没指定要配到哪台设备上，已跳过。'
          });
          continue;
        }
        const pos = place();
        dev = E.Net.addDevice(key, pos.x, pos.y);
        if (b.hostname) dev.hostname = b.hostname;
        isNew = true;
        created++;
      }

      const p = plan(dev, b.lines);
      const failed = [];
      let applied = 0;
      for (const c of p.cmds) {
        let r;
        try {
          r = E.execute(dev, c);
        } catch (err) {
          r = { lines: ['Error: ' + err.message] };
        }
        if (isError(r.lines)) failed.push({ cmd: c, lines: r.lines });
        else applied++;
      }

      // 收尾：不管重放停在哪个视图，都回到用户视图；交互式等待状态也要清掉，
      // 否则导入完设备会卡在「等 y/n」上。
      if (typeof E.resetCli === 'function') E.resetCli(dev);
      else {
        dev.cli.view = 'user-view';
        dev.cli.stack = [];
        dev.cli.pending = null;
      }

      results.push({
        hostname: dev.hostname,
        model: dev.model,
        isNew,
        total: p.cmds.length,
        applied,
        failed,
        unknown: p.unknown,
        skip: ''
      });
    }

    const bad = results.reduce((n, r) => n + r.failed.length, 0);
    const skipped = results.filter((r) => r.skip).length;
    return {
      ok: true,
      headered: parsed.headered,
      hasTopology: !!parsed.topo,
      results,
      created,
      wires,
      notes,
      warnings,
      bad,
      skipped,
      message:
        `共处理 ${results.length} 段配置` +
        (created ? `，新建 ${created} 台设备` : '') +
        (wires ? `，还原 ${wires} 条连线` : '') +
        (notes ? `，恢复 ${notes} 条注释` : '') +
        (bad ? `，${bad} 条命令未生效` : '，全部命令生效') +
        (skipped ? `，${skipped} 段已跳过` : '') +
        (warnings.length ? `，${warnings.length} 条连线有异常` : '') +
        '。'
    };
  }

  global.NE = global.NE || {};
  Object.assign(global.NE, {
    Import: { parse, parseTopology, plan, buildText, applyConfigText, modelToKey }
  });
})(window);

</script>
<script>
/* =========================================================================
 * NE_HWSIM —— 华为 VRP 网络实训模拟器
 * 模块：界面与交互（画布 / 拖拽 / 连线 / 终端 / 持久化 / 实训实验）
 *
 * Copyright (c) 2026 新易科技工作室 NewE
 * 作者：Liuyi  <yimr@sohu.com>
 * 协议：MIT License
 *
 * 本项目为独立的非官方教学演示工具，与华为技术有限公司无任何关联。
 * ========================================================================= */
(function (global) {
  'use strict';

  const E = global.NE;
  const $ = (id) => document.getElementById(id);

  /* ------------------------------ 版本信息 ------------------------------ */
  /* 版本号的唯一来源：改这一处即可。
     build.mjs 会把它读出来写进产物开头的注释，所以交付文件本身也能看出是哪个版本。 */
  const APP_VERSION = '1.4.0';
  const APP_INFO = {
    studio: '新易科技工作室 NewE',
    author: 'Liuyi',
    email: 'yimr@sohu.com',
    city: '福州',
    repo: 'https://github.com/liuyimr/NE_HWSIM',
    online: 'https://liuyimr.github.io/NE_HWSIM/NE_HWSIM.html'
  };

  /* ------------------------------ 布局尺寸 ------------------------------ */
  /* 尺寸的唯一来源是 index.html 里的 CSS 变量（--card-w / --port-h / --head-h ...）。
     移动端的媒体查询只改那几个变量，JS 这边跟着变，两边不会各写一套导致连线端点错位。
     （过去 JS 和 CSS 各写一份，改一处就会让连线偏离端口中心。） */
  const COLS = 14;
  const PC_COLS = 4; // PC 只有一个网口，列数少一点，单口才不至于挤成一个小方块
  const BORDER = 1; // .card 的 border 宽度。box-sizing 是 border-box，算端口坐标时必须减掉

  const M_FALLBACK = {
    cardW: 260, pcW: 126, padX: 13, gap: 3, portH: 14,
    headH: 46, headHPc: 30, portsPadTop: 6, portsPadTopPc: 4, cardBottomPad: 12, cardBottomPadPc: 7
  };
  let M = null; // 缓存的尺寸表
  function metrics() {
    if (M) return M;
    const cs = getComputedStyle(document.documentElement);
    const px = (name, dft) => {
      const v = parseFloat(cs.getPropertyValue(name));
      return Number.isFinite(v) ? v : dft;
    };
    M = {
      cardW: px('--card-w', M_FALLBACK.cardW),
      pcW: px('--card-w-pc', M_FALLBACK.pcW),
      padX: px('--pad-x', M_FALLBACK.padX),
      gap: px('--gap', M_FALLBACK.gap),
      portH: px('--port-h', M_FALLBACK.portH),
      headH: px('--head-h', M_FALLBACK.headH),
      headHPc: px('--head-h-pc', M_FALLBACK.headHPc),
      portsPadTop: px('--ports-pt', M_FALLBACK.portsPadTop),
      portsPadTopPc: px('--ports-pt-pc', M_FALLBACK.portsPadTopPc),
      cardBottomPad: px('--ports-pb', M_FALLBACK.cardBottomPad),
      cardBottomPadPc: px('--ports-pb-pc', M_FALLBACK.cardBottomPadPc)
    };
    return M;
  }
  /** 尺寸可能随窗口/旋屏/媒体查询变化，这些时机要丢掉缓存重新读 */
  function invalidateMetrics() {
    M = null;
  }

  /* ------------------------------ 运行时状态 ------------------------------ */
  const UI = {
    scale: 1,
    panX: 0,
    panY: 0,
    selDev: null,
    selCable: null, // 当前选中的连线（可 Delete 删除）
    selNote: null, // 当前选中的文字标签
    editingNote: null, // 正在编辑文字（textarea 状态）
    replug: null, // 正在拖拽改接的连线 { id, end:'a'|'b', x, y }
    pend: null, // { devId, portId }
    tabs: [],
    activeTab: null,
    hist: {},
    histIdx: -1,
    labs: [],
    currentLab: null
  };

  /* ------------------------------ 提示条 ------------------------------ */
  let toastTimer = null;
  function toast(msg, kind) {
    const el = $('toast');
    el.textContent = msg;
    el.className = 'toast on' + (kind ? ' ' + kind : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => (el.className = 'toast'), 2200);
  }

  /* ------------------------------ 坐标换算 ------------------------------ */
  /* PC 只有一个网口：卡片既矮又窄，端口网格的列数也跟着少 */
  function cardW(dev) {
    const m = metrics();
    return dev.type === 'pc' ? m.pcW : m.cardW;
  }
  function colsOf(dev) {
    return dev.type === 'pc' ? PC_COLS : COLS;
  }
  function colW(dev) {
    const m = metrics();
    const n = colsOf(dev);
    return (cardW(dev) - 2 * BORDER - 2 * m.padX - (n - 1) * m.gap) / n;
  }
  function headH(dev) {
    const m = metrics();
    return dev.type === 'pc' ? m.headHPc : m.headH;
  }
  function portsPadTop(dev) {
    const m = metrics();
    return dev.type === 'pc' ? m.portsPadTopPc : m.portsPadTop;
  }
  function cardBottomPad(dev) {
    const m = metrics();
    return dev.type === 'pc' ? m.cardBottomPadPc : m.cardBottomPad;
  }

  function portCenter(dev, idx) {
    const m = metrics();
    const cols = colsOf(dev);
    const w = colW(dev);
    const col = idx % cols;
    const row = Math.floor(idx / cols);
    return {
      x: dev.x + BORDER + m.padX + col * (w + m.gap) + w / 2,
      y: dev.y + BORDER + headH(dev) + portsPadTop(dev) + row * (m.portH + m.gap) + m.portH / 2
    };
  }

  function cardHeight(dev) {
    const m = metrics();
    const cols = colsOf(dev);
    const rows = Math.ceil(dev.ports.length / cols) || 1;
    return 2 * BORDER + headH(dev) + portsPadTop(dev) + rows * m.portH + (rows - 1) * m.gap + cardBottomPad(dev);
  }

  function screenToWorld(sx, sy) {
    const rect = $('stage').getBoundingClientRect();
    return {
      x: (sx - rect.left - UI.panX) / UI.scale,
      y: (sy - rect.top - UI.panY) / UI.scale
    };
  }

  function applyTransform() {
    $('stageInner').style.transform = `translate(${UI.panX}px, ${UI.panY}px) scale(${UI.scale})`;
  }

  /* ------------------------------ 设备库 ------------------------------ */
  function renderPalette() {
    const items = [
      { key: 'S5700', ic: '🔀', name: '三层交换机', sub: 'S5700-28TP-EI' },
      { key: 'S3700', ic: '🔀', name: '二层交换机', sub: 'S3700-28TP-EI' },
      { key: 'AR6121', ic: '📡', name: '路由器', sub: 'AR6121' },
      { key: 'PC', ic: '💻', name: 'PC 终端', sub: 'Windows 主机' }
    ];
    $('palette').innerHTML = items
      .map(
        (it) => `<button class="pal" data-k="${it.key}">
          <span class="ic">${it.ic}</span>
          <span class="tx"><b>${it.name}</b><span>${it.sub}</span></span>
        </button>`
      )
      .join('');
    $('palette').querySelectorAll('.pal').forEach((b) => {
      b.onclick = () => {
        const m = metrics();
        // 放到「当前可见画布」的中心，而不是整个窗口中心 —— 手机上有底部设备条和命令行面板，窗口中心会偏
        const rect = $('stage').getBoundingClientRect();
        const w = screenToWorld(rect.left + rect.width / 2, rect.top + rect.height / 2);
        const half = b.dataset.k === 'PC' ? m.pcW : m.cardW;
        // 加一点随机偏移，连续加多台不会完全重叠
        const n = E.Net.devices.length;
        const dx = (n % 3) * 34 - 34;
        const dy = (n % 4) * 30 - 30;
        const d = E.Net.addDevice(b.dataset.k, Math.round(w.x - half / 2 + dx), Math.round(w.y - 60 + dy));
        autoName(d);
        render();
        toast(`已添加 ${d.hostname}，拖动卡片摆放位置`, 'good');
      };
    });
  }

  let nameSeq = {};
  function autoName(dev) {
    const base = dev.type === 'pc' ? 'PC' : dev.type === 'router' ? 'R' : 'SW';
    nameSeq[base] = (nameSeq[base] || 0) + 1;
    dev.hostname = base + nameSeq[base];
  }

  /* ------------------------------ 画布渲染 ------------------------------ */
  function render() {
    const cards = $('cards');
    cards.innerHTML = '';

    for (const d of E.Net.devices) {
      const el = document.createElement('div');
      el.className = 'card' + (UI.selDev === d.id ? ' sel' : '') + (d.type === 'pc' ? ' compact' : '');
      el.style.left = d.x + 'px';
      el.style.top = d.y + 'px';
      el.style.width = cardW(d) + 'px';
      el.dataset.id = d.id;

      const tagTxt = d.type === 'pc' ? 'PC' : d.type === 'router' ? 'Router' : d.key === 'S3700' ? 'L2 Switch' : 'L3 Switch';
      el.innerHTML = `
        <div class="head">
          <div style="min-width:0">
            <div class="nm">${esc(d.hostname)}</div>
            <div class="md">${d.model}</div>
          </div>
          <span class="tag">${tagTxt}</span>
          <span class="x" title="删除设备">×</span>
        </div>
        <div class="ports" style="grid-template-columns:repeat(${colsOf(d)},1fr)"></div>`;

      const portsEl = el.querySelector('.ports');
      d.ports.forEach((p, i) => {
        const pe = document.createElement('div');
        pe.className = 'port ' + portClass(d, p);
        pe.title = `${p.name}\n${portTitle(d, p)}`;
        pe.innerHTML = `<span class="lab">${p.name.replace('GigabitEthernet', 'GE')}</span>`;
        // 端口不参与卡片拖动，事件也不往卡片冒泡（否则点端口会顺手把卡片拖走）
        pe.addEventListener('pointerdown', (ev) => ev.stopPropagation());
        bindGestures(pe, {
          slop: 6,
          onTap: (ev) => {
            ev.stopPropagation();
            onPortClick(d, p);
          },
          // 双击已连线的端口 = 快速断开（比"选中连线再删"顺手）；触摸端同样支持双击
          onDoubleTap: (ev) => {
            ev.stopPropagation();
            UI.pend = null;
            if (p.cableId) removeCable(p.cableId);
            else toast(`${p.name}：${portTitle(d, p)}`);
          },
          // 长按端口：触摸端没有鼠标悬停，用长按把端口详情说出来
          onLongPress: () => toast(`${p.name} · ${portTitle(d, p)}`, '')
        });
        portsEl.appendChild(pe);
      });

      const head = el.querySelector('.head');
      // 卡片头：拖动移动设备；单击选中；双击开命令行；长按删除（触摸端没有右键）
      bindGestures(head, {
        onDown: (ev, ctx) => {
          // 点右上角 × 时不启动拖动，交给那个按钮自己处理
          if (ev.target && ev.target.classList && ev.target.classList.contains('x')) return;
          ev.stopPropagation();
          startDrag(ev, d, el, ctx);
        },
        onMove: (ev, ctx) => {
          if (!ctx.ox && !ctx.oy && !ctx.moved) return;
          moveDrag(d, el, ctx);
        },
        onUp: (ev, ctx) => endDrag(d, ctx),
        onTap: () => selectDevice(d),
        onDoubleTap: () => openConsole(d),
        onLongPress: () => removeDevice(d),
        onContextMenu: () => removeDevice(d) // 桌面右键仍是删除
      });
      el.querySelector('.x').onclick = (ev) => {
        ev.stopPropagation();
        removeDevice(d);
      };
      // 点卡片空白处（端口网格的缝隙）也算选中这台设备
      el.addEventListener('pointerdown', (ev) => {
        if (ev.target.closest && ev.target.closest('.head,.port')) return;
        selectDevice(d);
      });

      cards.appendChild(el);
    }

    renderWires();
    renderNotes();
    $('empty').style.display = E.Net.devices.length ? 'none' : 'flex';
  }

  function selectDevice(dev) {
    const changed = UI.selDev !== dev.id;
    UI.selDev = dev.id;
    UI.selCable = null;
    UI.selNote = null;
    if (changed) render();
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  }

  function portClass(dev, p) {
    const cls = [];
    if (p.cableId && !p.shutdown) cls.push('up');
    if (p.shutdown) cls.push('shut');
    if (p.mode === 'trunk') cls.push('trunk');
    if (UI.pend && UI.pend.devId === dev.id && UI.pend.portId === p.id) cls.push('pend');
    return cls.join(' ');
  }

  function portTitle(dev, p) {
    const rows = [];
    rows.push(p.shutdown ? '状态：已关闭（shutdown）' : p.cableId ? '状态：已连线 Up' : '状态：未连线 Down');
    rows.push('类型：' + (p.mode === 'routed' ? '路由口' : p.mode === 'trunk' ? 'Trunk' : p.mode === 'hybrid' ? 'Hybrid' : 'Access'));
    if (p.mode === 'access') rows.push('VLAN：' + p.vlan);
    if (p.mode === 'trunk') rows.push('放行 VLAN：' + (p.allowedVlans === 'all' ? 'all' : (p.allowedVlans || []).join(',')));
    if (p.ip) rows.push('IP：' + p.ip + '/' + p.mask);
    if (p.trunkId != null) rows.push('Eth-Trunk' + p.trunkId);
    return rows.join('  |  ');
  }

  /**
   * 画连线。每条线由三层组成：
   *   .wire      看得见的线（本身不可点，避免挡住设备卡片）
   *   .wire-hit  加粗的透明命中区 —— 唯一可点的部分
   *   .wire-x    悬停 / 选中时浮现的删除按钮
   * 父级 <svg class="wires"> 是 pointer-events:none，靠子元素自己把事件要回来，
   * 这样画布空白处仍然能拖动平移。
   */
  function renderWires() {
    const svg = $('wires');
    let html = '';
    for (const c of E.Net.cables) {
      const a = E.Net.getDevice(c.aDeviceId);
      const b = E.Net.getDevice(c.bDeviceId);
      if (!a || !b) continue;
      const ia = a.ports.findIndex((p) => p.id === c.aPortId);
      const ib = b.ports.findIndex((p) => p.id === c.bPortId);
      if (ia < 0 || ib < 0) continue;
      const pa = portCenter(a, ia);
      const pb = portCenter(b, ib);

      // 正在拖拽改接的这一条：不画原线，改画一条跟随鼠标的示意线
      if (UI.replug && UI.replug.id === c.id) {
        const fixedIdx = UI.replug.end === 'a' ? ib : ia;
        const fixedDev = UI.replug.end === 'a' ? b : a;
        const fp = portCenter(fixedDev, fixedIdx);
        html += `<line class="wire-rubber" x1="${fp.x}" y1="${fp.y}"
          x2="${UI.replug.x}" y2="${UI.replug.y}" vector-effect="non-scaling-stroke"/>`;
        continue;
      }

      const alive = !a.ports[ia].shutdown && !b.ports[ib].shutdown;
      const sel = UI.selCable === c.id ? ' sel' : '';
      const mx = (pa.x + pb.x) / 2;
      const my = (pa.y + pb.y) / 2;
      const label = `${a.hostname} ${a.ports[ia].name} ↔ ${b.hostname} ${b.ports[ib].name}`;
      html += `<g class="wire-g${sel}" data-cable="${c.id}">
        <line class="wire" x1="${pa.x}" y1="${pa.y}" x2="${pb.x}" y2="${pb.y}"
          stroke="${alive ? '#3fb950' : '#6e7681'}" vector-effect="non-scaling-stroke"/>
        <line class="wire-hit" x1="${pa.x}" y1="${pa.y}" x2="${pb.x}" y2="${pb.y}"
          vector-effect="non-scaling-stroke"><title>${esc(label)} —— 点击选中 / 拖动改接 / 右键删除</title></line>
        <g class="wire-x" data-del="${c.id}" transform="translate(${mx},${my})">
          <g class="wire-x-in">
            <circle r="7.5" vector-effect="non-scaling-stroke"/>
            <path d="M-2.7 -2.7 L2.7 2.7" vector-effect="non-scaling-stroke"/>
            <path d="M2.7 -2.7 L-2.7 2.7" vector-effect="non-scaling-stroke"/>
          </g>
          <title>删除这条连线</title>
        </g>
      </g>`;
    }
    svg.innerHTML = html;
    bindWires();
  }

  /** 连线是 innerHTML 重建的，事件得每次重新绑 */
  function bindWires() {
    const svg = $('wires');
    for (const hit of svg.querySelectorAll('.wire-hit')) {
      const id = hit.parentNode.dataset.cable;
      bindGestures(hit, {
        slop: 6,
        onDown: (ev, ctx) => {
          ev.stopPropagation();
          startCableDrag(ev, id, ctx);
        },
        onMove: (ev, ctx) => {
          if (!ctx.moved) return;
          ctx.lastX = ev.clientX;
          ctx.lastY = ev.clientY;
          moveCableDrag(ctx);
        },
        onUp: (ev, ctx) => {
          ctx.lastX = ev.clientX;
          ctx.lastY = ev.clientY;
          endCableDrag(ctx);
        },
        onTap: () => selectCable(id),
        onLongPress: () => removeCable(id),
        onContextMenu: () => removeCable(id)
      });
    }
    for (const x of svg.querySelectorAll('.wire-x')) {
      // × 按钮：用 pointerdown 拦下来，别让它触发下面连线的拖拽
      x.addEventListener('pointerdown', (ev) => ev.stopPropagation());
      x.onclick = (ev) => {
        ev.stopPropagation();
        removeCable(x.dataset.del);
      };
    }
  }

  /* ------------------------------ 指针手势 ------------------------------ */
  /**
   * 鼠标和触摸走同一套逻辑（Pointer Events）。
   *
   * 为什么必须这样：**手机上拖动不会连续触发 mousemove** —— 兼容鼠标事件只在抬手时补一次，
   * 所以原来那套 mousedown/mousemove/mouseup 在手机上表现为「按下去没反应、松手跳一下」，
   * 也就是「部件拖不动」。同时触摸端还缺两种能力：
   *   · dblclick 不可靠（双击既不触发 click 也不触发 dblclick，浏览器可能在等双击缩放）
   *   · contextmenu（右键）压根没有
   * 所以这里把它们补成双击（doubleTap）和长按（longPress）。
   *
   * opt:
   *   onDown(ev, ctx) / onMove(ev, ctx) / onUp(ev, ctx)  —— 拖动全过程（ctx 里带 dx/dy/moved）
   *   onTap(ev)        单击（没怎么移动、也没触发长按）
   *   onDoubleTap(ev)  双击 / 双击两下
   *   onLongPress(ev)  长按（代替右键）
   *   onContextMenu(ev) 鼠标右键（触摸端不会触发，触摸端用 onLongPress）
   *   slop             判定「算不算移动」的阈值（屏幕像素）
   */
  const TAP_SLOP = 8;
  const DOUBLE_TAP_MS = 320;
  const LONG_PRESS_MS = 520;

  function bindGestures(el, opt) {
    const slop = opt.slop == null ? TAP_SLOP : opt.slop;
    let pid = null;
    let sx = 0;
    let sy = 0;
    let longTimer = null;
    let lastTapAt = 0;
    let longFired = false;
    let lastType = 'mouse';
    const ctx = { dx: 0, dy: 0, moved: false };

    const clearLong = () => {
      if (longTimer) {
        clearTimeout(longTimer);
        longTimer = null;
      }
    };
    const release = (ev) => {
      clearLong();
      if (pid !== null) {
        try { el.releasePointerCapture(pid); } catch (e) { /* 已自动释放 */ }
      }
      pid = null;
      void ev;
    };

    el.addEventListener('pointerdown', (ev) => {
      lastType = ev.pointerType || 'mouse';
      if (ev.button != null && ev.button !== 0) return; // 只认左键 / 单指
      if (pid !== null) return; // 已经有一根手指在操作这个元素
      pid = ev.pointerId;
      sx = ev.clientX;
      sy = ev.clientY;
      ctx.dx = 0;
      ctx.dy = 0;
      ctx.moved = false;
      longFired = false;
      try { el.setPointerCapture(pid); } catch (e) { /* 某些环境不支持，忽略 */ }
      if (opt.onDown) opt.onDown(ev, ctx);
      if (opt.onLongPress) {
        longTimer = setTimeout(() => {
          longTimer = null;
          longFired = true;
          ctx.moved = true; // 长按之后不再当成拖动/单击
          if (opt.onUp) opt.onUp(ev, ctx);
          opt.onLongPress(ev);
        }, LONG_PRESS_MS);
      }
    });

    el.addEventListener('pointermove', (ev) => {
      if (ev.pointerId !== pid) return;
      ctx.dx = ev.clientX - sx;
      ctx.dy = ev.clientY - sy;
      if (!ctx.moved && Math.hypot(ctx.dx, ctx.dy) > slop) {
        ctx.moved = true;
        clearLong(); // 一旦开始拖动就不再触发长按
      }
      if (opt.onMove) opt.onMove(ev, ctx);
    });

    const finish = (ev) => {
      if (ev.pointerId !== pid) return;
      const moved = ctx.moved;
      const long = longFired;
      release(ev);
      if (long) return;
      if (moved) {
        if (opt.onUp) opt.onUp(ev, ctx);
        return;
      }
      if (opt.onUp) opt.onUp(ev, ctx);
      const now = Date.now();
      if (opt.onDoubleTap && now - lastTapAt < DOUBLE_TAP_MS) {
        lastTapAt = 0;
        opt.onDoubleTap(ev);
      } else {
        lastTapAt = now;
        if (opt.onTap) opt.onTap(ev);
      }
    };
    el.addEventListener('pointerup', finish);
    el.addEventListener('pointercancel', (ev) => {
      if (ev.pointerId !== pid) return;
      ctx.moved = true; // 当作「拖动被取消」，不做单击判定
      release(ev);
    });
    // 触摸长按会弹出系统的「复制 / 搜索」菜单，一律禁掉。
    // 鼠标右键则交给 onContextMenu（触摸端已经用 longPress 覆盖，不重复触发）。
    el.addEventListener('contextmenu', (ev) => {
      ev.preventDefault();
      ev.stopPropagation();
      if (opt.onContextMenu && lastType !== 'touch') opt.onContextMenu(ev);
    });
  }

  /* ------------------------------ 拖动 ------------------------------ */
  /** 拖动设备卡片（鼠标左键拖 / 手指拖，走同一套 pointer 事件） */
  function startDrag(ev, dev, el, ctx) {
    ctx.ox = dev.x;
    ctx.oy = dev.y;
    void ev;
    void el;
  }

  function moveDrag(dev, el, ctx) {
    dev.x = Math.round(ctx.ox + ctx.dx / UI.scale);
    dev.y = Math.round(ctx.oy + ctx.dy / UI.scale);
    el.style.left = dev.x + 'px';
    el.style.top = dev.y + 'px';
    renderWires();
  }

  function endDrag(dev, ctx) {
    if (!ctx.moved) return;
    persist();
    UI.selDev = dev.id;
    render();
  }

  /* ------------------------------ 画布文字标签 ------------------------------
   * 用来在拓扑上写注释（"办公区 /24"、"这里是出口" 之类）。
   * 交互与设备卡片保持一致：拖动移动、双击编辑、长按（手机）/右键（桌面）删除。
   * 编辑时换成 textarea —— 手机上输入框字号 16px，否则 iOS 会自动放大整页。
   */
  function selectNote(l) {
    const next = l ? l.id : null;
    if (UI.selNote === next) return;
    UI.selNote = next;
    UI.selDev = null;
    UI.selCable = null;
    renderNotes();
  }

  function addNote() {
    const w = screenToWorld(window.innerWidth / 2, window.innerHeight / 2);
    const n = E.Net.addLabel(w.x - 40, w.y - 14, '');
    UI.selNote = n.id;
    UI.editingNote = n.id;
    persist();
    renderNotes();
    return n;
  }

  function removeNote(l) {
    E.Net.removeLabel(l.id);
    if (UI.selNote === l.id) UI.selNote = null;
    if (UI.editingNote === l.id) UI.editingNote = null;
    persist();
    renderNotes();
  }

  function commitNote(l, text) {
    if (UI.editingNote !== l.id) return;
    UI.editingNote = null;
    const v = String(text == null ? '' : text).replace(/\s+$/, '');
    // 留空就当作删除（和大部分注释工具的手感一致）
    if (!v.trim()) E.Net.removeLabel(l.id);
    else l.text = v;
    persist();
    renderNotes();
  }

  function startEditNote(l) {
    UI.selNote = l.id;
    UI.editingNote = l.id;
    renderNotes();
  }

  function autoGrowNote(ta) {
    ta.style.height = 'auto';
    ta.style.height = Math.max(24, ta.scrollHeight) + 'px';
    ta.style.width = 'auto';
    ta.style.width = Math.min(260, Math.max(90, ta.scrollWidth + 4)) + 'px';
  }

  function renderNotes() {
    const box = $('notes');
    if (!box) return;
    box.innerHTML = '';
    for (const l of E.Net.labels || []) {
      if (UI.editingNote === l.id) {
        const wrap = document.createElement('div');
        wrap.className = 'note editing';
        wrap.dataset.note = l.id;
        wrap.style.left = l.x + 'px';
        wrap.style.top = l.y + 'px';
        const ta = document.createElement('textarea');
        ta.className = 'note-input';
        ta.value = l.text || '';
        ta.rows = 1;
        ta.placeholder = '输入注释…';
        wrap.appendChild(ta);
        box.appendChild(wrap);
        ta.addEventListener('input', () => autoGrowNote(ta));
        ta.addEventListener('keydown', (ev) => {
          ev.stopPropagation(); // 别让 Delete/Backspace 传到画布的删除逻辑
          if (ev.key === 'Escape') {
            ev.preventDefault();
            UI.editingNote = null;
            renderNotes();
          } else if (ev.key === 'Enter' && (ev.ctrlKey || ev.metaKey)) {
            ev.preventDefault();
            commitNote(l, ta.value);
          }
        });
        ta.addEventListener('blur', () => commitNote(l, ta.value));
        requestAnimationFrame(() => {
          autoGrowNote(ta);
          try {
            ta.focus();
            ta.setSelectionRange(ta.value.length, ta.value.length);
          } catch (e) { /* 忽略 */ }
        });
        continue;
      }

      const el = document.createElement('div');
      el.className = 'note' + (UI.selNote === l.id ? ' sel' : '') + (String(l.text || '').trim() ? '' : ' blank');
      el.dataset.note = l.id;
      el.style.left = l.x + 'px';
      el.style.top = l.y + 'px';
      el.textContent = String(l.text || '').trim() ? l.text : '双击输入注释';
      box.appendChild(el);
      bindNoteGestures(el, l);
    }
  }

  function bindNoteGestures(el, l) {
    bindGestures(el, {
      onDown: (ev, ctx) => {
        ctx.ox = l.x;
        ctx.oy = l.y;
        // ❗这里只切高亮 class，**不能调 selectNote()** —— 它会整块重绘 #notes，
        // 把正在拖的这个元素换掉，pointer capture 随之失效，表现就是「第一下拖不动」。
        if (UI.selNote !== l.id) {
          UI.selNote = l.id;
          UI.selDev = null;
          UI.selCable = null;
          const box = $('notes');
          if (box) box.querySelectorAll('.note').forEach((n) => n.classList.toggle('sel', n.dataset.note === l.id));
        }
      },
      onMove: (ev, ctx) => {
        if (!ctx.moved) return;
        l.x = Math.round(ctx.ox + ctx.dx / UI.scale);
        l.y = Math.round(ctx.oy + ctx.dy / UI.scale);
        el.style.left = l.x + 'px';
        el.style.top = l.y + 'px';
      },
      onUp: (ev, ctx) => {
        if (ctx.moved) persist();
      },
      onTap: () => selectNote(l),
      onDoubleTap: () => startEditNote(l),
      onLongPress: () => removeNote(l),
      onContextMenu: () => removeNote(l)
    });
  }

  /* ------------------------------ 连线 ------------------------------ */
  function onPortClick(dev, port) {
    if (!UI.pend) {
      UI.pend = { devId: dev.id, portId: port.id };
      render();
      return;
    }
    if (UI.pend.devId === dev.id && UI.pend.portId === port.id) {
      UI.pend = null;
      render();
      return;
    }
    const from = E.Net.getDevice(UI.pend.devId);
    const fromPort = from && E.Net.getPort(from, UI.pend.portId);
    if (!from || !fromPort) {
      UI.pend = null;
      render();
      return;
    }
    const res = E.Net.addCable(from, fromPort, dev, port);
    UI.pend = null;
    if (!res.ok) {
      toast(res.message, 'bad');
      render();
      return;
    }
    E.recomputeOspf();
    E.recomputeRip();
    E.recomputeStp();
    persist();
    render();
    toast(`${from.hostname} ${fromPort.name} ↔ ${dev.hostname} ${port.name} 连接成功`, 'good');
  }

  /**
   * 删除一条连线。
   * 这里**故意不加二次确认**：删线只断开物理连接，两端设备的配置一条都不会丢，
   * 想恢复的话点两个端口就接回来了 —— 和设备删除（会丢配置，所以有确认）不是一回事。
   */
  function removeCable(id) {
    const c = E.Net.getCable(id);
    if (!c) return;
    const a = E.Net.getDevice(c.aDeviceId);
    const b = E.Net.getDevice(c.bDeviceId);
    const pa = a && E.Net.getPort(a, c.aPortId);
    const pb = b && E.Net.getPort(b, c.bPortId);
    const label = pa && pb ? `${a.hostname} ${pa.name} ↔ ${b.hostname} ${pb.name}` : '连线';
    E.Net.removeCable(id);
    if (UI.selCable === id) UI.selCable = null;
    UI.pend = null;
    E.recomputeOspf();
    E.recomputeRip();
    E.recomputeStp();
    persist();
    render();
    toast('已断开 ' + label, 'good');
  }

  /** 鼠标位置下面是哪个端口（拖拽改接时用来找落点） */
  function portUnderPoint(x, y) {
    const el = document.elementFromPoint(x, y);
    if (!el || !el.classList || !el.classList.contains('port')) return null;
    const card = el.closest('.card');
    if (!card) return null;
    const dev = E.Net.getDevice(card.dataset.id);
    if (!dev) return null;
    const idx = [...card.querySelectorAll('.port')].indexOf(el);
    if (idx < 0 || !dev.ports[idx]) return null;
    return { dev, port: dev.ports[idx] };
  }

  /** 把一条连线的一端改接到另一个端口上（先摘下来再接，失败就原样接回去） */
  function moveCableEnd(cable, end, dev, port) {
    if (UI.replug) UI.replug = null;
    if (!cable || !dev || !port) return render();
    if (port.cableId === cable.id) return render(); // 拖回原处，等于没动
    if (port.cableId) {
      toast(`${dev.hostname} 的 ${port.name} 已被占用`, 'bad');
      return render();
    }
    const ends = {
      a: { devId: cable.aDeviceId, portId: cable.aPortId },
      b: { devId: cable.bDeviceId, portId: cable.bPortId }
    };
    const keep = end === 'a' ? ends.b : ends.a;
    const keepDev = E.Net.getDevice(keep.devId);
    const keepPort = keepDev && E.Net.getPort(keepDev, keep.portId);
    if (!keepDev || !keepPort) return render();

    E.Net.removeCable(cable.id);
    const res = E.Net.addCable(keepDev, keepPort, dev, port);
    if (!res.ok) {
      // 接不上就把原来那条恢复，不能让学生的线凭空消失
      const da = E.Net.getDevice(ends.a.devId);
      const db = E.Net.getDevice(ends.b.devId);
      if (da && db) E.Net.addCable(da, E.Net.getPort(da, ends.a.portId), db, E.Net.getPort(db, ends.b.portId));
      toast(res.message, 'bad');
      return render();
    }
    E.recomputeOspf();
    E.recomputeRip();
    E.recomputeStp();
    persist();
    UI.selCable = null;
    render();
    toast(`已改接到 ${dev.hostname} ${port.name}`, 'good');
  }

  /**
   * 在连线上按下：不动就是「选中」，拖动就是「把这一端改接到别处」。
   * 拖哪一端看指针离哪个端点近。鼠标和手指走同一套（拖动靠 pointermove）。
   */
  function startCableDrag(ev, id, ctx) {
    const c = E.Net.getCable(id);
    if (!c) return false;
    const a = E.Net.getDevice(c.aDeviceId);
    const b = E.Net.getDevice(c.bDeviceId);
    if (!a || !b) return false;
    const ia = a.ports.findIndex((p) => p.id === c.aPortId);
    const ib = b.ports.findIndex((p) => p.id === c.bPortId);
    if (ia < 0 || ib < 0) return false;

    let end = 'a';
    try {
      const ctm = $('wires').getScreenCTM();
      if (ctm) {
        const sa = new DOMPoint(portCenter(a, ia).x, portCenter(a, ia).y).matrixTransform(ctm);
        const sb = new DOMPoint(portCenter(b, ib).x, portCenter(b, ib).y).matrixTransform(ctm);
        const da = Math.hypot(ev.clientX - sa.x, ev.clientY - sa.y);
        const db = Math.hypot(ev.clientX - sb.x, ev.clientY - sb.y);
        end = da <= db ? 'a' : 'b';
      }
    } catch (e) { /* 取不到 CTM 就默认拖 a 端 */ }

    ctx.cable = c;
    ctx.end = end;
    return true;
  }

  function moveCableDrag(ctx) {
    if (!ctx.cable) return;
    UI.selCable = null;
    const w = screenToWorld(ctx.lastX, ctx.lastY);
    UI.replug = { id: ctx.cable.id, end: ctx.end, x: w.x, y: w.y };
    renderWires();
  }

  function endCableDrag(ctx) {
    if (!ctx.cable) return;
    const target = ctx.moved ? portUnderPoint(ctx.lastX, ctx.lastY) : null;
    const c = ctx.cable;
    const end = ctx.end;
    UI.replug = null;
    if (target) moveCableEnd(c, end, target.dev, target.port);
    else render();
  }

  function selectCable(id) {
    UI.replug = null;
    UI.selCable = id;
    UI.selDev = null;
    render();
  }

  function removeDevice(dev) {
    if (!confirm(`确定删除设备 ${dev.hostname} 吗？相关连线会一并删除。`)) return;
    E.Net.removeDevice(dev.id);
    UI.tabs = UI.tabs.filter((t) => t !== dev.id);
    if (UI.activeTab === dev.id) UI.activeTab = UI.tabs[UI.tabs.length - 1] || null;
    if (UI.selDev === dev.id) UI.selDev = null;
    E.recomputeOspf();
    E.recomputeRip();
    E.recomputeStp();
    persist();
    render();
    renderConsole();
  }

  /* ------------------------------ 终端 ------------------------------ */
  /**
   * 展开 / 收起下方命令行面板。
   * 收起时不清掉标签页，所以再点一次「命令行」能回到原来的会话。
   */
  function setTermOpen(on) {
    $('term').classList.toggle('open', !!on);
    if (!on) $('term').classList.remove('max');
    syncTermBtn();
    if (on) setTimeout(() => $('cmd').focus(), 60);
  }

  function termIsOpen() {
    return $('term').classList.contains('open');
  }

  /** 让顶栏按钮的样式跟上当前展开状态 */
  function syncTermBtn() {
    const b = $('btnTerm');
    if (!b) return;
    const on = termIsOpen();
    b.classList.toggle('on', on);
    b.textContent = on ? '命令行 ⌄' : '命令行 ⌃';
    b.title = on ? '收起下方命令行面板（Ctrl+`）' : '展开下方命令行面板（Ctrl+`）';
  }

  function openConsole(dev) {
    if (!UI.tabs.includes(dev.id)) UI.tabs.push(dev.id);
    UI.activeTab = dev.id;
    $('term').classList.add('open');
    $('term').classList.remove('max');
    syncTermBtn();
    renderConsole();
    setTimeout(() => $('cmd').focus(), 60);
  }

  function closeConsole(id) {
    UI.tabs = UI.tabs.filter((t) => t !== id);
    if (UI.activeTab === id) UI.activeTab = UI.tabs[UI.tabs.length - 1] || null;
    if (!UI.tabs.length) {
      $('term').classList.remove('open');
      $('term').classList.remove('max');
    }
    syncTermBtn();
    renderConsole();
  }

  function activeDev() {
    return UI.activeTab ? E.Net.getDevice(UI.activeTab) : null;
  }

  function renderConsole() {
    const tabsEl = $('tabs');
    if (!UI.tabs.length) {
      tabsEl.innerHTML = '';
      $('screen').innerHTML = '';
      return;
    }
    tabsEl.innerHTML =
      UI.tabs
        .map((id) => {
          const d = E.Net.getDevice(id);
          if (!d) return '';
          return `<div class="tab ${id === UI.activeTab ? 'on' : ''}" data-id="${id}">
            <span style="width:7px;height:7px;border-radius:50%;background:${id === UI.activeTab ? '#3fb950' : '#484f58'}"></span>
            ${esc(d.hostname)}
            <span class="cl" data-close="${id}">×</span>
          </div>`;
        })

      d.logs.push({ t: '提示：输入 ? 查看可用命令；双击其他设备可切换会话。', c: 'dim' });

      .map((l) => `<div class="ln ${l.c || ''}">${esc(l.t)}</div>`)
      .join('');

  function classify(line) {
    const s = line.trim();
    if (/^\^$/.test(s)) return 'err'; // 真实 VRP 的错误插入符行
    if (/^\/\/ /.test(s)) return 'hl'; // 模拟器附加的中文提示，区别于设备真实回显
    if (/^Error[:：]|^Error |失败原因|请求失败|无法到达|已被占用/.test(s)) return 'err';
    if (/^(Warning|警告)|失败/.test(s)) return 'warn';
    if (/成功|reply|Reply|ping statistics|Save the configuration successfully/.test(s)) return 'ok';
    if (/^#|^return$|^\(no /.test(s)) return 'dim';
    return '';
  }

  function runCommand(line) {
    const d = activeDev();
    if (!d) return;
    const waiting = !!d.cli.pending;
    // 非等待状态下空回车没有意义，直接忽略
    if (!waiting && !line.trim()) return;

    if (waiting) {
      // 真实控制台里 y / 文件名是紧跟在问题后面的，所以追加到上一行末尾
      const last = d.logs[d.logs.length - 1];
      if (last) last.t += line;
    } else {
      d.logs.push({ t: `${E.promptOf(d)} ${line}`, c: 'cmd' });
    }

    let res;
    try {
      res = E.execute(d, line);
    } catch (e) {
      d.logs.push({ t: '内部错误：' + e.message, c: 'err' });
      renderConsole();
      return;
    }
    for (const l of res.lines || []) d.logs.push({ t: l, c: classify(l) });
    if (res.traffic) showTraffic(d, res.traffic);
    E.recomputeOspf();
    E.recomputeRip();
    E.recomputeStp();
    persist();
    renderConsole();
    render();
  }

  /** 高亮本次通信路径 */
  function showTraffic(dev, traffic) {
    const path = (traffic.path || []).filter(Boolean);
    if (!path.length) return;
    const names = path.map((id) => (E.Net.getDevice(id) || {}).hostname || '?').join(' → ');
    dev.logs.push({ t: '', c: '' });
    dev.logs.push({ t: `  通信路径：${names}`, c: 'hl' });
    dev.logs.push({ t: '', c: '' });
  }

  /* ------------------------------ 命令输入 ------------------------------ */
  function setupInput() {
    const inp = $('cmd');
    // 手机上点一下终端区域就聚焦输入框（不然要去戳那条很窄的输入行）
    $('screen').addEventListener('click', () => {
      if (narrow()) inp.focus();
    });
    inp.addEventListener('focus', () => {
      // 手机软键盘会顶掉半个屏幕，聚焦时把面板放到最大，并滚到能看到输入行
      if (!narrow()) return;
      $('term').classList.add('max');
      setTimeout(() => {
        inp.scrollIntoView({ block: 'nearest' });
        const sc = $('screen');
        sc.scrollTop = sc.scrollHeight;
      }, 260);
    });
    inp.addEventListener('keydown', (ev) => {
      const d = activeDev();
      if (!d) return;
      const key = ev.key;
      if (key === 'Enter') {
        ev.preventDefault();
        const v = inp.value;
        inp.value = '';
        // 等待确认的回答（y / 文件名）不进历史，避免 ↑ 翻出一堆 y
        if (v.trim() && !d.cli.pending) {
          if (!UI.hist[d.id]) UI.hist[d.id] = [];
          UI.hist[d.id].push(v.trim());
          UI.histIdx = UI.hist[d.id].length;
        }
        runCommand(v);
      } else if (key === 'ArrowUp') {
        ev.preventDefault();
        const h = UI.hist[d.id] || [];
        if (!h.length) return;
        UI.histIdx = Math.max(0, (UI.histIdx == null ? h.length : UI.histIdx) - 1);
        inp.value = h[UI.histIdx] || '';
      } else if (key === 'ArrowDown') {
        ev.preventDefault();
        const h = UI.hist[d.id] || [];
        UI.histIdx = Math.min(h.length, (UI.histIdx == null ? 0 : UI.histIdx) + 1);
        inp.value = h[UI.histIdx] || '';
      } else if (key === 'Tab') {
        ev.preventDefault();
        autocomplete(d, inp);
      } else if (key === '?' && !inp.value) {
        ev.preventDefault();
        runCommand('?');
      }
    });
  }
