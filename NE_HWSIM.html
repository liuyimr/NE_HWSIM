(function (global) {
  'use strict';

  const E = global.NE;

  /* ------------------------------ 文本格式 ------------------------------
   * 导出文件长这样（每个设备一段）：
   *
   *   配置导出时间：2026/10/8 下午10:00
   *
   *   ==================================================================
   *   设备：SW1（S5700-28TP-EI）
   *   ==================================================================
   *   #
   *   sysname SW1
   *   ...
   * ---------------------------------------------------------------------- */

  /** 设备段表头：设备：SW1（S5700-28TP-EI） */
  const RE_HEAD = /^\s*设备\s*[:：]\s*(.+?)\s*[（(]\s*([^（()）]*?)\s*[)）]\s*$/;
  /** 段间分隔线 ====== */
  const RE_SEP = /^\s*={6,}\s*$/;
  /** 导出时间戳行 */
  const RE_STAMP = /^\s*(配置导出时间|导出时间|生成时间)\s*[:：]/;
  /** 纯分段符（VRP 里 # 表示一段配置结束） */
  const RE_META = /^(#+|!)$/;
  /** 会进入子视图的命令：遇到它说明上一段配置结束了 */
  const RE_VIEW_START = /^(vlan\s+\d+|interface\s+\S+|port-group\s+\S+|acl\s+(?:number\s+)?\d+|nat\s+address-group\s+\d+)$/i;

  /** 回显里是否出现错误行 */
  function isError(lines) {
    return (lines || []).some((l) => /^Error[: ]/.test(String(l).trim()));
  }

  /** 型号字符串 → 设备库 key（先按模板精确匹配，再按关键字兜底） */
  function modelToKey(model) {
    const m = String(model == null ? '' : model).trim();
    if (!m) return null;
    const T = E.TEMPLATES || {};
    for (const k of Object.keys(T)) {
      if (T[k].model === m) return k;
    }
    const up = m.toUpperCase();
    if (/S37\d\d|S27\d\d/.test(up)) return 'S3700';
    if (/S57\d\d|S67\d\d|S127\d\d/.test(up)) return 'S5700';
    if (/^AR\d/.test(up) || up.includes('ROUTER') || /^NE\d/.test(up)) return 'AR6121';
    if (up === 'PC' || up.includes('HOST') || up.includes('WINDOWS')) return 'PC';
    return null;
  }

  /* ------------------------------ 解析 ------------------------------ */

  /**
   * 把导出文本拆成若干设备段。
   * 有「设备：xxx（型号）」表头的走分段模式；
   * 完全没有表头时（例如直接从终端复制的 current-configuration），整份当成一段匿名配置。
   */
  function parse(text) {
    const lines = String(text == null ? '' : text).replace(/\r\n?/g, '\n').split('\n');
    const blocks = [];
    const orphans = [];
    let cur = null;
    let headered = false;

    for (const raw of lines) {
      const t = raw.trim();
      if (RE_SEP.test(t) || RE_STAMP.test(t)) continue;
      const hm = t.match(RE_HEAD);
      if (hm) {
        headered = true;
        cur = { hostname: hm[1], model: hm[2], lines: [] };
        blocks.push(cur);
        continue;
      }
      if (cur) cur.lines.push(raw);
      else orphans.push(raw);
    }

    if (!headered) {
      const keep = orphans.filter((l) => {
        const t = l.trim();
        return t && !RE_SEP.test(t) && !RE_STAMP.test(t);
      });
      if (keep.length) blocks.push({ hostname: null, model: null, lines: keep });
    }

    return { blocks: blocks.filter((b) => b.lines.some((l) => l.trim())), headered };
  }

  /* ------------------------------ 重放计划 ------------------------------ */

  /** ACL / NAT 地址池这类「被别的配置引用」的定义段：必须比引用者先重放 */
  const RE_DEFINITION = /^(acl\s+(?:number\s+)?\d+|nat\s+address-group\s+\d+)$/i;

  /**
   * running-config 里 ACL、NAT 地址池都排在 interface 段落之后，
   * 但 traffic-filter / nat outbound 会校验「引用的对象是否存在」，
   * 照原顺序逐行重放必然报 "does not exist"。所以把定义段整体提到最前面，
   * 原位置只留一个 # 分段符，保持其余段落的切分不变。
   */
  function hoistDefinitions(src) {
    const head = [];
    const rest = [];
    let i = 0;
    while (i < src.length) {
      if (RE_DEFINITION.test(src[i])) {
        while (i < src.length && !RE_META.test(src[i])) head.push(src[i++]);
        if (i < src.length) i++; // 吃掉定义段末尾的 #
        rest.push('#');
        continue;
      }
      rest.push(src[i++]);
    }
    return { head, rest };
  }

  /**
   * 把一份 running-config 变成可以喂给 E.execute 的命令序列。
   * running-config 是「结果快照」，没有视图层级信息，所以这里要按段落补回
   * quit / return / system-view，否则重放到第二个段落就会因为停在旧视图里而报错。
   */
  function plan(dev, lines) {
    const cmds = [];
    const unknown = [];
    const src = (lines || []).map((l) => String(l).trim()).filter(Boolean);

    /* --- PC 没有 VRP 命令行：导出的是 ip address / ip gateway 两行，要合并成一条 ip 命令 --- */
    if (dev.type === 'pc') {
      let ip = null;
      let mask = null;
      let gw = null;
      const flush = () => {
        if (ip && mask) cmds.push(`ip ${ip} ${mask}${gw ? ' ' + gw : ''}`);
        ip = mask = gw = null;
      };
      for (const t of src) {
        if (RE_META.test(t) || /^sysname\b/i.test(t)) continue; // 主机名由设备本身维护，重放会覆盖成导出时的名字
        let m = t.match(/^ip\s+address\s+(\S+)\s+(\S+)$/i);
        if (m) {
          flush();
          ip = m[1];
          mask = m[2];
          continue;
        }
        m = t.match(/^ip\s+gateway\s+(\S+)$/i);
        if (m) {
          gw = m[1];
          continue;
        }
        m = t.match(/^ip\s+(\S+)\s+(\S+)(?:\s+(\S+))?$/i); // 已经是 ip <地址> <掩码> [网关] 形式
        if (m) {
          flush();
          ip = m[1];
          mask = m[2];
          gw = m[3] || null;
          continue;
        }
        unknown.push(t);
      }
      flush();
      return { cmds, unknown };
    }

    let inView = false; // 是否正停在 vlan / interface / acl / port-group / nat address-group 这类子视图里
    let inSystem = false; // 是否已在系统视图

    // 回用户视图：VRP 的 return 从任意深度都能一步回用户视图，不用逐级 quit
    const toUser = () => {
      if (!inView && !inSystem) return;
      cmds.push('return');
      inView = false;
      inSystem = false;
    };
    // 回系统视图：子视图里退一级就回到系统视图，否则从用户视图进系统视图
    const toSystem = () => {
      if (inView) {
        cmds.push('quit');
        inView = false;
        return;
      }
      if (!inSystem) {
        cmds.push('system-view');
        inSystem = true;
      }
    };

    const hoisted = hoistDefinitions(src);
    for (const t of hoisted.head.concat(hoisted.rest)) {
      if (RE_META.test(t) || /^return$/i.test(t)) {
        toUser(); // 一个 # 代表一段配置结束，先退回用户视图再看下一段
        continue;
      }
      // port-group group-member 是临时端口组命令，不会进入命名端口组视图
      if (RE_VIEW_START.test(t) && !/^port-group\s+group-member\b/i.test(t)) {
        toSystem();
        cmds.push(t);
        inView = true;
        continue;
      }
      if (!inSystem) toSystem();
      cmds.push(t);
    }
    toUser();
    return { cmds, unknown };
  }

  /* ------------------------------ 应用 ------------------------------ */

  /**
   * 把配置文本应用到拓扑上。
   *  · 有同名设备 → 直接配到那台设备上
   *  · 没有同名设备 → 按表头里的型号新建一台（摆放在现有设备下方）
   *  · 文本没有表头 → 配到 opts.target 指定的设备上（一般传当前打开的设备）
   *
   * 注意：导出的是「设备配置」，不含连线。导入只会还原地址、VLAN、ACL、NAT 这些配置，
   * 线缆仍需在画布上自己连。
   */
  function applyConfigText(text, opts) {
    const o = opts || {};
    const parsed = parse(text);
    if (!parsed.blocks.length) {
      return {
        ok: false,
        message:
          '没有从文件里找到可识别的配置内容。请选择由「导出配置」生成的文件，或任意 VRP 的 current-configuration 文本。',
        results: []
      };
    }

    // 无表头的裸配置：只有画布上恰好一台设备时才敢推断目标
    let target = o.target || null;
    if (!parsed.headered && !target && E.Net.devices.length === 1) target = E.Net.devices[0];
    // 既没有设备表头、又不知道配给谁 → 直接说清楚，别让用户对着「已跳过」发呆
    if (!parsed.headered && !target) {
      return {
        ok: false,
        message:
          '文件里没有「设备：xxx（型号）」这样的表头，无法判断这份配置该配到哪台设备上。' +
          '请先双击一台设备打开它的命令行，再重新导入；或者导入由「导出配置」生成的完整文件。',
        results: []
      };
    }

    const results = [];
    let created = 0;
    let cursor = 0;
    const startY = E.Net.devices.length ? Math.max(...E.Net.devices.map((d) => d.y)) + 190 : 60;
    const place = () => {
      const x = 60 + (cursor % 4) * 300;
      const y = startY + Math.floor(cursor / 4) * 220;
      cursor++;
      return { x, y };
    };

    for (const b of parsed.blocks) {
      let dev = null;
      let isNew = false;
      if (b.hostname) dev = E.Net.devices.find((d) => d.hostname === b.hostname) || null;
      if (!dev && !b.hostname) dev = target;

      if (!dev) {
        const key = modelToKey(b.model);
        if (!key) {
          results.push({
            hostname: b.hostname || '(未命名)',
            model: b.model || '',
            isNew: false,
            total: 0,
            applied: 0,
            failed: [],
            unknown: [],
            skip: b.hostname
              ? `无法识别型号${b.model ? '「' + b.model + '」' : ''}，且拓扑里没有叫「${b.hostname}」的设备，已跳过。`
              : '文件没有设备表头，也没指定要配到哪台设备上，已跳过。'
          });
          continue;
        }
        const pos = place();
        dev = E.Net.addDevice(key, pos.x, pos.y);
        if (b.hostname) dev.hostname = b.hostname;
        isNew = true;
        created++;
      }

      const p = plan(dev, b.lines);
      const failed = [];
      let applied = 0;
      for (const c of p.cmds) {
        let r;
        try {
          r = E.execute(dev, c);
        } catch (err) {
          r = { lines: ['Error: ' + err.message] };
        }
        if (isError(r.lines)) failed.push({ cmd: c, lines: r.lines });
        else applied++;
      }

      // 收尾：不管重放停在哪个视图，都回到用户视图；交互式等待状态也要清掉，
      // 否则导入完设备会卡在「等 y/n」上。
      if (typeof E.resetCli === 'function') E.resetCli(dev);
      else {
        dev.cli.view = 'user-view';
        dev.cli.stack = [];
        dev.cli.pending = null;
      }

      results.push({
        hostname: dev.hostname,
        model: dev.model,
        isNew,
        total: p.cmds.length,
        applied,
        failed,
        unknown: p.unknown,
        skip: ''
      });
    }

    const bad = results.reduce((n, r) => n + r.failed.length, 0);
    const skipped = results.filter((r) => r.skip).length;
    return {
      ok: true,
      headered: parsed.headered,
      results,
      created,
      bad,
      skipped,
      message:
        `共处理 ${results.length} 段配置` +
        (created ? `，新建 ${created} 台设备` : '') +
        (bad ? `，${bad} 条命令未生效` : '，全部命令生效') +
        (skipped ? `，${skipped} 段已跳过` : '') +
        '。'
    };
  }

  global.NE = global.NE || {};
  Object.assign(global.NE, {
    Import: { parse, plan, applyConfigText, modelToKey }
  });
})(window);

</script>
<script>
/* =========================================================================
 * NE_HWSIM —— 华为 VRP 网络实训模拟器
 * 模块：界面与交互（画布 / 拖拽 / 连线 / 终端 / 持久化 / 实训实验）
 *
 * Copyright (c) 2026 新易科技工作室 NewE
 * 作者：Liuyi  <yimr@sohu.com>
 * 协议：MIT License
 *
 * 本项目为独立的非官方教学演示工具，与华为技术有限公司无任何关联。
 * ========================================================================= */
(function (global) {
  'use strict';

  const E = global.NE;
  const $ = (id) => document.getElementById(id);

  /* ------------------------------ 布局常量 ------------------------------ */
  const COLS = 14;
  const CARD_W = 260;
  const PC_W = 126; // PC 只有一个网口，卡片只有交换机的一半宽
  const PC_COLS = 4; // 列数少一点，单口才不至于挤成一个小方块
  const PAD_X = 13;
  const GAP = 3;
  const PORT_H = 14;
  const HEAD_H = 46;
  const PORTS_PAD_TOP = 6;
  const BORDER = 1; // .card 的 border 宽度。box-sizing 是 border-box，算端口坐标时必须减掉

  /* ------------------------------ 运行时状态 ------------------------------ */
  const UI = {
    scale: 1,
    panX: 0,
    panY: 0,
    selDev: null,
    pend: null, // { devId, portId }
    tabs: [],
    activeTab: null,
    hist: {},
    histIdx: -1,
    labs: [],
    currentLab: null
  };

  /* ------------------------------ 提示条 ------------------------------ */
  let toastTimer = null;
  function toast(msg, kind) {
    const el = $('toast');
    el.textContent = msg;
    el.className = 'toast on' + (kind ? ' ' + kind : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => (el.className = 'toast'), 2200);
  }

  /* ------------------------------ 坐标换算 ------------------------------ */
  /* PC 只有一个网口：卡片既矮又窄，端口网格的列数也跟着少 */
  function cardW(dev) {
    return dev.type === 'pc' ? PC_W : CARD_W;
  }
  function colsOf(dev) {
    return dev.type === 'pc' ? PC_COLS : COLS;
  }
  function colW(dev) {
    const n = colsOf(dev);
    return (cardW(dev) - 2 * BORDER - 2 * PAD_X - (n - 1) * GAP) / n;
  }
  function headH(dev) {
    return dev.type === 'pc' ? 30 : HEAD_H;
  }
  function portsPadTop(dev) {
    return dev.type === 'pc' ? 4 : PORTS_PAD_TOP;
  }
  function cardBottomPad(dev) {
    return dev.type === 'pc' ? 7 : 12;
  }

  function portCenter(dev, idx) {
    const cols = colsOf(dev);
    const w = colW(dev);
    const col = idx % cols;
    const row = Math.floor(idx / cols);
    return {
      x: dev.x + BORDER + PAD_X + col * (w + GAP) + w / 2,
      y: dev.y + BORDER + headH(dev) + portsPadTop(dev) + row * (PORT_H + GAP) + PORT_H / 2
    };
  }

  function cardHeight(dev) {
    const cols = colsOf(dev);
    const rows = Math.ceil(dev.ports.length / cols) || 1;
    return 2 * BORDER + headH(dev) + portsPadTop(dev) + rows * PORT_H + (rows - 1) * GAP + cardBottomPad(dev);
  }

  function screenToWorld(sx, sy) {
    const rect = $('stage').getBoundingClientRect();
    return {
      x: (sx - rect.left - UI.panX) / UI.scale,
      y: (sy - rect.top - UI.panY) / UI.scale
    };
  }

  function applyTransform() {
    $('stageInner').style.transform = `translate(${UI.panX}px, ${UI.panY}px) scale(${UI.scale})`;
  }

  /* ------------------------------ 设备库 ------------------------------ */
  function renderPalette() {
    const items = [
      { key: 'S5700', ic: '🔀', name: '三层交换机', sub: 'S5700-28TP-EI' },
      { key: 'S3700', ic: '🔀', name: '二层交换机', sub: 'S3700-28TP-EI' },
      { key: 'AR6121', ic: '📡', name: '路由器', sub: 'AR6121' },
      { key: 'PC', ic: '💻', name: 'PC 终端', sub: 'Windows 主机' }
    ];
    $('palette').innerHTML = items
      .map(
        (it) => `<button class="pal" data-k="${it.key}">
          <span class="ic">${it.ic}</span>
          <span class="tx"><b>${it.name}</b><span>${it.sub}</span></span>
        </button>`
      )
      .join('');
    $('palette').querySelectorAll('.pal').forEach((b) => {
      b.onclick = () => {
        const w = screenToWorld(window.innerWidth / 2, window.innerHeight / 2);
        const half = b.dataset.k === 'PC' ? PC_W : CARD_W;
        const d = E.Net.addDevice(b.dataset.k, Math.round(w.x - half / 2 + Math.random() * 60), Math.round(w.y - 60 + Math.random() * 40));
        autoName(d);
        render();
        toast(`已添加 ${d.hostname}`, 'good');
      };
    });
  }

  let nameSeq = {};
  function autoName(dev) {
    const base = dev.type === 'pc' ? 'PC' : dev.type === 'router' ? 'R' : 'SW';
    nameSeq[base] = (nameSeq[base] || 0) + 1;
    dev.hostname = base + nameSeq[base];
  }

  /* ------------------------------ 画布渲染 ------------------------------ */
  function render() {
    const cards = $('cards');
    cards.innerHTML = '';

    for (const d of E.Net.devices) {
      const el = document.createElement('div');
      el.className = 'card' + (UI.selDev === d.id ? ' sel' : '') + (d.type === 'pc' ? ' compact' : '');
      el.style.left = d.x + 'px';
      el.style.top = d.y + 'px';
      el.style.width = cardW(d) + 'px';
      el.dataset.id = d.id;

      const tagTxt = d.type === 'pc' ? 'PC' : d.type === 'router' ? 'Router' : d.key === 'S3700' ? 'L2 Switch' : 'L3 Switch';
      el.innerHTML = `
        <div class="head">
          <div style="min-width:0">
            <div class="nm">${esc(d.hostname)}</div>
            <div class="md">${d.model}</div>
          </div>
          <span class="tag">${tagTxt}</span>
          <span class="x" title="删除设备">×</span>
        </div>
        <div class="ports" style="grid-template-columns:repeat(${colsOf(d)},1fr)"></div>`;

      const portsEl = el.querySelector('.ports');
      d.ports.forEach((p, i) => {
        const pe = document.createElement('div');
        pe.className = 'port ' + portClass(d, p);
        pe.title = `${p.name}\n${portTitle(d, p)}`;
        pe.innerHTML = `<span class="lab">${p.name.replace('GigabitEthernet', 'GE')}</span>`;
        pe.onmousedown = (ev) => ev.stopPropagation();
        pe.onclick = (ev) => {
          ev.stopPropagation();
          onPortClick(d, p);
        };
        portsEl.appendChild(pe);
      });

      const head = el.querySelector('.head');
      head.onmousedown = (ev) => startDrag(ev, d, el);
      head.ondblclick = () => openConsole(d);
      el.querySelector('.x').onclick = (ev) => {
        ev.stopPropagation();
        removeDevice(d);
      };
      el.onclick = () => {
        UI.selDev = d.id;
        render();
      };
      el.oncontextmenu = (ev) => {
        ev.preventDefault();
        removeDevice(d);
      };

      cards.appendChild(el);
    }

    renderWires();
    $('empty').style.display = E.Net.devices.length ? 'none' : 'flex';
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  }

  function portClass(dev, p) {
    const cls = [];
    if (p.cableId && !p.shutdown) cls.push('up');
    if (p.shutdown) cls.push('shut');
    if (p.mode === 'trunk') cls.push('trunk');
    if (UI.pend && UI.pend.devId === dev.id && UI.pend.portId === p.id) cls.push('pend');
    return cls.join(' ');
  }

  function portTitle(dev, p) {
    const rows = [];
    rows.push(p.shutdown ? '状态：已关闭（shutdown）' : p.cableId ? '状态：已连线 Up' : '状态：未连线 Down');
    rows.push('类型：' + (p.mode === 'routed' ? '路由口' : p.mode === 'trunk' ? 'Trunk' : p.mode === 'hybrid' ? 'Hybrid' : 'Access'));
    if (p.mode === 'access') rows.push('VLAN：' + p.vlan);
    if (p.mode === 'trunk') rows.push('放行 VLAN：' + (p.allowedVlans === 'all' ? 'all' : (p.allowedVlans || []).join(',')));
    if (p.ip) rows.push('IP：' + p.ip + '/' + p.mask);
    if (p.trunkId != null) rows.push('Eth-Trunk' + p.trunkId);
    return rows.join('  |  ');
  }

  function renderWires() {
    const svg = $('wires');
    let html = '';
    for (const c of E.Net.cables) {
      const a = E.Net.getDevice(c.aDeviceId);
      const b = E.Net.getDevice(c.bDeviceId);
      if (!a || !b) continue;
      const ia = a.ports.findIndex((p) => p.id === c.aPortId);
      const ib = b.ports.findIndex((p) => p.id === c.bPortId);
      if (ia < 0 || ib < 0) continue;
      const pa = portCenter(a, ia);
      const pb = portCenter(b, ib);
      const alive = !a.ports[ia].shutdown && !b.ports[ib].shutdown;
      html += `<line x1="${pa.x}" y1="${pa.y}" x2="${pb.x}" y2="${pb.y}"
        stroke="${alive ? '#3fb950' : '#6e7681'}" stroke-width="2" vector-effect="non-scaling-stroke" opacity="0.85"/>`;
    }
    svg.innerHTML = html;
  }

  /* ------------------------------ 拖动 ------------------------------ */
  function startDrag(ev, dev, el) {
    if (ev.button !== 0) return;
    ev.preventDefault();
    const startX = ev.clientX;
    const startY = ev.clientY;
    const ox = dev.x;
    const oy = dev.y;
    let moved = false;

    const onMove = (e) => {
      const dx = (e.clientX - startX) / UI.scale;
      const dy = (e.clientY - startY) / UI.scale;
      if (Math.abs(dx) > 2 || Math.abs(dy) > 2) moved = true;
      dev.x = Math.round(ox + dx);
      dev.y = Math.round(oy + dy);
      el.style.left = dev.x + 'px';
      el.style.top = dev.y + 'px';
      renderWires();
    };
    const onUp = () => {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      if (moved) {
        persist();
        UI.selDev = dev.id;
        render();
      }
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  }

  /* ------------------------------ 连线 ------------------------------ */
  function onPortClick(dev, port) {
    if (!UI.pend) {
      UI.pend = { devId: dev.id, portId: port.id };
      render();
      return;
    }
    if (UI.pend.devId === dev.id && UI.pend.portId === port.id) {
      UI.pend = null;
      render();
      return;
    }
    const from = E.Net.getDevice(UI.pend.devId);
    const fromPort = from && E.Net.getPort(from, UI.pend.portId);
    if (!from || !fromPort) {
      UI.pend = null;
      render();
      return;
    }
    const res = E.Net.addCable(from, fromPort, dev, port);
    UI.pend = null;
    if (!res.ok) {
      toast(res.message, 'bad');
      render();
      return;
    }
    E.recomputeOspf();
    E.recomputeStp();
    persist();
    render();
    toast(`${from.hostname} ${fromPort.name} ↔ ${dev.hostname} ${port.name} 连接成功`, 'good');
  }

  function removeDevice(dev) {
    if (!confirm(`确定删除设备 ${dev.hostname} 吗？相关连线会一并删除。`)) return;
    E.Net.removeDevice(dev.id);
    UI.tabs = UI.tabs.filter((t) => t !== dev.id);
    if (UI.activeTab === dev.id) UI.activeTab = UI.tabs[UI.tabs.length - 1] || null;
    if (UI.selDev === dev.id) UI.selDev = null;
    E.recomputeOspf();
    E.recomputeStp();
    persist();
    render();
    renderConsole();
  }

  /* ------------------------------ 终端 ------------------------------ */
  /**
   * 展开 / 收起下方命令行面板。
   * 收起时不清掉标签页，所以再点一次「命令行」能回到原来的会话。
   */
  function setTermOpen(on) {
    $('term').classList.toggle('open', !!on);
    if (!on) $('term').classList.remove('max');
    syncTermBtn();
    if (on) setTimeout(() => $('cmd').focus(), 60);
  }

  function termIsOpen() {
    return $('term').classList.contains('open');
  }

  /** 让顶栏按钮的样式跟上当前展开状态 */
  function syncTermBtn() {
    const b = $('btnTerm');
    if (!b) return;
    const on = termIsOpen();
    b.classList.toggle('on', on);
    b.textContent = on ? '命令行 ⌄' : '命令行 ⌃';
    b.title = on ? '收起下方命令行面板（Ctrl+`）' : '展开下方命令行面板（Ctrl+`）';
  }

  function openConsole(dev) {
    if (!UI.tabs.includes(dev.id)) UI.tabs.push(dev.id);
    UI.activeTab = dev.id;
    $('term').classList.add('open');
    $('term').classList.remove('max');
    syncTermBtn();
    renderConsole();
    setTimeout(() => $('cmd').focus(), 60);
  }

  function closeConsole(id) {
    UI.tabs = UI.tabs.filter((t) => t !== id);
    if (UI.activeTab === id) UI.activeTab = UI.tabs[UI.tabs.length - 1] || null;
    if (!UI.tabs.length) {
      $('term').classList.remove('open');
      $('term').classList.remove('max');
    }
    syncTermBtn();
    renderConsole();
  }

  function activeDev() {
    return UI.activeTab ? E.Net.getDevice(UI.activeTab) : null;
  }

  function renderConsole() {
    const tabsEl = $('tabs');
    if (!UI.tabs.length) {
      tabsEl.innerHTML = '';
      $('screen').innerHTML = '';
      return;
    }
    tabsEl.innerHTML =
      UI.tabs
        .map((id) => {
          const d = E.Net.getDevice(id);
          if (!d) return '';
          return `<div class="tab ${id === UI.activeTab ? 'on' : ''}" data-id="${id}">
            <span style="width:7px;height:7px;border-radius:50%;background:${id === UI.activeTab ? '#3fb950' : '#484f58'}"></span>
            ${esc(d.hostname)}
            <span class="cl" data-close="${id}">×</span>
          </div>`;
        })
        .join('') +
      `<div class="sp">
         <button class="btn" id="btnClearLog" title="清屏">清屏</button>
         <button class="btn" id="btnMax" title="最大化 / 还原">⤢</button>
         <button class="btn" id="btnFold" title="收起命令行面板（Ctrl+\`）">⌄ 收起</button>
       </div>`;

    tabsEl.querySelectorAll('.tab').forEach((t) => {
      t.onclick = (ev) => {
        if (ev.target.dataset.close) return;
        UI.activeTab = t.dataset.id;
        renderConsole();
        $('cmd').focus();
      };
    });
    tabsEl.querySelectorAll('[data-close]').forEach((el) => {
      el.onclick = (ev) => {
        ev.stopPropagation();
        closeConsole(el.dataset.close);
      };
    });
    tabsEl.querySelector('#btnClearLog').onclick = () => {
      const d = activeDev();
      if (d) {
        d.logs = [];
        renderConsole();
      }
    };
    tabsEl.querySelector('#btnMax').onclick = () => {
      $('term').classList.toggle('max');
    };
    tabsEl.querySelector('#btnFold').onclick = () => setTermOpen(false);

    const d = activeDev();
    if (!d) return;
    const screen = $('screen');
    if (!d.logs.length) {
      d.logs.push({ t: `--- 已进入 ${d.hostname} 的命令行（${d.model}）---`, c: 'dim' });
      d.logs.push({ t: '提示：输入 ? 查看可用命令；双击其他设备可切换会话。', c: 'dim' });
    }
    screen.innerHTML = d.logs
      .map((l) => `<div class="ln ${l.c || ''}">${esc(l.t)}</div>`)
      .join('');
    screen.scrollTop = screen.scrollHeight;
    // 等待 y/n 或文件名输入时，真实 VRP 不显示提示符
    $('prompt').textContent = d.cli.pending ? '' : E.promptOf(d);
  }

  function classify(line) {
    const s = line.trim();
    if (/^\^$/.test(s)) return 'err'; // 真实 VRP 的错误插入符行
    if (/^\/\/ /.test(s)) return 'hl'; // 模拟器附加的中文提示，区别于设备真实回显
    if (/^Error[:：]|^Error |失败原因|请求失败|无法到达|已被占用/.test(s)) return 'err';
    if (/^(Warning|警告)|失败/.test(s)) return 'warn';
    if (/成功|reply|Reply|ping statistics|Save the configuration successfully/.test(s)) return 'ok';
    if (/^#|^return$|^\(no /.test(s)) return 'dim';
    return '';
  }

  function runCommand(line) {
    const d = activeDev();
    if (!d) return;
    const waiting = !!d.cli.pending;
    // 非等待状态下空回车没有意义，直接忽略
    if (!waiting && !line.trim()) return;

    if (waiting) {
      // 真实控制台里 y / 文件名是紧跟在问题后面的，所以追加到上一行末尾
      const last = d.logs[d.logs.length - 1];
      if (last) last.t += line;
    } else {
      d.logs.push({ t: `${E.promptOf(d)} ${line}`, c: 'cmd' });
    }

    let res;
    try {
      res = E.execute(d, line);
    } catch (e) {
      d.logs.push({ t: '内部错误：' + e.message, c: 'err' });
      renderConsole();
      return;
    }
    for (const l of res.lines || []) d.logs.push({ t: l, c: classify(l) });
    if (res.traffic) showTraffic(d, res.traffic);
    E.recomputeOspf();
    E.recomputeStp();
    persist();
    renderConsole();
    render();
  }

  /** 高亮本次通信路径 */
  function showTraffic(dev, traffic) {
    const path = (traffic.path || []).filter(Boolean);
    if (!path.length) return;
    const names = path.map((id) => (E.Net.getDevice(id) || {}).hostname || '?').join(' → ');
    dev.logs.push({ t: '', c: '' });
    dev.logs.push({ t: `  通信路径：${names}`, c: 'hl' });
    dev.logs.push({ t: '', c: '' });
  }

  /* ------------------------------ 命令输入 ------------------------------ */
  function setupInput() {
    const inp = $('cmd');
    inp.addEventListener('keydown', (ev) => {
      const d = activeDev();
      if (!d) return;
      const key = ev.key;
      if (key === 'Enter') {
        ev.preventDefault();
        const v = inp.value;
        inp.value = '';
        // 等待确认的回答（y / 文件名）不进历史，避免 ↑ 翻出一堆 y
        if (v.trim() && !d.cli.pending) {
          if (!UI.hist[d.id]) UI.hist[d.id] = [];
          UI.hist[d.id].push(v.trim());
          UI.histIdx = UI.hist[d.id].length;
        }
        runCommand(v);
      } else if (key === 'ArrowUp') {
        ev.preventDefault();
        const h = UI.hist[d.id] || [];
        if (!h.length) return;
        UI.histIdx = Math.max(0, (UI.histIdx == null ? h.length : UI.histIdx) - 1);
        inp.value = h[UI.histIdx] || '';
      } else if (key === 'ArrowDown') {
        ev.preventDefault();
        const h = UI.hist[d.id] || [];
        UI.histIdx = Math.min(h.length, (UI.histIdx == null ? 0 : UI.histIdx) + 1);
        inp.value = h[UI.histIdx] || '';
      } else if (key === 'Tab') {
        ev.preventDefault();
        autocomplete(d, inp);
      } else if (key === '?' && !inp.value) {
        ev.preventDefault();
        runCommand('?');
      }
    });
  }

  function autocomplete(d, inp) {
    const cur = inp.value;
    let list = CANDIDATES[d.cli.view] || [];
    if (d.type === 'pc') list = ['ipconfig', 'ipconfig /renew', 'ipconfig /release', 'ip ', 'ping ', 'tracert ', 'help'];

    if (!cur.trim()) {
      const d2 = activeDev();
      d2.logs.push({ t: '', c: '' });
      d2.logs.push({ t: '  可输入的命令：', c: 'dim' });
      for (const c of list) d2.logs.push({ t: '    ' + c, c: 'hl' });
      renderConsole();
      return;
    }
    const hits = list.filter((c) => c.toLowerCase().startsWith(cur.toLowerCase()));
    if (hits.length === 1) {
      inp.value = hits[0];
      return;
    }
    if (hits.length > 1) {
      const common = commonPrefix(hits);
      if (common.length > cur.length) inp.value = common;
      else {
        const d2 = activeDev();
        d2.logs.push({ t: '', c: '' });
        d2.logs.push({ t: '  匹配到的命令：', c: 'dim' });
        for (const c of hits) d2.logs.push({ t: '    ' + c, c: 'hl' });
        renderConsole();
      }
    }
  }

  function commonPrefix(arr) {
    if (!arr.length) return '';
    let p = arr[0];
    for (const s of arr) {
      while (s.toLowerCase().indexOf(p.toLowerCase()) !== 0) {
        p = p.slice(0, -1);
        if (!p) return '';
      }
    }
    return p;
  }

  /* ------------------------------ 画布平移缩放 ------------------------------ */
  function setupStage() {
    const stage = $('stage');
    stage.addEventListener('mousedown', (ev) => {
      if (ev.target !== stage && ev.target.id !== 'stageInner' && ev.target.tagName !== 'svg') return;
      if (ev.button === 1 || ev.button === 0) {
        UI.pend = null;
        UI.selDev = null;
        render();
        const sx = ev.clientX;
        const sy = ev.clientY;
        const ox = UI.panX;
        const oy = UI.panY;
        const mv = (e) => {
          UI.panX = ox + (e.clientX - sx);
          UI.panY = oy + (e.clientY - sy);
          applyTransform();
        };
        const up = () => {
          document.removeEventListener('mousemove', mv);
          document.removeEventListener('mouseup', up);
        };
        document.addEventListener('mousemove', mv);
        document.addEventListener('mouseup', up);
      }
    });
    stage.addEventListener('wheel', (ev) => {
      if (!ev.ctrlKey && !ev.metaKey) return;
      ev.preventDefault();
      const rect = stage.getBoundingClientRect();
      const mx = ev.clientX - rect.left;
      const my = ev.clientY - rect.top;
      const old = UI.scale;
      const next = Math.min(2, Math.max(0.35, old * (ev.deltaY < 0 ? 1.12 : 0.89)));
      UI.panX = mx - (mx - UI.panX) * (next / old);
      UI.panY = my - (my - UI.panY) * (next / old);
      UI.scale = next;
      applyTransform();
    }, { passive: false });
    document.addEventListener('keydown', (ev) => {
      if (ev.key === 'Escape') {
        UI.pend = null;
        render();
      }
      if (ev.key === 'Delete' && UI.selDev) {
        const d = E.Net.getDevice(UI.selDev);
        if (d) removeDevice(d);
      }
    });
  }

  /* ------------------------------ 持久化 ------------------------------ */
  const LS_KEY = 'hw-netsim-lite-v1';

  function persist() {
    try {
      localStorage.setItem(
        LS_KEY,
        JSON.stringify({
          devices: E.Net.devices,
          cables: E.Net.cables,
          seq: nameSeq,
          pan: { x: UI.panX, y: UI.panY, s: UI.scale }
        })
      );
    } catch (e) {
      /* 忽略存储异常 */
    }
  }

  function restore() {
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (!raw) return false;
      const data = JSON.parse(raw);
      if (!data.devices || !data.devices.length) return false;
      E.Net.devices = (data.devices || []).map((d) => E.normalizeDevice(d));
      E.Net.cables = data.cables || [];
      nameSeq = data.seq || {};
      if (data.pan) {
        UI.panX = data.pan.x || 0;
        UI.panY = data.pan.y || 0;
        UI.scale = data.pan.s || 1;
      }
      return true;
    } catch (e) {
      return false;
    }
  }

  /* ------------------------------ 实验预设 ------------------------------ */
  function mk(key, x, y, name) {
    const d = E.Net.addDevice(key, x, y);
    d.hostname = name;
    nameSeq[d.type === 'pc' ? 'PC' : d.type === 'router' ? 'R' : 'SW'] = Math.max(
      nameSeq[d.type === 'pc' ? 'PC' : d.type === 'router' ? 'R' : 'SW'] || 0,
      parseInt(String(name).replace(/\D/g, ''), 10) || 0
    );
    return d;
  }

  function link(a, ai, b, bi) {
    const res = E.Net.addCable(a, a.ports[ai], b, b.ports[bi]);
    if (!res.ok) console.warn('连线失败：' + res.message);
    return res.ok;
  }

  function setPort(dev, idx, patch) {
    Object.assign(dev.ports[idx], patch);
  }

  function setName(dev, name) {
    dev.hostname = name;
  }

  function clearAll() {
    E.Net.reset();
    nameSeq = {};
    UI.tabs = [];
    UI.activeTab = null;
    UI.selDev = null;
    UI.pend = null;
    UI.panX = 0;
    UI.panY = 0;
    UI.scale = 1;
    applyTransform();
    persist();
    render();
    renderConsole();
  }

  function loadLab(id) {
    const lab = LABS.find((l) => l.id === id);
    if (!lab) return;
    clearAll();
    const info = lab.build() || {};
    E.recomputeOspf();
    E.recomputeStp();
    // 视图居中
    const devs = E.Net.devices;
    if (devs.length) {
      const minX = Math.min(...devs.map((d) => d.x));
      const maxX = Math.max(...devs.map((d) => d.x + cardW(d)));
      const minY = Math.min(...devs.map((d) => d.y));
      const maxY = Math.max(...devs.map((d) => d.y)) + 180;
      const rect = $('stage').getBoundingClientRect();
      const s = Math.min(1.1, Math.min(rect.width / (maxX - minX + 80), rect.height / (maxY - minY + 80)));
      UI.scale = Math.max(0.35, s);
      UI.panX = (rect.width - (maxX - minX) * UI.scale) / 2 - minX * UI.scale;
      UI.panY = (rect.height - (maxY - minY) * UI.scale) / 2 - minY * UI.scale;
      applyTransform();
    }
    UI.currentLab = lab;
    persist();
    render();
    if (info.focus) openConsole(info.focus);
    showLabBrief(lab);
  }

          <div class="r"><b>三层</b><span><code>interface Vlanif10</code> · <code>ip address 192.168.10.1 24</code></span></div>
          <div class="r"><b>路由</b><span><code>ip route-static 192.168.2.0 24 10.0.0.2</code></span></div>
          <div class="r"><b>OSPF</b><span><code>ospf 1 router-id 1.1.1.1</code> → <code>area 0</code> → <code>network 10.0.0.0 0.0.0.255</code></span></div>
          <div class="r"><b>DHCP</b><span><code>dhcp enable</code> · <code>ip pool pool1</code> · <code>network 192.168.10.0 mask 24</code> · <code>gateway-list 192.168.10.1</code> · 接口下 <code>dhcp select global</code></span></div>
          <div class="r"><b>查看</b><span><code>display this</code> · <code>display ip interface brief</code> · <code>display interface GE0/0/1</code> · <code>display port vlan</code> · <code>display vlan</code> · <code>display ip routing-table</code> · <code>display mac-address</code> · <code>display stp brief</code> · <code>display ospf peer brief</code> · <code>display ospf interface</code></span></div>
          <div class="r"><b>批量配端口</b><span>端口多的时候不用一个个进：<code>interface range GigabitEthernet0/0/1 to GigabitEthernet0/0/5</code>，或者 <code>port-group group-member GE0/0/1 to GE0/0/8</code>，都会进入端口组视图 <code>[SW1-port-group]</code>，之后敲的命令会批量下发到组内每个口。</span></div>
          <div class="r"><b>ACL</b><span><code>acl number 3000</code> → <code>rule 5 deny ip source 192.168.10.0 0.0.0.255 destination 192.168.20.0 0.0.0.255</code> → <code>rule 10 permit ip</code>；再到 <code>interface Vlanif10</code> 下 <code>traffic-filter inbound acl 3000</code>。注意 ACL 末尾缺省是「拒绝所有」，别只写 deny。</span></div>
          <div class="r"><b>NAT</b><span><code>acl number 2000</code> → <code>rule 5 permit source 192.168.1.0 0.0.0.255</code>；再到出口接口 <code>nat outbound 2000</code>（Easy IP，借用接口公网地址）。用 <code>display nat session all</code> 看转换表项。</span></div>
          <div class="r"><b>保存</b><span><code>save</code> 会先问 <code>Are you sure to continue? (y/n)</code> 再问文件名，直接回车用默认的 <code>vrpcfg.zip</code></span></div>
          <div class="r"><b>报错怎么读</b><span>错误行上面的 <code>^</code> 指出了出错的位置，例如 <code>vlan 9999</code> 的 <code>^</code> 会指在 <code>9999</code> 下面</span></div>
          <div class="r"><b>小技巧</b><span>输入 <code>?</code> 看当前视图可用命令；按 <code>Tab</code> 自动补全；↑ ↓ 翻历史命令</span></div>
        </div>
        <h4 class="sec">画布操作</h4>
        <div class="kv">
          <div class="r"><b>平移</b><span>在空白处按住鼠标拖动</span></div>
          <div class="r"><b>缩放</b><span>按住 Ctrl 滚动滚轮</span></div>
          <div class="r"><b>删除</b><span>点设备右上角 × ，或右键设备；选中后按 Delete 键</span></div>
          <div class="r"><b>端口颜色</b><span>灰＝未连线，绿＝已连通，红＝已 shutdown，紫＝Trunk 口，黄＝当前选中待连线</span></div>
        </div>
        <h4 class="sec">命令行的展开与收起</h4>
        <p class="hint">
          下方命令行面板挡着画布的时候，点顶栏的 <code>命令行</code> 按钮即可收起，再点一次展开。
          也可以在面板右上角点 <code>⌄ 收起</code>，或用快捷键 <code>Ctrl + \`</code>。
          收起不会丢掉会话，展开后还是原来的标签页和提示符。
        </p>
        <h4 class="sec">配置的导出与导入</h4>
        <div class="kv">
          <div class="r"><b>导出配置</b><span>把每台设备的 <code>running-config</code> 导出成一个 .txt 文件，可以直接当作业提交。</span></div>
          <div class="r"><b>导入配置</b><span>选一个由「导出配置」生成的文件（或任意 VRP 的 <code>current-configuration</code> 文本），模拟器会把里面的命令逐条重放回设备。<br />
            画布上有同名设备 → 直接配到那台设备上；没有 → 按表头里的型号自动新建一台。<br />
            导入结束会弹出一份报告，列出每台设备生效了多少条、哪些命令没生效以及原因。</span></div>
          <div class="r"><b>注意</b><span>导出的是「设备配置」而不是「拓扑」，文件里不含连线。地址、VLAN、Trunk、ACL、NAT、路由这些配置会原样还原，但线缆要在画布上自己连回去。</span></div>
        </div>
      </div>`;
    openModal(html);
    $('mClose').onclick = closeModal;
  }

  /* ------------------------------ 导出配置 ------------------------------ */
  function exportConfig() {
    if (!E.Net.devices.length) {
      toast('当前没有设备可导出', 'bad');
      return;
    }
    const parts = [
      '配置导出时间：' + new Date().toLocaleString(),
      '（本文件可以用模拟器的「导入配置」原样读回：它会按下面的设备表头逐台重放这些命令）',
      ''
    ];
    for (const d of E.Net.devices) {
      parts.push('='.repeat(66));
      parts.push(`设备：${d.hostname}（${d.model}）`);
      parts.push('='.repeat(66));
      parts.push(...E.runningConfig(d));
      parts.push('');
    }
    const blob = new Blob([parts.join('\n')], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = '网络设备配置_' + new Date().toISOString().slice(0, 10) + '.txt';
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 3000);
    toast('配置已导出，可用「导入配置」再读回来', 'good');
  }

  /* ------------------------------ 导入配置 ------------------------------ */
  /**
   * 导入「导出配置」生成的文件：把里面的每一段 running-config 重放回设备。
   *  · 拓扑里有同名设备 → 直接配到那台设备上
   *  · 没有同名设备     → 按表头里的型号自动新建一台
   *  · 文件没有表头     → 配到当前打开的那台设备上
   */
  function importConfigFile(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => importConfigText(String(reader.result || ''), file.name);
    reader.onerror = () => toast('文件读取失败', 'bad');
    reader.readAsText(file, 'utf-8');
  }

  function importConfigText(text, fileName) {
    const res = E.Import.applyConfigText(text, { target: activeDev() });
    if (res.ok) {
      // 新建了设备 → 把自动命名计数器抬高，避免以后手动加设备时重名
      for (const d of E.Net.devices) {
        const base = d.type === 'pc' ? 'PC' : d.type === 'router' ? 'R' : 'SW';
        const n = parseInt(String(d.hostname).replace(/^\D+/, ''), 10);
        if (!isNaN(n)) nameSeq[base] = Math.max(nameSeq[base] || 0, n);
      }
      E.recomputeOspf();
      E.recomputeStp();
      persist();
      render();
      renderConsole();
    }
    showImportResult(res, fileName);
    if (res.ok) toast(res.bad ? '导入完成，有部分命令未生效' : '配置导入成功', res.bad ? 'bad' : 'good');
    return res;
  }

  function showImportResult(res, fileName) {
    const head = res.ok
      ? `${res.message}${fileName ? `（来源：${esc(fileName)}）` : ''}`
      : res.message;

    const rows = (res.results || [])
      .map((r) => {
        if (r.skip) {
          return `<div class="improw">
            <div class="imph"><b>${esc(r.hostname)}</b><span class="impm">${esc(r.model || '')}</span>
              <span class="tag2 skip">跳过</span></div>
            <div class="implist"><div class="e">${esc(r.skip)}</div></div>
          </div>`;
        }
        const detail = [];
        for (const f of r.failed) {
          detail.push(
            `<div><code>${esc(f.cmd)}</code><div class="e">${esc(
              (f.lines || []).filter((l) => l.trim()).join('\n')
            )}</div></div>`
          );
        }
        for (const u of r.unknown || []) {
          detail.push(`<div><code>${esc(u)}</code><div class="e">该行不是可识别的设备配置，已忽略。</div></div>`);
        }
        return `<div class="improw">
          <div class="imph">
            <b>${esc(r.hostname)}</b><span class="impm">${esc(r.model || '')}</span>
            <span class="tag2 ${r.isNew ? 'new' : ''}">${r.isNew ? '新建设备' : '已有设备'}</span>
            <span class="impn ${r.failed.length ? 'bad' : ''}">${r.applied}/${r.total} 条生效</span>
          </div>
          ${detail.length ? `<div class="implist">${detail.join('')}</div>` : ''}
        </div>`;
      })
      .join('');

    const html = `
      <div class="mh">${LOGO_TAG}
        <h2>导入配置${res.ok ? '' : '失败'}</h2>
        <button class="btn" id="mClose">关闭</button>
      </div>
      <div class="mb">
        <p class="hint">${head}</p>
        ${rows ? `<div class="imp">${rows}</div>` : ''}
        <h4 class="sec">请注意</h4>
        <p class="hint">
          导出的是「设备配置」，不包含连线。地址、VLAN、Trunk、ACL、NAT、路由等配置会原样还原，
          但线缆需要在画布上自己连回去（拖一个端口到另一个端口即可）。
        </p>
      </div>`;
    openModal(html);
    $('mClose').onclick = closeModal;
  }

  /* ------------------------------ 启动 ------------------------------ */
  function boot() {
    renderPalette();
    setupStage();
    setupInput();

    $('btnLab').onclick = showLabs;
    $('btnHelp').onclick = showHelp;
    $('btnSave').onclick = exportConfig;
    $('btnImport').onclick = () => $('fileImport').click();
    $('fileImport').onchange = (ev) => {
      const f = ev.target.files && ev.target.files[0];
      // 清空 value，这样连续导入同一个文件也能触发 change
      ev.target.value = '';
      importConfigFile(f);
    };
    $('btnTerm').onclick = () => {
      if (!UI.tabs.length) {
        toast('先双击一台设备打开命令行');
        return;
      }
      setTermOpen(!termIsOpen());
    };
    $('btnClear').onclick = () => {
      if (confirm('确定清空当前拓扑吗？此操作不可撤销。')) {
        clearAll();
        toast('拓扑已清空');
      }
    };
    $('mask').onclick = (ev) => {
      if (ev.target.id === 'mask') closeModal();
    };
    document.addEventListener('keydown', (ev) => {
      if (ev.key === 'Escape') closeModal();
      // Ctrl+` 展开 / 收起命令行面板
      if (ev.ctrlKey && ev.key === '`') {
        ev.preventDefault();
        if (UI.tabs.length) setTermOpen(!termIsOpen());
      }
    });

    const restored = restore();
    applyTransform();
    E.recomputeOspf();
    E.recomputeStp();
    render();
    renderConsole();

    if (restored && E.Net.devices.length) {
      // 恢复上次的拓扑：自动打开第一台网络设备的命令行，学生可直接开始输入
      const first = E.Net.devices.find((d) => d.type !== 'pc') || E.Net.devices[0];
      openConsole(first);
      toast('已恢复上次的拓扑');
    } else {
      // 首次打开：直接加载实验一，让学生立刻有东西可玩
      loadLab('vlan-basic');
      toast('已加载「实验一 · VLAN 基础」，点击「开始配置」即可');
    }
    syncTermBtn();
  }

  // 对外可编程接口：便于自动化测试与二次集成（NE.UI.openConsole(dev) 等）
  UI.openConsole = openConsole;
  UI.closeConsole = closeConsole;
  UI.runCommand = runCommand;
  UI.loadLab = loadLab;
  UI.clearAll = clearAll;
  UI.toast = toast;
  UI.setTermOpen = setTermOpen;
  UI.termIsOpen = termIsOpen;
  UI.importConfigText = importConfigText;
  UI.cardW = cardW;
  UI.cardHeight = cardHeight;

  global.NE = global.NE || {};
  global.NE.UI = UI;
  global.NE.LABS = LABS;

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})(window);

</script>
</body>
</html>
