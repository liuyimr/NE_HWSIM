<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NE_HWSIM · 华为 VRP 网络实训模拟器</title>
<style>
  :root{
    --bg:#0d1117; --bg2:#161b22; --bg3:#1c2128; --line:#30363d;
    --tx:#e6edf3; --tx2:#8b949e; --tx3:#6e7681;
    --cy:#2f81f7; --gr:#3fb950; --or:#d29922; --rd:#f85149; --pu:#a371f7;
    --mono:"Consolas","Cascadia Mono","JetBrains Mono",Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--tx);
    font-family:"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;
    font-size:13px;overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;font-size:13px;cursor:pointer;border:none;background:none;color:inherit}
  input,select{font-family:inherit;font-size:13px}

  /* ---------- 布局 ---------- */
  .app{display:flex;flex-direction:column;height:100vh}
  .topbar{
    height:48px;flex:0 0 48px;display:flex;align-items:center;gap:14px;
    padding:0 14px;background:var(--bg2);border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:.3px}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--gr);box-shadow:0 0 8px var(--gr)}
  .brand small{font-weight:400;color:var(--tx3);font-size:11px;margin-left:2px}
  .tb-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
  .btn{
    padding:6px 12px;border-radius:6px;border:1px solid var(--line);
    background:var(--bg3);color:var(--tx);transition:.15s;white-space:nowrap;
  }
  .btn:hover{border-color:#4b5563;background:#22272e}
  .btn.primary{background:var(--cy);border-color:var(--cy);color:#fff;font-weight:600}
  .btn.primary:hover{background:#4a95f8}
  .btn.ghost{background:transparent}
  .btn.sm{padding:4px 9px;font-size:12px}

  .main{flex:1;display:flex;min-height:0}

  /* ---------- 左栏 ---------- */
  .side{
    width:190px;flex:0 0 190px;background:var(--bg2);
    border-right:1px solid var(--line);display:flex;flex-direction:column;
  }
  .side h3{
    font-size:11px;font-weight:600;color:var(--tx3);letter-spacing:.9px;
    padding:13px 14px 8px;text-transform:uppercase;
  }
  .palette{padding:0 10px 6px;display:flex;flex-direction:column;gap:6px}
  .pal{
    display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:7px;
    border:1px solid var(--line);background:var(--bg3);transition:.15s;text-align:left;
  }
  .pal:hover{border-color:var(--cy);background:#1f2733}
  .pal .ic{
    width:26px;height:26px;border-radius:6px;display:flex;align-items:center;
    justify-content:center;font-size:14px;background:#0d1117;border:1px solid var(--line);flex:0 0 26px;
  }
  .pal .tx b{display:block;font-size:12px;font-weight:600;line-height:1.35}
  .pal .tx span{font-size:10.5px;color:var(--tx3)}
  .side .hint{
    margin:auto 10px 12px;padding:9px 10px;border-radius:7px;
    background:#0d1117;border:1px solid var(--line);font-size:11px;
    line-height:1.75;color:var(--tx2);
  }
  .side .hint b{color:var(--tx)}

  /* ---------- 画布 ---------- */
  .stage{flex:1;position:relative;overflow:hidden;background:
    radial-gradient(circle at 1px 1px,#22282f 1px,transparent 0) 0 0/22px 22px;
  }
  .stage-inner{position:absolute;inset:0;transform-origin:0 0}
  svg.wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}

  .card{
    position:absolute;background:var(--bg2);border:1px solid var(--line);
    border-radius:10px;user-select:none;box-shadow:0 6px 22px rgba(0,0,0,.45);
    transition:border-color .15s, box-shadow .15s;
  }
  .card:hover{border-color:#4b5563}
  .card.sel{border-color:var(--cy);box-shadow:0 0 0 2px rgba(47,129,247,.28),0 6px 22px rgba(0,0,0,.5)}
  .card .head{
    height:46px;padding:7px 11px 0;cursor:move;display:flex;align-items:flex-start;gap:8px;
  }
  .card .head .nm{font-size:12.5px;font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card .head .md{font-size:10px;color:var(--tx3);line-height:1.5;margin-top:1px}
  .card .head .tag{
    font-size:10px;padding:1px 6px;border-radius:9px;background:#21262d;
    border:1px solid var(--line);color:var(--tx2);white-space:nowrap;
  }
  .card .head .x{
    margin-left:auto;color:var(--tx3);font-size:15px;line-height:1;padding:2px 4px;border-radius:4px;
  }
  .card .head .x:hover{color:var(--rd);background:#2d1618}
  .ports{display:grid;gap:3px;padding:6px 13px 12px}
  .port{
    height:14px;border-radius:3px;background:#30363d;border:1px solid #3d444d;
    cursor:crosshair;position:relative;transition:.12s;
  }
  .port:hover{background:var(--cy);border-color:#79b8ff;transform:scale(1.16);z-index:3}
  .port.up{background:#1f6f36;border-color:#2ea043}
  .port.shut{background:#6e2c2c;border-color:#8b3a3a}
  .port.pend{background:var(--or);border-color:#f0c674;transform:scale(1.2);box-shadow:0 0 8px rgba(210,153,34,.7)}
  .port.trunk{background:#3b2d5e;border-color:var(--pu)}
  .port .lab{
    position:absolute;left:50%;top:-15px;transform:translateX(-50%);
    font-size:9px;color:var(--tx2);background:var(--bg);padding:0 3px;border-radius:3px;
    white-space:nowrap;pointer-events:none;opacity:0;transition:.12s;z-index:5;
  }
  .port:hover .lab{opacity:1}

  .empty{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:10px;color:var(--tx3);pointer-events:none;
  }
  .empty b{font-size:15px;color:var(--tx2);font-weight:600}
  .empty p{font-size:12px;line-height:1.9}

  /* ---------- 终端 ---------- */
  .term{
    flex:0 0 0;height:0;background:var(--bg2);border-top:1px solid var(--line);
    display:flex;flex-direction:column;overflow:hidden;transition:height .18s ease;
  }
  .term.open{flex:0 0 336px;height:336px}
  .term.max{flex:0 0 62vh;height:62vh}
  .tabs{display:flex;align-items:center;background:var(--bg3);border-bottom:1px solid var(--line);min-height:35px;padding-right:8px}
  .tab{
    display:flex;align-items:center;gap:7px;padding:8px 11px;font-size:12px;
    border-right:1px solid var(--line);color:var(--tx2);cursor:pointer;white-space:nowrap;
  }
  .tab:hover{background:#22272e;color:var(--tx)}
  .tab.on{background:var(--bg2);color:var(--tx);box-shadow:inset 0 2px 0 var(--cy)}
  .tab .cl{opacity:.4;font-size:13px}
  .tab .cl:hover{opacity:1;color:var(--rd)}
  .tabs .sp{margin-left:auto;display:flex;gap:4px}
  .tabs .sp .btn{padding:3px 8px;font-size:11px}

  .screen{
    flex:1;overflow-y:auto;padding:10px 14px 14px;font-family:var(--mono);
    font-size:12.5px;line-height:1.62;white-space:pre-wrap;word-break:break-all;
  }
  .screen::-webkit-scrollbar,.left::-webkit-scrollbar{width:9px}
  .screen::-webkit-scrollbar-thumb{background:#30363d;border-radius:5px}
  .ln{color:#c9d1d9}
  .ln.cmd{color:#e6edf3;font-weight:600}
  .ln.err{color:var(--rd)}
  .ln.warn{color:var(--or)}
  .ln.ok{color:var(--gr)}
  .ln.dim{color:var(--tx3)}
  .ln.hl{color:#79b8ff}
  .inrow{display:flex;align-items:center;gap:8px;padding:8px 14px;border-top:1px solid var(--line);background:var(--bg2)}
  .inrow .pr{font-family:var(--mono);font-size:13px;color:var(--gr);font-weight:700;white-space:nowrap}
  .inrow input{
    flex:1;background:transparent;border:none;outline:none;color:var(--tx);
    font-family:var(--mono);font-size:13px;padding:3px 0;
  }
  .inrow input::placeholder{color:#484f58}

  /* ---------- 弹窗 ---------- */
  .mask{position:fixed;inset:0;background:rgba(1,4,9,.72);display:none;align-items:center;justify-content:center;z-index:99;padding:24px}
  .mask.on{display:flex}
  .modal{
    background:var(--bg2);border:1px solid var(--line);border-radius:12px;
    width:100%;max-width:720px;max-height:84vh;display:flex;flex-direction:column;overflow:hidden;
    box-shadow:0 14px 44px rgba(0,0,0,.6);
  }
  .modal .mh{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .modal .mh h2{font-size:15px;font-weight:600}
  .modal .mh .btn{margin-left:auto}
  .modal .mb{padding:16px 18px;overflow-y:auto}
  .labgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .labcard{
    border:1px solid var(--line);border-radius:9px;padding:12px;background:var(--bg3);
    cursor:pointer;transition:.15s;
  }
  .labcard:hover{border-color:var(--cy);background:#1f2733;transform:translateY(-1px)}
  .labcard b{display:block;font-size:13px;margin-bottom:5px}
  .labcard span{font-size:11.5px;color:var(--tx2);line-height:1.65;display:block}
  .labcard .lv{display:inline-block;font-size:10px;padding:1px 7px;border-radius:9px;margin-top:7px;border:1px solid var(--line);color:var(--tx3)}
  .steps{list-style:none;display:flex;flex-direction:column;gap:9px}
  .steps li{
    display:flex;gap:10px;padding:10px 12px;border:1px solid var(--line);
    border-radius:8px;background:var(--bg3);font-size:12.5px;line-height:1.7;
  }
  .steps li .n{
    flex:0 0 20px;height:20px;border-radius:50%;background:#0d1117;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--cy);
  }
  .steps li code{font-family:var(--mono);background:#0d1117;border:1px solid var(--line);padding:0 5px;border-radius:4px;color:#79b8ff}
  .kv{display:flex;flex-direction:column;gap:8px}
  .kv .r{display:flex;gap:10px;font-size:12.5px;line-height:1.7}
  .kv .r b{flex:0 0 92px;color:var(--tx2);font-weight:500}
  h4.sec{font-size:12px;color:var(--tx3);letter-spacing:.7px;margin:16px 0 9px;text-transform:uppercase}
  h4.sec:first-child{margin-top:0}
  .mb .hint{font-size:12.5px;line-height:1.7;color:var(--tx2);margin:0 0 10px}
  .tree{display:flex;flex-direction:column;gap:5px;font-size:12px;
        border-left:2px solid var(--line);padding:6px 0 6px 12px;margin-bottom:4px}
  .tree>div{display:flex;align-items:baseline;gap:10px}
  .tree code{font-family:var(--mono);color:#79b8ff;background:#0d1117;border:1px solid var(--line);
             padding:0 5px;border-radius:4px;white-space:nowrap}
  .tree span{color:var(--tx3);font-size:11.5px}
  .tree .lv2{margin-left:14px}
  .tree .lv3{margin-left:28px}
  .tree .lv4{margin-left:42px}
  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(14px);
    background:var(--bg3);border:1px solid var(--line);color:var(--tx);padding:9px 16px;
    border-radius:8px;font-size:12.5px;opacity:0;transition:.22s;z-index:200;pointer-events:none;
    box-shadow:0 8px 24px rgba(0,0,0,.5);max-width:70vw;
  }
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.bad{border-color:#8b3a3a;color:#ffb3ae}
  .toast.good{border-color:#2ea043;color:#8ee99b}
  @media(max-width:900px){
    .side{width:154px;flex-basis:154px}
    .labgrid{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">
      <span class="dot"></span>
      NE_HWSIM
      <small>华为 VRP 交换机 / 路由器实训模拟器</small>
    </div>
    <div class="tb-actions">
      <button class="btn" id="btnLab">实训实验</button>
      <button class="btn" id="btnHelp">帮助</button>
      <button class="btn" id="btnSave">导出配置</button>
      <button class="btn" id="btnClear">清空</button>
    </div>
  </div>

  <div class="main">
    <aside class="side">
      <h3>设备库</h3>
      <div class="palette" id="palette"></div>
      <div class="hint">
        <b>怎么用：</b><br />
        1. 点左侧设备加入拓扑<br />
        2. 拖动图标摆放位置<br />
        3. 点一个灰口，再点另一个灰口 → 连线<br />
        4. 双击设备打开命令行<br />
        5. 右键设备可删除
      </div>
    </aside>

    <div class="stage" id="stage">
      <div class="stage-inner" id="stageInner">
        <svg class="wires" id="wires"></svg>
        <div id="cards"></div>
        <div class="empty" id="empty">
          <b>画布是空的</b>
          <p>从左侧点选设备加入拓扑，或打开「实训实验」直接加载一套现成的实验环境。</p>
        </div>
      </div>
    </div>
  </div>

  <div class="term" id="term">
    <div class="tabs" id="tabs"></div>
    <div class="screen" id="screen"></div>
    <div class="inrow" id="inrow">
      <span class="pr" id="prompt">&lt;Huawei&gt;</span>
      <input id="cmd" autocomplete="off" spellcheck="false" placeholder="输入命令，? 查看帮助，Tab 补全" />
    </div>
  </div>
</div>

<div class="mask" id="mask"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================================
 * NE_HWSIM —— 华为 VRP 网络实训模拟器
 * 模块：数据模型 + 转发仿真引擎
 *
 * 纯 JavaScript，无任何外部依赖。
 *
 * Copyright (c) 2026 新易科技工作室 NewE
 * 作者：Liuyi  <yimr@sohu.com>
 * 协议：MIT License
 *
 * 本项目为独立的非官方教学演示工具，与华为技术有限公司无任何关联。
 * ========================================================================= */
(function (global) {
  'use strict';

  /* ------------------------------ 工具函数 ------------------------------ */

  let _seq = 0;
  const uid = (p) => `${p || 'id'}-${(++_seq).toString(36)}${Math.random().toString(36).slice(2, 5)}`;

  const HEX = '0123456789ABCDEF';
  function randomMac() {
    let mac = '50:50:00';
    for (let i = 0; i < 3; i++) mac += ':' + HEX[(Math.random() * 16) | 0] + HEX[(Math.random() * 16) | 0];
    return mac;
  }

  const clone = (o) => JSON.parse(JSON.stringify(o));

  /** "255.255.255.0" -> 24 ; "24" -> 24 ; 支持 /24 形式 */
  function maskToPrefix(mask) {
    if (mask == null) return null;
    if (typeof mask === 'number') return mask;
    const s = String(mask).trim();
    if (s.includes('.')) {
      let n = 0;
      for (const oct of s.split('.')) {
        const v = parseInt(oct, 10);
        if (isNaN(v)) return null;
        n += v.toString(2).split('').filter((c) => c === '1').length;
      }
      return n;
    }
    const p = parseInt(s, 10);
    return isNaN(p) ? null : p;
  }

  function prefixToMask(prefix) {
    if (prefix === 0) return '0.0.0.0';
    const n = prefix == null ? 24 : prefix;
    const bits = '1'.repeat(n) + '0'.repeat(32 - n);
    return [0, 8, 16, 24].map((i) => parseInt(bits.slice(i, i + 8), 2)).join('.');
  }

  function isValidIp(ip) {
    if (typeof ip !== 'string') return false;
    const parts = ip.split('.');
    if (parts.length !== 4) return false;
    return parts.every((p) => /^\d{1,3}$/.test(p) && +p >= 0 && +p <= 255);
  }

  function ipToInt(ip) {
    const p = ip.split('.').map(Number);
    return ((p[0] << 24) | (p[1] << 16) | (p[2] << 8) | p[3]) >>> 0;
  }

  function intToIp(v) {
    return [(v >>> 24) & 255, (v >>> 16) & 255, (v >>> 8) & 255, v & 255].join('.');
  }

  /** 两个 IP 是否在同一网段 */
  function sameSubnet(ipA, prefix, ipB) {
    if (!isValidIp(ipA) || !isValidIp(ipB) || prefix == null) return false;
    if (prefix === 0) return true;
    const m = prefix === 32 ? 0xffffffff : (~((1 << (32 - prefix)) - 1) >>> 0);
    return ((ipToInt(ipA) & m) >>> 0) === ((ipToInt(ipB) & m) >>> 0);
  }

  function networkOf(ip, prefix) {
    if (!isValidIp(ip)) return null;
    if (prefix === 0) return '0.0.0.0';
    const m = prefix === 32 ? 0xffffffff : (~((1 << (32 - prefix)) - 1) >>> 0);
    return intToIp((ipToInt(ip) & m) >>> 0);
  }

  /** 通配符掩码反查前缀长度：0.0.0.255 -> 24 */
  function wildcardToPrefix(wc) {
    if (!isValidIp(wc)) return null;
    const inv = ipToInt(wc);
    const mask = (~inv) >>> 0;
    const bits = mask.toString(2).padStart(32, '0');
    if (!/^1*0*$/.test(bits)) return null;
    return bits.split('').filter((c) => c === '1').length;
  }

  /* ------------------------------ 设备模板 ------------------------------ */

  const TEMPLATES = {
    'S5700': {
      key: 'S5700',
      model: 'S5700-28TP-EI',
      type: 'switch',
      label: '三层交换机',
      vendor: 'Huawei',
      desc: '24×GE 电口 + 4×GE 光口',
      ports: [
        ...Array.from({ length: 24 }, (_, i) => ({ name: `GigabitEthernet0/0/${i + 1}`, kind: 'RJ45' })),
        ...Array.from({ length: 4 }, (_, i) => ({ name: `GigabitEthernet0/0/${i + 25}`, kind: 'SFP' }))
      ]
    },
    'S3700': {
      key: 'S3700',
      model: 'S3700-28TP-EI',
      type: 'switch',
      label: '二层交换机',
      vendor: 'Huawei',
      desc: '24×GE 电口（纯二层）',
      l2only: true,
      ports: Array.from({ length: 24 }, (_, i) => ({ name: `GigabitEthernet0/0/${i + 1}`, kind: 'RJ45' }))
    },
    'AR6121': {
      key: 'AR6121',
      model: 'AR6121',
      type: 'router',
      label: '企业路由器',
      vendor: 'Huawei',
      desc: '4×GE 路由口',
      ports: Array.from({ length: 4 }, (_, i) => ({ name: `GigabitEthernet0/0/${i}`, kind: 'RJ45' }))
    },
    'PC': {
      key: 'PC',
      model: 'PC',
      type: 'pc',
      label: 'PC 终端',
      vendor: 'PC',
      desc: '1×以太网口',
      ports: [{ name: 'Ethernet0/0/0', kind: 'RJ45' }]
    }
  };

  /** 创建端口对象 */
  function makePort(name, kind, mode) {
    return {
      id: uid('p'),
      name,
      kind, // RJ45 | SFP
      mode, // access | trunk | hybrid | routed
      shutdown: false,
      vlan: 1, // access / hybrid 缺省 VLAN
      allowedVlans: 'all', // trunk 允许的 VLAN：'all' 或 number[]
      ip: null,
      mask: null, // 前缀长度
      desc: '',
      trunkId: null, // 加入的 Eth-Trunk 编号
      stpEdged: false,
      bpduProtect: false,
      portSec: { enabled: false, maxMac: 1 },
      dhcpSelect: false,
      cableId: null
    };
  }

  /** 创建一台设备 */
  function createDevice(key, x, y) {
    const t = TEMPLATES[key];
    if (!t) throw new Error('未知设备型号: ' + key);
    const isRouted = t.type === 'router' || t.type === 'pc';
    const dev = {
      id: uid('d'),
      key: t.key,
      model: t.model,
      type: t.type,
      vendor: t.vendor,
      l2only: !!t.l2only,
      hostname: t.type === 'pc' ? 'PC' : t.type === 'router' ? 'Router' : 'Huawei',
      x: x == null ? 120 : x,
      y: y == null ? 120 : y,
      ports: t.ports.map((p) => makePort(p.name, p.kind, isRouted ? 'routed' : 'access')),
      vlans: [1],
      vlanifs: [],
      routes: [],
      acl: [],
      aclBindings: [], // { portId, direction, aclId }
      dhcp: { enabled: false, pools: [] },
      ospf: { enabled: false, pid: null, routerId: null, areas: [], ifaces: [] },
      stp: { mode: 'rstp', priority: 32768 },
      staticMac: [],
      netconf: { enabled: false },
      savedConfig: null,
      lastSaved: 0,
      logs: [],
      // VLAN 附加信息：{ [vlanId]: { desc, name } }。VLAN 号本身仍存在 vlans 数组里，这里只放可选属性，
      // 避免改动既有引擎逻辑。
      vlanMeta: {},
      // 命令行视图状态。stack 是视图栈，quit 逐级弹栈返回上一级视图，
      // 与真实 VRP 的「一级一级进入、quit 一级一级退出」保持一致。
      cli: {
        view: 'user-view',
        stack: [],
        ifaceId: null,
        vlanifId: null,
        vlanId: null,
        trunkId: null,
        poolName: null,
        aclId: null,
        ospfPid: null,
        areaId: null,
        // 交互式命令的等待状态，例如 save 的 y/n 确认、文件名输入。
        pending: null
      }
    };
    return dev;
  }

  /**
   * 兼容性修复：把从 localStorage 恢复出来的旧版设备对象补齐到当前结构。
   * 旧存档缺 vlanMeta / cli.stack 等字段，直接使用会报错。
   * 特别注意：pending（交互式等待状态）一律清空 —— 存档不能停在"等待输入 y/n"这种中间态。
   */
  function normalizeDevice(dev) {
    if (!dev || typeof dev !== 'object') return dev;
    if (!dev.vlanMeta) dev.vlanMeta = {};
    if (!Array.isArray(dev.vlans)) dev.vlans = [1];
    if (!dev.vlans.includes(1)) dev.vlans.unshift(1);
    for (const k of ['vlanifs', 'routes', 'acl', 'aclBindings', 'staticMac', 'logs']) {
      if (!Array.isArray(dev[k])) dev[k] = [];
    }
    if (!dev.dhcp) dev.dhcp = { enabled: false, pools: [], leases: [] };
    if (!Array.isArray(dev.dhcp.pools)) dev.dhcp.pools = [];
    if (!dev.ospf) dev.ospf = { enabled: false, pid: null, routerId: null, areas: [], ifaces: [] };
    if (!Array.isArray(dev.ospf.areas)) dev.ospf.areas = [];
    if (!Array.isArray(dev.ospf.ifaces)) dev.ospf.ifaces = [];
    if (!dev.stp) dev.stp = { mode: 'rstp', priority: 32768 };
    if (!dev.cli || typeof dev.cli !== 'object') dev.cli = {};
    const c = dev.cli;
    if (!Array.isArray(c.stack)) c.stack = [];
    if (!c.view) c.view = 'user-view';
    for (const k of ['ifaceId', 'vlanifId', 'vlanId', 'trunkId', 'poolName', 'aclId', 'ospfPid', 'areaId']) {
      if (c[k] === undefined) c[k] = null;
    }
    c.pending = null;
    for (const p of dev.ports || []) {
      if (!p.portSec) p.portSec = { enabled: false, maxMac: 1 };
    }
    return dev;
  }

  /* --------------------------- 拓扑（网络对象） --------------------------- */

  const Net = {
    devices: [],
    cables: [],

    reset() {
      this.devices = [];
      this.cables = [];
    },

    getDevice(id) {
      return this.devices.find((d) => d.id === id) || null;
    },

    getCable(id) {
      return this.cables.find((c) => c.id === id) || null;
    },

    getPort(device, portId) {
      return (device && device.ports.find((p) => p.id === portId)) || null;
    },

    /** 找出与某端口相连的对端 { device, port, cable } */
    peerOf(device, port) {
      if (!port || !port.cableId) return null;
      const cable = this.getCable(port.cableId);
      if (!cable) return null;
      const isSrc = cable.aDeviceId === device.id && cable.aPortId === port.id;
      const otherDevId = isSrc ? cable.bDeviceId : cable.aDeviceId;
      const otherPortId = isSrc ? cable.bPortId : cable.aPortId;
      const otherDev = this.getDevice(otherDevId);
      if (!otherDev) return null;
      return { device: otherDev, port: this.getPort(otherDev, otherPortId), cable };
    },

    addDevice(key, x, y) {
      const d = createDevice(key, x, y);
      this.devices.push(d);
      return d;
    },

    removeDevice(id) {
      this.devices = this.devices.filter((d) => d.id !== id);
      this.cables = this.cables.filter((c) => {
        if (c.aDeviceId === id || c.bDeviceId === id) {
          const other = this.getDevice(c.aDeviceId === id ? c.bDeviceId : c.aDeviceId);
          const otherPort = other && this.getPort(other, c.aDeviceId === id ? c.bPortId : c.aPortId);
          if (otherPort) otherPort.cableId = null;
          return false;
        }
        return true;
      });
    },

    canConnect(devA, portA, devB, portB) {
      if (!devA || !devB || devA.id === devB.id) return '不能连接到同一台设备';
      if (!portA || !portB) return '端口不存在';
      if (portA.cableId) return `${devA.hostname} 的 ${portA.name} 已被占用`;
      if (portB.cableId) return `${devB.hostname} 的 ${portB.name} 已被占用`;
      if (portA.kind === 'SFP' !== (portB.kind === 'SFP')) return '光口与电口不能互连（请使用同类型端口）';
      return null;
    },

    addCable(devA, portA, devB, portB) {
      const err = this.canConnect(devA, portA, devB, portB);
      if (err) return { ok: false, message: err };
      const cable = {
        id: uid('cable'),
        aDeviceId: devA.id,
        aPortId: portA.id,
        bDeviceId: devB.id,
        bPortId: portB.id
      };
      portA.cableId = cable.id;
      portB.cableId = cable.id;
      this.cables.push(cable);
      return { ok: true, cable };
    },

    removeCable(id) {
      const cable = this.getCable(id);
      if (!cable) return;
      const a = this.getDevice(cable.aDeviceId);
      const b = this.getDevice(cable.bDeviceId);
      const pa = a && this.getPort(a, cable.aPortId);
      const pb = b && this.getPort(b, cable.bPortId);
      if (pa) pa.cableId = null;
      if (pb) pb.cableId = null;
      this.cables = this.cables.filter((c) => c.id !== id);
    },

    /** 端口是否 up（没被 shutdown 且（已连线 或 是 Vlanif 承载口）） */
    portUp(device, port) {
      if (!port) return false;
      if (port.shutdown) return false;
      if (device.type === 'pc') return !!port.cableId;
      return !!port.cableId;
    }
  };

  /* ======================== 二层 / 三层转发模型 ======================== */

  const VLAN_DOMAIN = 'vlan';
  const P2P_DOMAIN = 'p2p';

  /** 判断某端口在给定 VLAN 域下能否通行（作为二层口） */
  function portPassesVlan(port, vlanId) {
    if (!port || port.shutdown) return false;
    if (port.mode === 'routed') return false;
    if (port.mode === 'access') return port.vlan === vlanId;
    if (port.mode === 'trunk' || port.mode === 'hybrid') {
      if (port.allowedVlans === 'all') return true;
      return Array.isArray(port.allowedVlans) && port.allowedVlans.includes(vlanId);
    }
    return false;
  }

  /** 端口的缺省 VLAN（access / hybrid 用） */
  function portVlan(port) {
    return port.vlan == null ? 1 : port.vlan;
  }

  /**
   * 计算某个出接口把报文送到对端时，所在的二层域。
   * 返回 { type:'vlan', vlan } 或 { type:'p2p' }
   */
  function egressDomain(device, port) {
    if (!port) return null;
    if (port.mode === 'routed') {
      // 路由口：若对端是交换机的二层口，则实际落在对端所属 VLAN 里
      const peer = Net.peerOf(device, port);
      if (peer && peer.port && peer.device.type === 'switch' && peer.port.mode !== 'routed') {
        return { type: VLAN_DOMAIN, vlan: portVlan(peer.port) };
      }
      return { type: P2P_DOMAIN };
    }
    return { type: VLAN_DOMAIN, vlan: portVlan(port) };
  }

  /**
   * 从 (device, port) 出发，在二层域内做 BFS，寻找「拥有 targetIp 三层地址」的设备。
   * 返回 { device, path:[devId...], reason } 或 null
   */
  function deliverL2(device, port, domain, targetIp, aclCtx) {
    const visited = new Set([device.id]);
    // 队列元素：{ device, path, ingressPortId }
    const queue = [{ device, path: [device.id], ingressPortId: null }];

    // 起点设备自身是否拥有该 IP（例如本地 Vlanif）
    if (ownsIpInDomain(device, domain, targetIp)) {
      return { device, path: [device.id], ingressPortId: null };
    }

    while (queue.length) {
      const cur = queue.shift();
      for (const p of cur.device.ports) {
        if (p.shutdown || !p.cableId) continue;

        // 起点只允许从指定端口出发（该端口的域已由 egressDomain 判定，无需再校验）
        const isFirst = cur.device.id === device.id;
        if (isFirst) {
          if (p.id !== port.id) continue;
        } else if (domain.type === VLAN_DOMAIN) {
          if (cur.device.type !== 'pc' && !portPassesVlan(p, domain.vlan)) continue;
        }

        const peer = Net.peerOf(cur.device, p);
        if (!peer || !peer.device || !peer.port) continue;
        if (visited.has(peer.device.id)) continue;

        // 对端端口必须也能承载该域（对端是路由口/PC 时表示二层段在此终结，允许进入）
        const peerIsL3End = peer.port.mode === 'routed' || peer.device.type === 'pc';
        if (domain.type === VLAN_DOMAIN && !peerIsL3End) {
          if (!portPassesVlan(peer.port, domain.vlan)) continue;
        }
        if (domain.type === P2P_DOMAIN && !peerIsL3End) {
          // 点到点域只走路由口/主机口
          if (peer.port.mode !== 'routed' && peer.device.type !== 'pc') continue;
        }

        visited.add(peer.device.id);
        const path = [...cur.path, peer.device.id];

        // 报文经过的每一台设备都要检查入接口绑定的 ACL
        if (aclCtx && aclCtx.srcIp) {
          const deny = checkAcl(peer.device, aclCtx.srcIp, aclCtx.dstIp, peer.port.id);
          if (deny) return { denied: deny, path };
        }

        if (ownsIpInDomain(peer.device, domain, targetIp)) {
          return { device: peer.device, path, ingressPortId: peer.port.id };
        }
        queue.push({ device: peer.device, path, ingressPortId: peer.port.id });
      }
    }
    return null;
  }

  /** 设备在给定二层域下是否拥有该 IP 地址（三层拥有关系） */
  function ownsIpInDomain(device, domain, ip) {
    if (!ip) return false;
    // Vlanif
    for (const vi of device.vlanifs) {
      if (!vi.enabled) continue;
      if (vi.ip !== ip) continue;
      if (domain.type === VLAN_DOMAIN && vi.vlanId === domain.vlan) return true;
      if (domain.type === P2P_DOMAIN) return false;
    }
    // 物理路由口
    for (const p of device.ports) {
      if (p.mode !== 'routed' || p.shutdown || !p.ip) continue;
      if (p.ip !== ip) continue;
      if (domain.type === P2P_DOMAIN) return true;
      // 路由口挂在某个 VLAN 域里（路由口直连交换机二层口）
      const d = egressDomain(device, p);
      if (d && d.type === VLAN_DOMAIN && d.vlan === domain.vlan) return true;
    }
    // PC 主机口
    if (device.type === 'pc') {
      for (const p of device.ports) {
        if (p.ip === ip && p.cableId) return true;
      }
    }
    return false;
  }

  /** 设备所有三层接口（含 Vlanif / 路由口） */
  function l3Interfaces(device) {
    const list = [];
    for (const vi of device.vlanifs) {
      if (!vi.enabled || !vi.ip || vi.mask == null) continue;
      list.push({ kind: 'vlanif', name: `Vlanif${vi.vlanId}`, vlanId: vi.vlanId, ip: vi.ip, mask: vi.mask, enabled: vi.enabled });
    }
    for (const p of device.ports) {
      if (p.mode !== 'routed') continue;
      if (!p.ip || p.mask == null) continue;
      list.push({ kind: 'port', name: p.name, portId: p.id, ip: p.ip, mask: p.mask, up: !p.shutdown && !!p.cableId });
    }
    return list;
  }

  /** 查路由表：返回 { type:'direct'|'route'|'none', iface, nextHop } */
  function routeLookup(device, dstIp) {
    const ifaces = l3Interfaces(device);
    // 1) 直连
    for (const i of ifaces) {
      if (i.kind === 'port' && !i.up) continue;
      if (sameSubnet(i.ip, i.mask, dstIp)) {
        return { type: 'direct', iface: i, nextHop: null };
      }
    }
    // 2) 最长前缀匹配（静态 / OSPF）
    let best = null;
    for (const r of device.routes) {
      if (r.mask == null) continue;
      if (!sameSubnet(r.dest, r.mask, dstIp)) continue;
      if (!best || r.mask > best.mask) best = r;
    }
    if (best) {
      const iface =
        ifaces.find((i) => (best.ifaceName ? i.name === best.ifaceName : false)) ||
        ifaces.find((i) => sameSubnet(i.ip, i.mask, best.nextHop)) ||
        null;
      return { type: 'route', iface, nextHop: best.nextHop, route: best };
    }
    // 3) PC 的缺省网关兜底
    if (device.type === 'pc') {
      const p = device.ports.find((x) => x.ip && x.gateway && x.cableId);
      if (p) {
        const iface = ifaces.find((i) => i.portId === p.id) || null;
        return {
          type: 'route',
          iface,
          nextHop: p.gateway,
          route: { dest: '0.0.0.0', mask: 0, nextHop: p.gateway, proto: 'Static', pre: 0 }
        };
      }
    }
    return { type: 'none' };
  }

  /** 找到设备上用于转发到某个下一跳/目的的出接口 */
  function findEgressIface(device, dstIp, lookup) {
    if (lookup.type === 'direct') return lookup.iface;
    if (lookup.iface) return lookup.iface;
    for (const i of l3Interfaces(device)) {
      if (lookup.nextHop && sameSubnet(i.ip, i.mask, lookup.nextHop)) return i;
    }
    return null;
  }

  /** 由三层接口反查其承载端口（用于 Eth-Trunk / 物理口） */
  function ifaceToPort(device, iface) {
    if (!iface) return null;
    if (iface.kind === 'port') return Net.getPort(device, iface.portId);
    return null;
  }

  /**
   * 核心：从 device 转发一个报文到 dstIp。
   * 返回 { ok, path:[devId], reason, blocked }
   */
  function forward(device, dstIp, opts) {
    const options = opts || {};
    const maxHops = options.maxHops || 16;
    const srcIp = options.srcIp || null;
    const path = options.path ? [...options.path] : [device.id];
    const visitedDevices = options.visitedDevices || new Set([device.id]);

    if (maxHops <= 0) return { ok: false, path, reason: 'TTL 超时（路由环路）' };

    // 目的地址是否就是本机
    for (const i of l3Interfaces(device)) {
      if (i.ip === dstIp) return { ok: true, path, reason: 'local' };
    }
    if (device.type === 'pc') {
      for (const p of device.ports) if (p.ip === dstIp) return { ok: true, path, reason: 'local' };
    }

    // ACL 检查（仅检查报文入接口绑定的 ACL）
    const aclDeny = checkAcl(device, srcIp, dstIp, options.ingressPortId);
    if (aclDeny) return { ok: false, path, reason: aclDeny, blocked: true };

    const lookup = routeLookup(device, dstIp);
    if (lookup.type === 'none') {
      return { ok: false, path, reason: `没有到达 ${dstIp} 的路由` };
    }

    const egress = findEgressIface(device, dstIp, lookup);
    if (!egress) return { ok: false, path, reason: '找不到出接口' };

    const ctx = { srcIp, path, visitedDevices, maxHops };
    let port = null;
    let domain = null;

    if (egress.kind === 'port') {
      port = Net.getPort(device, egress.portId);
      if (!port || port.shutdown) return { ok: false, path, reason: `${egress.name} 接口已关闭` };
      if (!port.cableId) return { ok: false, path, reason: `出接口 ${egress.name} 未连接线缆` };
      domain = egressDomain(device, port);
      const res = forwardViaPort(device, dstIp, lookup, port, domain, ctx);
      return res || { ok: false, path, reason: `在二层域内无法到达 ${lookup.nextHop || dstIp}` };
    }

    // Vlanif：在对应 VLAN 内寻找物理出端口
    const cands = device.ports.filter((p) => !p.shutdown && p.cableId && portPassesVlan(p, egress.vlanId));
    if (!cands.length) {
      return { ok: false, path, reason: `VLAN ${egress.vlanId} 内没有可用的物理端口（检查端口是否已连线和放行该 VLAN）` };
    }
    domain = { type: VLAN_DOMAIN, vlan: egress.vlanId };
    let last = null;
    for (const cp of cands) {
      const res = forwardViaPort(device, dstIp, lookup, cp, domain, ctx);
      if (res && res.ok) return res;
      if (res) last = res;
    }
    return last || { ok: false, path, reason: `在 VLAN ${egress.vlanId} 内无法到达 ${lookup.nextHop || dstIp}` };
  }

  function forwardViaPort(device, dstIp, lookup, port, domain, ctx) {
    // 目标 IP 在本二层域内？
    const target = lookup.type === 'direct' ? dstIp : lookup.nextHop;
    if (!target) return { ok: false, path: ctx.path, reason: '缺少下一跳' };

    const hit = deliverL2(device, port, domain, target, { srcIp: ctx.srcIp, dstIp });
    if (hit && hit.denied) {
      return { ok: false, path: hit.path || ctx.path, reason: hit.denied, blocked: true };
    }
    if (!hit) {
      return {
        ok: false,
        path: ctx.path,
        reason: `在二层域内无法到达 ${target}（检查 VLAN 划分、Trunk 放行、端口是否 shutdown）`
      };
    }

    const newPath = [...ctx.path, ...hit.path.slice(1)];
    const arrived = hit.device;

    if (lookup.type === 'direct' && target === dstIp) {
      return { ok: true, path: newPath, reason: 'direct' };
    }
    if (arrived.id === device.id) {
      return { ok: false, path: newPath, reason: '下一跳不可达' };
    }
    if (ctx.visitedDevices.has(arrived.id)) {
      return { ok: false, path: newPath, reason: '路由环路' };
    }

    const nextVisited = new Set(ctx.visitedDevices);
    nextVisited.add(arrived.id);
    return forward(arrived, dstIp, {
      srcIp: ctx.srcIp,
      path: newPath,
      visitedDevices: nextVisited,
      maxHops: ctx.maxHops - 1,
      ingressPortId: hit.ingressPortId
    });
  }

  /** ACL 入方向过滤检查：仅在报文入接口上检查已绑定的 ACL，返回拒绝原因或 null */
  function checkAcl(device, srcIp, dstIp, ingressPortId) {
    if (!srcIp || !ingressPortId) return null;
    for (const b of device.aclBindings) {
      if (b.direction !== 'inbound' || b.portId !== ingressPortId) continue;
      const acl = device.acl.find((a) => a.id === b.aclId);
      if (!acl) continue;
      for (const rule of acl.rules) {
        if (!matchAclRule(rule, srcIp, dstIp)) continue;
        if (rule.action === 'deny') {
          return `ACL ${acl.id} 拒绝了该流量 (${srcIp} -> ${dstIp})`;
        }
        break; // permit 命中后放行
      }
    }
    return null;
  }

  function matchAclRule(rule, srcIp, dstIp) {
    if (rule.src) {
      const pfx = rule.srcPrefix == null ? wildcardToPrefix(rule.srcWildcard || '0.0.0.0') : rule.srcPrefix;
      if (pfx == null) return false;
      if (!sameSubnet(rule.src, pfx, srcIp)) return false;
    }
    if (rule.dst) {
      const pfx = rule.dstPrefix == null ? wildcardToPrefix(rule.dstWildcard || '0.0.0.0') : rule.dstPrefix;
      if (pfx == null) return false;
      if (!sameSubnet(rule.dst, pfx, dstIp)) return false;
    }
    return true;
  }

  /* ------------------------------ 连通性测试 ------------------------------ */

  /** 设备自身的源 IP（用于 ping 源地址） */
  function primaryIp(device) {
    if (device.type === 'pc') {
      const p = device.ports.find((x) => x.ip);
      return p ? { ip: p.ip, mask: p.mask, port: p } : null;
    }
    for (const vi of device.vlanifs) if (vi.enabled && vi.ip) return { ip: vi.ip, mask: vi.mask };
    for (const p of device.ports) if (p.mode === 'routed' && p.ip) return { ip: p.ip, mask: p.mask, port: p };
    return null;
  }

  /** 执行 ping，返回 { ok, path, reason, srcIp, dstDevice } */
  function ping(srcDevice, dstIp, srcIpOverride) {
    const src = srcIpOverride ? { ip: srcIpOverride } : primaryIp(srcDevice);
    if (!src || !src.ip) {
      return { ok: false, reason: '源设备未配置 IP 地址', path: [srcDevice.id] };
    }
    if (!isValidIp(dstIp)) {
      return { ok: false, reason: '目的地址不合法', path: [srcDevice.id] };
    }
    if (src.ip === dstIp) {
      return { ok: true, reason: 'local', path: [srcDevice.id], srcIp: src.ip };
    }

    // 找到目的设备（便于回显与高亮）
    let dstDevice = null;
    for (const d of Net.devices) {
      const owned =
        d.ports.some((p) => p.ip === dstIp) || d.vlanifs.some((v) => v.enabled && v.ip === dstIp);
      if (owned) {
        dstDevice = d;
        break;
      }
    }

    const res = forward(srcDevice, dstIp, { srcIp: src.ip });
    return { ...res, srcIp: src.ip, dstDevice: dstDevice || null, dstIp };
  }

  /** traceroute：逐跳收集 */
  function traceroute(srcDevice, dstIp) {
    const hops = [];
    const src = primaryIp(srcDevice);
    if (!src || !src.ip) return { ok: false, hops, reason: '源设备未配置 IP 地址' };

    let cur = srcDevice;
    let guard = 0;
    const seen = new Set([srcDevice.id]);
    while (guard++ < 16) {
      const lookup = routeLookup(cur, dstIp);
      if (lookup.type === 'none') return { ok: false, hops, reason: `在 ${cur.hostname} 上没有到达 ${dstIp} 的路由` };
      const egress = findEgressIface(cur, dstIp, lookup);
      if (!egress) return { ok: false, hops, reason: `在 ${cur.hostname} 上找不到出接口` };

      // 本机即目的
      for (const i of l3Interfaces(cur)) {
        if (i.ip === dstIp) return { ok: true, hops, reason: 'local' };
      }

      let port = egress.kind === 'port' ? Net.getPort(cur, egress.portId) : null;
      let domain;
      if (port) domain = egressDomain(cur, port);
      else {
        domain = { type: VLAN_DOMAIN, vlan: egress.vlanId };
        port = cur.ports.find((p) => !p.shutdown && p.cableId && portPassesVlan(p, egress.vlanId));
      }
      if (!port) return { ok: false, hops, reason: `在 ${cur.hostname} 上找不到可用出端口` };

      const target = lookup.type === 'direct' ? dstIp : lookup.nextHop;
      const hit = deliverL2(cur, port, domain, target);
      if (!hit) return { ok: false, hops, reason: `无法到达下一跳 ${target}` };

      hops.push({ device: hit.device, ip: target });

      if (lookup.type === 'direct' && target === dstIp) return { ok: true, hops, reason: 'ok' };
      if (seen.has(hit.device.id)) return { ok: false, hops, reason: '路由环路' };
      seen.add(hit.device.id);
      cur = hit.device;
    }
    return { ok: false, hops, reason: 'TTL 超时' };
  }

  /* ------------------------------ OSPF 计算 ------------------------------ */

  /** 该接口是否被 area 的 network 语句覆盖 */
  function ospfCovers(device, ip, mask) {
    for (const area of device.ospf.areas) {
      for (const n of area.networks) {
        const pfx = n.prefix == null ? wildcardToPrefix(n.wildcard) : n.prefix;
        if (pfx == null) continue;
        // 接口网段需要落在 network 范围内
        if (sameSubnet(n.ip, pfx, ip) && pfx <= mask) return { area: area.areaId, network: n };
      }
    }
    return null;
  }

  /** 重新计算全网 OSPF 路由（邻居建立 + SPF 计算） */
  function recomputeOspf() {
    // 1) 清理旧 OSPF 路由
    for (const d of Net.devices) {
      d.routes = d.routes.filter((r) => r.proto !== 'OSPF');
      d.ospfNeighbors = [];
      d.ospfActiveIfaces = [];
    }

    // 2) 找出每台设备的 OSPF 活跃接口
    for (const d of Net.devices) {
      if (!d.ospf.enabled) continue;
      if (!d.ospf.routerId) {
        const p = primaryIp(d);
        if (p) d.ospf.routerId = p.ip;
      }
      for (const i of l3Interfaces(d)) {
        const cover = ospfCovers(d, i.ip, i.mask);
        if (cover) d.ospfActiveIfaces.push({ ...i, area: cover.area });
      }
    }

    // 3) 建立邻接关系（直连 + 同网段 + 同区域 + 双方 OSPF 启用且接口已通告）
    const adj = new Map(); // devId -> [{ peer, myIface, peerIface, area }]
    const addAdj = (a, b, aIf, bIf, area) => {
      if (!adj.has(a.id)) adj.set(a.id, []);
      if (!adj.has(b.id)) adj.set(b.id, []);
      adj.get(a.id).push({ peer: b, myIface: aIf, peerIface: bIf, area });
      adj.get(b.id).push({ peer: a, myIface: bIf, peerIface: aIf, area });
    };

    for (const cable of Net.cables) {
      const a = Net.getDevice(cable.aDeviceId);
      const b = Net.getDevice(cable.bDeviceId);
      if (!a || !b) continue;
      for (const aIf of a.ospfActiveIfaces || []) {
        for (const bIf of b.ospfActiveIfaces || []) {
          if (aIf.area !== bIf.area) continue;
          if (!sameSubnet(aIf.ip, aIf.mask, bIf.ip) || !sameSubnet(bIf.ip, bIf.mask, aIf.ip)) continue;
          // 确认两个接口确实通过这条线缆相连
          const okLink =
            (aIf.kind === 'port' && aIf.portId === cable.aPortId) ||
            (bIf.kind === 'port' && bIf.portId === cable.bPortId) ||
            (aIf.kind === 'vlanif' && aIf.vlanId != null && bIf.kind === 'vlanif' && aIf.vlanId != null);
          if (!okLink) continue;
          addAdj(a, b, aIf, bIf, aIf.area);
        }
      }
    }

    // 4) 收集每台设备的直连网段（LSA）
    const subnets = new Map(); // devId -> [{network, mask, area}]
    for (const d of Net.devices) {
      const list = [];
      for (const i of d.ospfActiveIfaces || []) {
        list.push({ network: networkOf(i.ip, i.mask), mask: i.mask, area: i.area });
      }
      subnets.set(d.id, list);
    }

    // 5) SPF：对每台 OSPF 设备做 BFS，学习远端网段
    for (const d of Net.devices) {
      if (!d.ospf.enabled) continue;
      const visited = new Set([d.id]);
      const queue = [{ dev: d, nextHop: null, cost: 0, firstIface: null }];
      const learned = new Map(); // network/mask -> route

      while (queue.length) {
        const cur = queue.shift();
        const nbrs = adj.get(cur.dev.id) || [];
        for (const n of nbrs) {
          if (visited.has(n.peer.id)) continue;
          visited.add(n.peer.id);
          const nextHop = cur.nextHop || n.peerIface.ip;
          const cost = cur.cost + 1;
          const firstIface = cur.firstIface || n.myIface;
          queue.push({ dev: n.peer, nextHop, cost, firstIface });

          for (const s of subnets.get(n.peer.id) || []) {
            const key = `${s.network}/${s.mask}`;
            // 跳过本机直连网段
            if ((subnets.get(d.id) || []).some((x) => x.network === s.network && x.mask === s.mask)) continue;
            if (learned.has(key) && learned.get(key).cost <= cost) continue;
            learned.set(key, {
              dest: s.network,
              mask: s.mask,
              nextHop,
              proto: 'OSPF',
              pre: 10,
              cost,
              ifaceName: firstIface ? firstIface.name : null,
              area: s.area
            });
          }
        }
      }

      // 6) 回写邻居表（用于 display ospf peer）
      d.ospfNeighbors = (adj.get(d.id) || []).map((n) => ({
        routerId: n.peer.ospf.routerId || '0.0.0.0',
        address: n.peerIface.ip,
        iface: n.myIface.name,
        state: 'Full',
        area: n.area,
        priority: 1
      }));

      for (const r of learned.values()) d.routes.push(r);
    }
  }

  /* ------------------------------ STP 计算 ------------------------------ */

  /** 简化 STP：按 (优先级, MAC) 选根，生成树上的端口 Forwarding，其余 Discarding */
  function recomputeStp() {
    for (const d of Net.devices) {
      d.stpState = { rootId: null, isRoot: false, portRole: {} };
    }
    const switches = Net.devices.filter((d) => d.type === 'switch');
    if (!switches.length) return;

    // 收集所有 VLAN 域
    const vlans = new Set();
    for (const sw of switches) for (const p of sw.ports) if (p.mode !== 'routed') vlans.add(portVlan(p));
    for (const sw of switches) for (const vi of sw.vlanifs) vlans.add(vi.vlanId);

    for (const vlan of vlans) {
      const members = switches.filter((sw) => sw.ports.some((p) => !p.shutdown && p.cableId && portPassesVlan(p, vlan)));
      if (members.length < 1) continue;

      // 每台交换机在该 VLAN 的角色
      const swOf = new Map(members.map((m) => [m.id, m]));
      const bridgeId = (sw) => `${String(sw.stp.priority).padStart(5, '0')}.${macOf(sw)}`;
      const root = members.slice().sort((a, b) => (bridgeId(a) < bridgeId(b) ? -1 : 1))[0];

      // 在 VLAN 内做连通图（仅交换机之间）
      const adjL = new Map();
      for (const m of members) adjL.set(m.id, []);
      for (const m of members) {
        for (const p of m.ports) {
          if (p.shutdown || !p.cableId || !portPassesVlan(p, vlan)) continue;
          const peer = Net.peerOf(m, p);
          if (!peer || !peer.device || peer.device.type !== 'switch') continue;
          if (!portPassesVlan(peer.port, vlan)) continue;
          adjL.get(m.id).push({ portId: p.id, peerId: peer.device.id, peerPortId: peer.port.id });
        }
      }

      // 从根做 BFS 生成树
      const inTree = new Set(); // "devId:portId"
      const visited = new Set([root.id]);
      const q = [root.id];
      while (q.length) {
        const cur = q.shift();
        for (const e of adjL.get(cur) || []) {
          if (visited.has(e.peerId)) continue;
          visited.add(e.peerId);
          inTree.add(`${cur}:${e.portId}`);
          inTree.add(`${e.peerId}:${e.peerPortId}`);
          q.push(e.peerId);
        }
      }

      for (const m of members) {
        m.stpState.rootId = bridgeId(root);
        m.stpState.isRoot = m.id === root.id;
        for (const p of m.ports) {
          if (p.mode === 'routed') continue;
          if (!p.cableId) {
            m.stpState.portRole[p.id] = portPassesVlan(p, vlan) ? 'root/designated' : 'disabled';
            continue;
          }
          if (!portPassesVlan(p, vlan)) {
            m.stpState.portRole[p.id] = 'disabled';
            continue;
          }
          m.stpState.portRole[p.id] = inTree.has(`${m.id}:${p.id}`) ? (m.stpState.isRoot ? 'designated' : 'root') : 'alternate';
        }
        // 根桥端口统一为 designated
        if (m.stpState.isRoot) {
          for (const p of m.ports) if (m.stpState.portRole[p.id] === 'root') m.stpState.portRole[p.id] = 'designated';
        }
      }
    }
  }

  function macOf(dev) {
    if (!dev._mac) dev._mac = randomMac();
    return dev._mac;
  }

  /* ------------------------------ DHCP ------------------------------ */

  /** 在 PC 所在二层域里寻找可用的 DHCP 服务器设备与地址池 */
  function findDhcpServer(pc) {
    const port = pc.ports.find((p) => p.cableId);
    if (!port) return null;
    const peer = Net.peerOf(pc, port);
    if (!peer || !peer.device) return null;
    const switchDev = peer.device;

    let domain;
    if (switchDev.type === 'switch' && peer.port.mode !== 'routed') {
      domain = { type: VLAN_DOMAIN, vlan: portVlan(peer.port) };
    } else {
      domain = { type: P2P_DOMAIN };
    }
    const vlan = domain.type === VLAN_DOMAIN ? domain.vlan : 1;

    const visited = new Set([pc.id]);
    const q = [switchDev];
    visited.add(switchDev.id);
    while (q.length) {
      const d = q.shift();
      if (d.dhcp.enabled) {
        // 服务接口：已开启 dhcp select global 的 Vlanif 或路由口
        const serving = [
          ...d.vlanifs.filter((v) => v.enabled && v.ip && v.dhcpSelect).map((v) => ({ ip: v.ip, mask: v.mask })),
          ...d.ports.filter((p) => p.mode === 'routed' && p.ip && p.dhcpSelect).map((p) => ({ ip: p.ip, mask: p.mask }))
        ];
        const pool = d.dhcp.pools.find(
          (pl) => pl.network && pl.mask != null && serving.some((s) => sameSubnet(s.ip, s.mask, pl.network))
        );
        if (pool) return { server: d, pool, vlan };
      }
      // 继续在同 VLAN 内扩散
      for (const p of d.ports) {
        if (p.shutdown || !p.cableId) continue;
        if (d.type === 'switch' && !portPassesVlan(p, vlan)) continue;
        const np = Net.peerOf(d, p);
        if (!np || !np.device || visited.has(np.device.id)) continue;
        if (np.device.type === 'pc') continue;
        visited.add(np.device.id);
        q.push(np.device);
      }
    }
    return null;
  }

  /** 地址池内分配一个可用 IP */
  function allocateFromPool(server, pool, excludeIps) {
    if (!pool.network || pool.mask == null) return null;
    const prefix = pool.mask;
    const size = prefix >= 31 ? 2 : Math.pow(2, 32 - prefix);
    const base = ipToInt(pool.network);
    const used = new Set();
    (excludeIps || []).forEach((i) => used.add(i));
    (pool.excluded || []).forEach((i) => used.add(i));
    if (pool.gateway) used.add(pool.gateway);
    for (let i = 1; i < Math.min(size - 1, 254); i++) {
      const ip = intToIp((base + i) >>> 0);
      if (used.has(ip)) continue;
      return ip;
    }
    return null;
  }

  /* ------------------------------ 配置回显 ------------------------------ */

  /**
   * 单个端口的非缺省配置行（不含 `interface xxx` 行本身）。
   * display current-configuration 与接口视图下的 display this 共用这一份，
   * 避免两处各写一遍导致回显不一致。
   */
  function portConfigLines(dev, p) {
    const lines = [];
    if (p.desc) lines.push(` description ${p.desc}`);
    if (p.mode === 'trunk') {
      lines.push(' port link-type trunk');
      if (p.allowedVlans === 'all') {
        lines.push(' port trunk allow-pass vlan all');
      } else if (Array.isArray(p.allowedVlans) && p.allowedVlans.length) {
        lines.push(` port trunk allow-pass vlan ${p.allowedVlans.join(' ')}`);
      }
    }
    if (p.mode === 'hybrid') {
      lines.push(' port link-type hybrid');
      lines.push(` port hybrid pvid vlan ${p.vlan}`);
    }
    if (p.mode === 'access' && p.vlan !== 1) lines.push(` port default vlan ${p.vlan}`);
    if (p.mode === 'routed') lines.push(' undo portswitch');
    if (p.ip) lines.push(` ip address ${p.ip} ${prefixToMask(p.mask)}`);
    if (p.dhcpSelect) lines.push(' dhcp select global');
    if (p.trunkId != null) lines.push(` eth-trunk ${p.trunkId}`);
    if (p.stpEdged) lines.push(' stp edged-port enable');
    if (p.bpduProtect) lines.push(' bpdu-protection');
    if (p.portSec && p.portSec.enabled) {
      lines.push(' port-security enable');
      lines.push(` port-security max-mac-num ${p.portSec.maxMac}`);
    }
    for (const b of dev.aclBindings.filter((b) => b.portId === p.id)) {
      lines.push(` traffic-filter ${b.direction} acl ${b.aclId}`);
    }
    if (p.shutdown && p.cableId) lines.push(' shutdown');
    return lines;
  }

  function runningConfig(dev) {
    const out = ['#', `sysname ${dev.hostname}`, '#'];
    if (dev.type === 'pc') {
      const p = dev.ports[0];
      if (p.ip) {
        out.push(`ip address ${p.ip} ${prefixToMask(p.mask)}`);
        if (p.gateway) out.push(`ip gateway ${p.gateway}`);
      }
      return out;
    }

    // 真实 VRP 里没有附加属性的 VLAN 会合并成 vlan batch，有描述/名称的单独成段
    const meta = dev.vlanMeta || {};
    const plainVlans = dev.vlans.filter((v) => {
      const m = meta[v];
      return !m || (!m.desc && !m.name);
    });
    const namedVlans = dev.vlans.filter((v) => plainVlans.indexOf(v) < 0).sort((a, b) => a - b);
    if (plainVlans.length > 1) {
      out.push(`vlan batch ${plainVlans.slice().sort((a, b) => a - b).join(' ')}`);
      out.push('#');
    }
    for (const v of namedVlans) {
      const m = meta[v] || {};
      out.push(`vlan ${v}`);
      if (m.desc) out.push(` description ${m.desc}`);
      if (m.name) out.push(` name ${m.name}`);
      out.push('#');
    }
    if (dev.dhcp.enabled) {
      out.push('dhcp enable');
      out.push('#');
    }
    for (const vi of dev.vlanifs) {
      out.push(`interface Vlanif${vi.vlanId}`);
      if (vi.desc) out.push(` description ${vi.desc}`);
      if (vi.ip) out.push(` ip address ${vi.ip} ${prefixToMask(vi.mask)}`);
      if (vi.dhcpSelect) out.push(' dhcp select global');
      if (!vi.enabled) out.push(' shutdown');
      out.push('#');
    }
    for (const p of dev.ports) {
      const lines = portConfigLines(dev, p);
      if (lines.length) {
        out.push(`interface ${p.name}`);
        out.push(...lines);
        out.push('#');
      }
    }
    for (const t of ethTrunks(dev)) {
      out.push(`interface Eth-Trunk${t.id}`);
      out.push(` mode ${t.mode === 'lacp' ? 'lacp-static' : 'manual load-balance'}`);
      out.push('#');
    }
    if (dev.acl.length) {
      for (const a of dev.acl) {
        out.push(`acl number ${a.id}`);
        for (const r of a.rules) out.push(` rule ${r.ruleId} ${r.action} source ${r.src || '0.0.0.0'} ${r.srcWildcard || '0.0.0.0'}`);
        out.push('#');
      }
    }
    if (dev.ospf.enabled) {
      out.push(`ospf ${dev.ospf.pid || 1} router-id ${dev.ospf.routerId || '0.0.0.0'}`);
      for (const a of dev.ospf.areas) {
        out.push(` area ${fmtArea(a.areaId)}`);
        for (const n of a.networks) out.push(`  network ${n.ip} ${n.wildcard}`);
      }
      out.push('#');
    }
    for (const r of dev.routes.filter((x) => x.proto === 'Static')) {
      out.push(`ip route-static ${r.dest} ${prefixToMask(r.mask)} ${r.nextHop}`);
    }
    for (const pl of dev.dhcp.pools) {
      out.push(`ip pool ${pl.name}`);
      out.push(` network ${pl.network} mask ${prefixToMask(pl.mask)}`);
      if (pl.gateway) out.push(` gateway-list ${pl.gateway}`);
      if (pl.dns) out.push(` dns-list ${pl.dns}`);
      for (const e of pl.excluded || []) out.push(` excluded-ip-address ${e}`);
      if (pl.leaseDays) out.push(` lease day ${pl.leaseDays}`);
      out.push('#');
    }
    if (!dev.savedConfig) out.push('return');
    return out;
  }

  function fmtArea(id) {
    if (typeof id === 'number') return String(id);
    return id;
  }

  function ethTrunks(dev) {
    const map = new Map();
    for (const p of dev.ports) {
      if (p.trunkId == null) continue;
      if (!map.has(p.trunkId)) map.set(p.trunkId, { id: p.trunkId, mode: p.trunkMode || 'lacp', members: [] });
      map.get(p.trunkId).members.push(p);
    }
    return [...map.values()];
  }

  /* ------------------------------ 导出 ------------------------------ */

  global.NE = global.NE || {};
  Object.assign(global.NE, {
    // 工具
    uid,
    clone,
    randomMac,
    macOf,
    isValidIp,
    ipToInt,
    intToIp,
    maskToPrefix,
    prefixToMask,
    sameSubnet,
    networkOf,
    wildcardToPrefix,
    // 数据
    TEMPLATES,
    Net,
    createDevice,
    normalizeDevice,
    // 转发
    l3Interfaces,
    routeLookup,
    portPassesVlan,
    portVlan,
    primaryIp,
    ping,
    traceroute,
    portConfigLines,
    // 协议
    recomputeOspf,
    recomputeStp,
    // DHCP
    findDhcpServer,
    allocateFromPool,
    // 回显
    runningConfig,
    ethTrunks
  });
})(window);

</script>
<script>
/* =========================================================================
 * NE_HWSIM —— 华为 VRP 网络实训模拟器
 * 模块：VRP 命令行引擎
 * 覆盖交换机 / 路由器常用配置与 display 命令，回显格式贴近真实 VRP。
 *
 * Copyright (c) 2026 新易科技工作室 NewE
 * 作者：Liuyi  <yimr@sohu.com>
 * 协议：MIT License
 *
 * 本项目为独立的非官方教学演示工具，与华为技术有限公司无任何关联。
 * 命令回显（如 display version）为自行编写的模拟内容，不含华为公司任何源代码或固件。
 * ========================================================================= */
(function (global) {
  'use strict';

  const E = global.NE;

  /* ------------------------------ 小工具 ------------------------------ */

  const padEnd = (s, n) => (String(s) + ' '.repeat(n)).slice(0, n);
  const padStart = (s, n) => (' '.repeat(n) + String(s)).slice(-n);

  /* ------------------------------ 错误回显 ------------------------------
   * 真实 VRP 报错是「在出错词正下方对齐一个 ^，再跟一行 Error」：
   *   [SW1] vlan b 10
   *               ^
   *   Error: Unrecognized command found at '^' position.
   * 各命令分支只声明"错在哪"（kind + 词），由 execute() 拿到完整命令行和当时的
   * 提示符后统一展开成这两行，省得每个分支自己算列号。
   * -------------------------------------------------------------------- */
  const ERR = '\u0001ERR\u0001';
  const ERR_SEP = '\u0002';

  function errAt(kind, word) {
    return [ERR + kind + ERR_SEP + (word == null ? '' : word)];
  }
  function errUnrecognized(word) {
    return errAt('Unrecognized', word);
  }
  function errIncomplete(word) {
    return errAt('Incomplete', word);
  }
  function errWrong(word) {
    return errAt('Wrong parameter', word);
  }

  /** 在原始命令行里找 word 首个词的出现列号（字符偏移），找不到返回 0 */
  function columnOf(rawLine, word) {
    if (!word) return 0;
    const first = String(word).split(/\s+/)[0].toLowerCase();
    if (!first) return 0;
    const toks = String(rawLine).split(/(\s+)/);
    let pos = 0;
    for (const t of toks) {
      if (!t) continue;
      if (/^\s+$/.test(t)) {
        pos += t.length;
        continue;
      }
      if (t.toLowerCase() === first) return pos;
      pos += t.length;
    }
    return 0;
  }

  /** 把错误标记展开成 ^ 定位行 + Error 行 */
  function expandErrors(prompt, rawLine, lines) {
    if (!lines.some((l) => typeof l === 'string' && l.indexOf(ERR) === 0)) return lines;
    const out = [];
    for (const l of lines) {
      if (typeof l === 'string' && l.indexOf(ERR) === 0) {
        const body = l.slice(ERR.length);
        const sep = body.indexOf(ERR_SEP);
        const kind = body.slice(0, sep);
        const word = body.slice(sep + 1);
        out.push(' '.repeat(prompt.length + 1 + columnOf(rawLine, word)) + '^');
        // 真实 VRP 措辞：Unrecognized/Incomplete/Ambiguous 后面带 "command"，
        // 而 Wrong parameter / Too many parameters 直接跟 "found at '^' position."
        const needsCommand = !/parameter/i.test(kind);
        out.push(
          `Error: ${kind}${needsCommand ? ' command' : ''} found at '^' position.`
        );
      } else {
        out.push(l);
      }
    }
    return out;
  }

  /** 把 IPv4 掩码字符串转成前缀长度；支持 "24" 与 "255.255.255.0" */
  function parseMask(v) {
    return E.maskToPrefix(v);
  }

  /* --------------------------- 视图栈（核心） ---------------------------
   * 真实 VRP 的视图是「一级一级进入、quit 一级一级退出」：
   *   <SW1> --system-view--> [SW1]
   *         --interface GE0/0/1--> [SW1-GigabitEthernet0/0/1]
   *         --vlan 10-->           [SW1-vlan10]
   *         --acl number 3000-->   [SW1-acl-adv-3000]
   *         --ospf 1-->            [SW1-ospf-1] --area 0--> [SW1-ospf-1-area-0.0.0.0]
   * quit 只回上一级，return 直接回用户视图。
   * -------------------------------------------------------------------- */

  /** 各子视图的上下文键，压栈 / 出栈时统一处理 */
  const VIEW_CTX_KEYS = ['ifaceId', 'vlanifId', 'vlanId', 'trunkId', 'poolName', 'aclId', 'ospfPid', 'areaId'];

  /** 当前视图上下文快照 */
  function snapView(dev) {
    const c = dev.cli;
    const snap = { view: c.view };
    for (const k of VIEW_CTX_KEYS) snap[k] = c[k];
    return snap;
  }

  /** 进入子视图：当前视图压栈，再切到新视图 */
  function enterView(dev, view, ctx) {
    const st = dev.cli.stack;
    if (st.length > 32) st.shift(); // 异常兜底，避免无限增长
    st.push(snapView(dev));
    for (const k of VIEW_CTX_KEYS) dev.cli[k] = null;
    if (ctx) Object.assign(dev.cli, ctx);
    dev.cli.view = view;
  }

  /** quit：退回上一级视图 */
  function quitView(dev) {
    const prev = dev.cli.stack.pop();
    if (!prev) {
      resetCliCtx(dev);
      dev.cli.view = 'user-view';
      return;
    }
    for (const k of VIEW_CTX_KEYS) dev.cli[k] = prev[k] === undefined ? null : prev[k];
    dev.cli.view = prev.view;
  }

  function resetCliCtx(dev) {
    for (const k of VIEW_CTX_KEYS) dev.cli[k] = null;
  }

  /** return：直接回用户视图，视图栈清空 */
  function returnUserView(dev) {
    dev.cli.stack = [];
    resetCliCtx(dev);
    dev.cli.view = 'user-view';
  }

  function viewOf(dev) {
    return dev.cli.view;
  }

  function promptOf(dev) {
    const name = dev.hostname;
    switch (dev.cli.view) {
      case 'user-view':
        return `<${name}>`;
      case 'system-view':
        return `[${name}]`;
      case 'vlan-view':
        return `[${name}-vlan${dev.cli.vlanId != null ? dev.cli.vlanId : ''}]`;
      case 'interface-view': {
        const p = E.Net.getPort(dev, dev.cli.ifaceId);
        return `[${name}-${p ? p.name : ''}]`;
      }
      case 'vlanif-view': {
        const vi = dev.vlanifs.find((v) => v.vlanId === dev.cli.vlanifId);
        return `[${name}-Vlanif${vi ? vi.vlanId : ''}]`;
      }
      case 'pool-view':
        return `[${name}-ip-pool-${dev.cli.poolName || ''}]`;
      case 'acl-view':
        return `[${name}-acl-adv-${dev.cli.aclId || ''}]`;
      case 'ospf-view':
        return `[${name}-ospf-${dev.cli.ospfPid || ''}]`;
      case 'ospf-area-view':
        return `[${name}-ospf-${dev.cli.ospfPid || ''}-area-${dev.cli.areaId || ''}]`;
      case 'trunk-view':
        return `[${name}-Eth-Trunk${dev.cli.trunkId || ''}]`;
      default:
        return `[${name}]`;
    }
  }

  /* --------------------------- 接口名解析 --------------------------- */

  /** 解析接口名，返回 { kind:'eth'|'vlanif'|'trunk', port?, label } 或 null */
  function resolveIface(dev, token) {
    if (!token) return null;
    const t = token.toLowerCase();

    let m = t.match(/^vlanif\s*(\d+)$/);
    if (m) return { kind: 'vlanif', vlanId: parseInt(m[1], 10), label: `Vlanif${m[1]}` };

    m = t.match(/^eth-?trunk\s*(\d+)$/);
    if (m) return { kind: 'trunk', trunkId: parseInt(m[1], 10), label: `Eth-Trunk${m[1]}` };

    m = t.match(/^(?:gigabitethernet|ge|g)\s*0\/0\/(\d+)$/);
    if (m) {
      const idx = parseInt(m[1], 10);
      const p = dev.ports.find((x) => x.name.toLowerCase().endsWith('0/0/' + idx));
      return p ? { kind: 'eth', port: p, label: p.name } : null;
    }
    return null;
  }

  function vlanList(token) {
    // "10 20 30" / "10 to 20" / "all"
    if (!token) return null;
    const t = token.toLowerCase().trim();
    if (t === 'all') return 'all';
    const out = [];
    const parts = t.split(/\s+/);
    for (let i = 0; i < parts.length; i++) {
      const p = parts[i];
      if (p === 'to') {
        const from = out[out.length - 1];
        const to = parseInt(parts[++i], 10);
        if (isNaN(to) || isNaN(from)) return null;
        for (let v = from + 1; v <= to && v <= 4094; v++) out.push(v);
        continue;
      }
      const n = parseInt(p, 10);
      if (isNaN(n) || n < 1 || n > 4094) return null;
      out.push(n);
    }
    return out.length ? [...new Set(out)].sort((a, b) => a - b) : null;
  }

  /* --------------------------- display 系列 --------------------------- */

  function cmdDisplayVersion(dev) {
    const isRouter = dev.type === 'router';
    return [
      `Huawei Versatile Routing Platform Software`,
      `VRP (R) software, Version 5.170 (${isRouter ? 'AR6121' : 'S5700 V200R019C10SPC500'})`,
      `Copyright (C) 2012-2024 Huawei Technologies Co., Ltd.`,
      `${dev.model} uptime is 0 day, 0 hour, 3 minutes`,
      `SDRAM Memory Size   : 1024 M bytes`,
      `Flash Memory Size   : 512 M bytes`,
      `MPU version information :`,
      `  1. PCB      Version  : ${isRouter ? 'AR01SRU' : 'S5700'} VER.A`,
      `  2. Board    Type     : ${dev.model}`,
      `  3. MPU Slot Quantity : 1`
    ];
  }

  function cmdDisplayCurrentConfig(dev) {
    const lines = E.runningConfig(dev);
    const out = ['#'];
    out.push(...lines);
    if (!out[out.length - 1].startsWith('return')) out.push('return');
    return out;
  }

  /** display this —— 按当前所在视图回显该视图下的配置 */
  function cmdDisplayThis(dev) {
    const view = dev.cli.view;
    const out = ['#'];

    if (view === 'interface-view') {
      const p = E.Net.getPort(dev, dev.cli.ifaceId);
      if (!p) return ['#', 'return'];
      out.push(`interface ${p.name}`);
      out.push(...E.portConfigLines(dev, p));
      out.push('#', 'return');
      return out;
    }

    if (view === 'vlan-view') {
      const n = dev.cli.vlanId;
      const m = (dev.vlanMeta || {})[n] || {};
      out.push(`vlan ${n}`);
      if (m.desc) out.push(` description ${m.desc}`);
      if (m.name) out.push(` name ${m.name}`);
      out.push('#', 'return');
      return out;
    }

    if (view === 'vlanif-view') {
      const vi = dev.vlanifs.find((v) => v.vlanId === dev.cli.vlanifId);
      if (!vi) return ['#', 'return'];
      out.push(`interface Vlanif${vi.vlanId}`);
      if (vi.desc) out.push(` description ${vi.desc}`);
      if (vi.ip) out.push(` ip address ${vi.ip} ${E.prefixToMask(vi.mask)}`);
      if (vi.dhcpSelect) out.push(' dhcp select global');
      if (!vi.enabled) out.push(' shutdown');
      out.push('#', 'return');
      return out;
    }

    if (view === 'trunk-view') {
      const t = E.ethTrunks(dev).find((x) => x.id === dev.cli.trunkId);
      out.push(`interface Eth-Trunk${dev.cli.trunkId}`);
      if (t) out.push(` mode ${t.mode === 'lacp' ? 'lacp-static' : 'manual load-balance'}`);
      out.push('#', 'return');
      return out;
    }

    if (view === 'pool-view') {
      const pl = dev.dhcp.pools.find((x) => x.name === dev.cli.poolName);
      if (!pl) return ['#', 'return'];
      out.push(`ip pool ${pl.name}`);
      if (pl.network) out.push(` network ${pl.network} mask ${E.prefixToMask(pl.mask)}`);
      if (pl.gateway) out.push(` gateway-list ${pl.gateway}`);
      if (pl.dns) out.push(` dns-list ${pl.dns}`);
      for (const e of pl.excluded || []) out.push(` excluded-ip-address ${e}`);
      if (pl.leaseDays) out.push(` lease day ${pl.leaseDays}`);
      out.push('#', 'return');
      return out;
    }

    if (view === 'acl-view') {
      const a = dev.acl.find((x) => x.id === dev.cli.aclId);
      if (!a) return ['#', 'return'];
      out.push(`acl number ${a.id}`);
      for (const r of a.rules) {
        out.push(` rule ${r.ruleId} ${r.action} source ${r.src || '0.0.0.0'} ${r.srcWildcard || '0.0.0.0'}`);
      }
      out.push('#', 'return');
      return out;
    }

    if (view === 'ospf-view') {
      out.push(`ospf ${dev.ospf.pid || 1} router-id ${dev.ospf.routerId || '0.0.0.0'}`);
      for (const a of dev.ospf.areas) {
        out.push(` area ${fmtArea(a.areaId)}`);
        for (const n of a.networks) out.push(`  network ${n.ip} ${n.wildcard}`);
      }
      out.push('#', 'return');
      return out;
    }

    if (view === 'ospf-area-view') {
      const a = dev.ospf.areas.find((x) => String(x.areaId) === String(dev.cli.areaId));
      out.push(`ospf ${dev.ospf.pid || 1} router-id ${dev.ospf.routerId || '0.0.0.0'}`);
      out.push(` area ${fmtArea(dev.cli.areaId)}`);
      for (const n of (a ? a.networks : [])) out.push(`  network ${n.ip} ${n.wildcard}`);
      out.push('#', 'return');
      return out;
    }

    // 系统视图（含用户视图兜底）：回显整机当前配置
    out.push(...E.runningConfig(dev));
    if (!out[out.length - 1].startsWith('return')) out.push('return');
    return out;
  }

  function cmdDisplayIpInterfaceBrief(dev) {
    const rows = [
      padEnd('Interface', 34) + padEnd('PHY', 6) + padEnd('Protocol', 10) + padEnd('IP Address', 17) + 'Mask'
    ];
    const ifaces = E.l3Interfaces(dev);
    const seen = new Set();

    for (const p of dev.ports) {
      if (dev.type === 'pc') break;
      const up = p.cableId && !p.shutdown;
      const ip = p.ip || 'unassigned';
      const mask = p.ip ? E.prefixToMask(p.mask) : '--';
      rows.push(padEnd(p.name, 34) + padEnd(up ? 'up' : 'down', 6) + padEnd(up ? 'up' : 'down', 10) + padEnd(ip, 17) + mask);
      seen.add(p.name);
    }
    for (const vi of dev.vlanifs) {
      const up = vi.enabled;
      rows.push(
        padEnd(`Vlanif${vi.vlanId}`, 34) +
          padEnd(up ? 'up' : 'down', 6) +
          padEnd(up ? 'up' : 'down', 10) +
          padEnd(vi.ip || 'unassigned', 17) +
          (vi.ip ? E.prefixToMask(vi.mask) : '--')
      );
    }
    if (ifaces.length === 0 && dev.type !== 'pc') {
      // 无三层接口时也保持表头可读
    }
    return rows;
  }

  function cmdDisplayVlan(dev, arg) {
    const vlans = dev.vlans.slice().sort((a, b) => a - b);
    const out = [`The total number of VLANs is : ${vlans.length}`, ''];
    out.push('VID  Status  Property      MAC-LRN STAT    BC  MC  UC  Description');
    out.push('-'.repeat(78));
    const meta = dev.vlanMeta || {};
    for (const v of vlans) {
      const m = meta[v] || {};
      // 真实 VRP 的 Description 列放 VLAN 名：缺省是 VLAN0010 这种格式化名，可被 name 覆盖
      const desc = v === 1 ? 'VLAN 1' : m.name || `VLAN ${String(v).padStart(4, '0')}`;
      out.push(
        padEnd(v, 5) +
          padEnd('enable', 8) +
          padEnd(v === 1 ? 'default' : 'static', 14) +
          padEnd('enable', 8) +
          padEnd('disable', 8) +
          'FWD FWD FWD ' +
          desc
      );
    }
    if (arg) {
      const n = parseInt(arg, 10);
      if (!vlans.includes(n)) return [`Error: The VLAN does not exist.`];
      out.push('');
      out.push(`U: Up  D: Down  TG: Tagged  UT: Untagged`);
      out.push(`                          Untagged    Tagged`);
      for (const p of dev.ports) {
        const tags = [];
        if (p.mode === 'access' && p.vlan === n) tags.push('UT');
        if (p.mode === 'trunk' && (p.allowedVlans === 'all' || (p.allowedVlans || []).includes(n))) tags.push('TG');
        if (p.mode === 'hybrid') tags.push('UT');
        if (!tags.length) continue;
        out.push(`${p.name}${' '.repeat(Math.max(1, 26 - p.name.length))}${tags.join(' ')}`);
      }
    }
    return out;
  }

  function cmdDisplayIpRoutingTable(dev) {
    const ifaces = E.l3Interfaces(dev);
    const entries = [];

    for (const i of ifaces) {
      const net = E.networkOf(i.ip, i.mask);
      entries.push({
        dest: net,
        mask: i.mask,
        proto: 'Direct',
        pre: 0,
        cost: 0,
        nextHop: i.ip,
        iface: i.name,
        flag: 'D'
      });
      entries.push({
        dest: i.ip,
        mask: 32,
        proto: 'Direct',
        pre: 0,
        cost: 0,
        nextHop: '127.0.0.1',
        iface: i.name,
        flag: 'D'
      });
    }
    for (const r of dev.routes) {
      entries.push({
        dest: r.dest,
        mask: r.mask,
        proto: r.proto,
        pre: r.pre != null ? r.pre : r.proto === 'OSPF' ? 10 : 60,
        cost: r.cost != null ? r.cost : 0,
        nextHop: r.nextHop,
        iface: r.ifaceName || (E.routeLookup(dev, r.nextHop).iface || {}).name || '-',
        flag: 'RD'
      });
    }
    // 去重 & 排序
    const map = new Map();
    for (const e of entries) map.set(`${e.dest}/${e.mask}|${e.proto}`, e);
    const list = [...map.values()].sort((a, b) => b.mask - a.mask || a.dest.localeCompare(b.dest));

    const out = [
      'Route Flags: R - relay, D - download to fib',
      '-'.repeat(78),
      'Routing Tables: Public',
      `         Destinations : ${list.length}        Routes : ${list.length}`,
      '',
      'Destination/Mask    Proto   Pre  Cost      Flags NextHop         Interface',
      ''
    ];
    for (const e of list) {
      out.push(
        padEnd(`${e.dest}/${e.mask}`, 20) +
          padEnd(e.proto, 8) +
          padEnd(e.pre, 5) +
          padEnd(e.cost, 10) +
          padEnd(e.flag, 6) +
          padEnd(e.nextHop, 16) +
          e.iface
      );
    }
    return out;
  }

  /** 生成交换机 MAC 地址表 */
  function computeMacTable(dev) {
    const rows = [];
    const devVlans = new Set(dev.vlans);
    for (const p of dev.ports) {
      if (!p.cableId || p.shutdown) continue;
      if (p.mode === 'routed') continue;
      const peer = E.Net.peerOf(dev, p);
      if (!peer || !peer.device) continue;
      const peerDev = peer.device;
      const vlan = E.portVlan(p);
      if (!devVlans.has(vlan)) continue;
      if (peerDev.type === 'pc') {
        rows.push({ mac: E.macOf(peerDev), vlan, port: p.name, type: 'dynamic' });
      } else if (peerDev.type === 'router' && peer.port && peer.port.ip) {
        rows.push({ mac: E.macOf(peerDev), vlan, port: p.name, type: 'dynamic' });
      }
    }
    for (const sm of dev.staticMac || []) {
      rows.push({ mac: sm.mac, vlan: sm.vlan, port: sm.port, type: 'static' });
    }
    return rows;
  }

  function cmdDisplayMacAddress(dev) {
    const rows = computeMacTable(dev);
    const out = [
      'MAC Address    VLAN/VSI                          Learned-From        Type',
      '-'.repeat(78)
    ];
    if (!rows.length) {
      out.push('(no MAC address entries)');
      return out;
    }
    for (const r of rows) {
      out.push(padEnd(r.mac.replace(/:/g, '-').toLowerCase(), 15) + padEnd(r.vlan, 34) + padEnd(r.port.replace('GigabitEthernet', 'GE'), 20) + r.type);
    }
    out.push('');
    out.push(`Total: ${rows.length}    Dynamic: ${rows.filter((r) => r.type === 'dynamic').length}    Static: ${rows.filter((r) => r.type === 'static').length}`);
    return out;
  }

  function cmdDisplayArp(dev) {
    const out = [
      'IP ADDRESS      MAC ADDRESS     EXPIRE(M) TYPE        INTERFACE   VPN-INSTANCE',
      '-'.repeat(78)
    ];
    let count = 0;
    for (const i of E.l3Interfaces(dev)) {
      for (const d of E.Net.devices) {
        if (d.id === dev.id) continue;
        for (const p of d.ports) {
          if (!p.ip || !E.sameSubnet(i.ip, i.mask, p.ip)) continue;
          const res = E.ping(dev, p.ip, i.ip);
          if (!res.ok) continue;
          out.push(
            padEnd(p.ip, 16) +
              padEnd(E.macOf(d).replace(/:/g, '-').toLowerCase(), 16) +
              padEnd('20', 12) +
              padEnd('dynamic', 12) +
              i.name
          );
          count++;
        }
      }
    }
    if (!count) out.push('(no ARP entries)');
    out.push('');
    out.push(`Total: ${count}    Dynamic: ${count}    Static: 0`);
    return out;
  }

  function cmdDisplayInterfaceBrief(dev) {
    const out = [
      'PHY: Physical',
      '*down: The physical layer is down',
      '',
      padEnd('Interface', 34) + padEnd('PHY', 8) + 'Protocol  InUti  OutUti  inErrors  outErrors'
    ];
    for (const p of dev.ports) {
      const up = !!p.cableId && !p.shutdown;
      out.push(
        padEnd(p.name, 34) +
          padEnd(up ? 'up' : '*down', 8) +
          padEnd(up ? 'up' : 'down', 10) +
          padEnd(up ? '0.01%' : '0%', 7) +
          padEnd(up ? '0.01%' : '0%', 8) +
          padEnd('0', 10) +
          '0'
      );
    }
    for (const vi of dev.vlanifs) {
      out.push(padEnd(`Vlanif${vi.vlanId}`, 34) + padEnd(vi.enabled ? 'up' : '*down', 8) + padEnd(vi.enabled ? 'up' : 'down', 10) + padEnd('0%', 7) + padEnd('0%', 8) + padEnd('0', 10) + '0');
    }
    return out;
  }

  function cmdDisplayStpBrief(dev) {
    if (dev.type !== 'switch') return errUnrecognized('display stp');
    E.recomputeStp();
    const st = dev.stpState || { portRole: {}, rootId: null };
    const rows = [];
    for (const p of dev.ports) {
      if (p.mode === 'routed' || !p.cableId) continue;
      const role = st.portRole[p.id];
      if (!role || role === 'disabled') continue;
      const roleStr = role === 'root' ? 'ROOT' : role === 'designated' ? 'DESI' : 'ALTE';
      const stateStr = role === 'alternate' ? 'DISCARDING' : 'FORWARDING';
      rows.push({ vlan: E.portVlan(p), port: p.name, role: roleStr, state: stateStr });
    }
    const out = [
      `CIST Bridge         :${String(dev.stp.priority)} .${E.macOf(dev).replace(/:/g, '-').toLowerCase()}`,
      `Bridge Times        : Hello 2s MaxAge 20s FwDly 15s MaxHop 20`,
      '',
      'MSTID  Port                        Role  STP State    Protection'
    ];
    if (!rows.length) {
      out.push('(no STP enabled ports)');
      return out;
    }
    for (const r of rows) {
      out.push(padStart(r.vlan, 5) + '  ' + padEnd(r.port.replace('GigabitEthernet', 'GE'), 28) + padEnd(r.role, 6) + padEnd(r.state, 13) + 'NONE');
    }
    return out;
  }

  function cmdDisplayStp(dev) {
    E.recomputeStp();
    const st = dev.stpState || {};
    return [
      `-------[CIST Global Info][Mode RSTP]-------`,
      `CIST Bridge         :${String(dev.stp.priority)} .${E.macOf(dev).replace(/:/g, '-').toLowerCase()}`,
      `Config Times        : Hello 2s MaxAge 20s FwDly 15s MaxHop 20`,
      `Active Times        : Hello 2s MaxAge 20s FwDly 15s MaxHop 20`,
      `CIST Root/ERPC      :${st.rootId || '--'} / ${st.isRoot ? 0 : 20000}`,
      `CIST RegRoot/IRPC   :${String(dev.stp.priority)} .${E.macOf(dev).replace(/:/g, '-').toLowerCase()} / 0`,
      `CIST RootPortId     :${st.isRoot ? '0.0' : '128.x'}`,
      `${st.isRoot ? 'This bridge is the root of the CIST.' : 'This bridge is not the root of the CIST.'}`,
      `Topology Changes    : 0`,
      `Last Topology Change: 0day:0h:0m:0s`
    ];
  }

  function cmdDisplayEthTrunk(dev) {
    const trunks = E.ethTrunks(dev);
    if (!trunks.length) return ['Eth-Trunk 信息为空。'];
    const out = [];
    for (const t of trunks) {
      out.push(`Eth-Trunk${t.id} 的成员端口：`);
      for (const m of t.members) out.push(`  ${m.name}    ${m.cableId && !m.shutdown ? 'Up' : 'Down'}    ${t.mode === 'lacp' ? 'Selected' : 'Unselected'}`);
      out.push('-' .repeat(60));
      out.push('Status: ' + (t.members.some((m) => m.cableId && !m.shutdown) ? 'Up' : 'Down'));
      out.push('');
    }
    return out;
  }

  function cmdDisplayOspfPeer(dev, brief) {
    if (!dev.ospf.enabled) return ['Error: OSPF is not enabled.'];
    E.recomputeOspf();
    const nbrs = dev.ospfNeighbors || [];
    const out = [`OSPF Process ${dev.ospf.pid || 1} with Router ID ${dev.ospf.routerId || '0.0.0.0'}`];
    if (brief) {
      out.push('                  Peer Statistic Information');
      out.push('-'.repeat(76));
      out.push(padEnd('Area Id', 17) + padEnd('Interface', 34) + padEnd('Neighbor id', 17) + 'State');
      for (const n of nbrs) {
        out.push(padEnd(fmtArea(n.area), 17) + padEnd(n.iface, 34) + padEnd(n.routerId, 17) + n.state);
      }
      if (!nbrs.length) out.push('(没有邻居)');
      return out;
    }
    if (!nbrs.length) {
      out.push(' OSPF Process has no peer.');
      return out;
    }
    for (const n of nbrs) {
      out.push('');
      out.push(` Area ${fmtArea(n.area)} interface ${n.iface}(${n.iface})`);
      out.push(` Neighbor ${n.routerId}, Neighbor state: ${n.state}`);
      out.push(` Address: ${n.address}    Priority: ${n.priority}`);
      out.push(` Dead timer due in 37 sec`);
      out.push(` Retrans timer interval: 5 sec`);
      out.push(` Up Time: 00:05:22`);
    }
    return out;
  }

  function cmdDisplayOspfRouting(dev) {
    if (!dev.ospf.enabled) return ['Error: OSPF is not enabled.'];
    E.recomputeOspf();
    const routes = dev.routes.filter((r) => r.proto === 'OSPF');
    const out = [
      'Route Flags: R - relay, D - download to fib',
      '-'.repeat(78),
      `         Destinations : ${routes.length + 1}        Routes : ${routes.length + 1}`,
      '',
      'Destination/Mask    Proto   Pre  Cost      Flags NextHop         Interface',
      ''
    ];
    for (const i of E.l3Interfaces(dev)) {
      out.push(padEnd(`${E.networkOf(i.ip, i.mask)}/${i.mask}`, 20) + padEnd('Direct', 8) + padEnd(0, 5) + padEnd(0, 10) + padEnd('D', 6) + padEnd(i.ip, 16) + i.name);
    }
    for (const r of routes) {
      out.push(padEnd(`${r.dest}/${r.mask}`, 20) + padEnd('OSPF', 8) + padEnd(r.pre != null ? r.pre : 10, 5) + padEnd(r.cost, 10) + padEnd('D', 6) + padEnd(r.nextHop, 16) + (r.ifaceName || '-'));
    }
    return out;
  }

  function cmdDisplayIpPool(dev, name) {
    if (!dev.dhcp.pools.length) return ['Error: The IP pool does not exist.'];
    const out = [];
    for (const pl of dev.dhcp.pools) {
      if (name && pl.name !== name) continue;
      const total = pl.mask >= 31 ? 2 : Math.pow(2, 32 - pl.mask) - 2;
      const used = (dev.dhcp.leases || []).filter((l) => l.poolName === pl.name).length;
      out.push(`  Pool-name        : ${pl.name}`);
      out.push(`  Network          : ${pl.network}  Mask: ${E.prefixToMask(pl.mask)}`);
      out.push(`  Gateway          : ${pl.gateway || '--'}`);
      out.push(`  DNS              : ${pl.dns || '--'}`);
      for (const e of pl.excluded || []) out.push(`  Excluded-IP      : ${e}`);
      out.push(`  Total-IP         : ${total}   Used: ${used}   Idle: ${Math.max(0, total - used)}`);
      out.push('');
    }
    return out;
  }

  function cmdDisplayPortSecurity(dev) {
    const out = ['Port Security: ' + (dev.ports.some((p) => p.portSec.enabled) ? 'Enabled' : 'Disabled')];
    for (const p of dev.ports) {
      if (!p.portSec || !p.portSec.enabled) continue;
      out.push(`  ${p.name}: max-mac-num=${p.portSec.maxMac}, status=${p.cableId && !p.shutdown ? 'up' : 'down'}`);
    }
    return out;
  }

  function fmtArea(id) {
    if (typeof id === 'number') return id + '.0.0.0';
    return id;
  }

  /* ------------------- display interface（详细回显） ------------------- */

  function hwAddr(dev) {
    return E.macOf(dev).replace(/:/g, '-').toUpperCase();
  }

  /** 物理口详细回显：接近真实 VRP 的 display interface 排版 */
  function ethInterfaceLines(dev, p) {
    const up = !!p.cableId && !p.shutdown;
    const routed = p.mode === 'routed';
    const out = [];
