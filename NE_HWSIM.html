  function cmdDisplayVlan(dev, arg) {
    const vlans = dev.vlans.slice().sort((a, b) => a - b);
    const out = [`The total number of VLANs is : ${vlans.length}`, ''];
    out.push('VID  Status  Property      MAC-LRN STAT    BC  MC  UC  Description');
    out.push('-'.repeat(78));
    const meta = dev.vlanMeta || {};
    for (const v of vlans) {
      const m = meta[v] || {};
      // 真实 VRP 的 Description 列放 VLAN 名：缺省是 VLAN0010 这种格式化名，可被 name 覆盖
      const desc = v === 1 ? 'VLAN 1' : m.name || `VLAN ${String(v).padStart(4, '0')}`;
      out.push(
        padEnd(v, 5) +
          padEnd('enable', 8) +
          padEnd(v === 1 ? 'default' : 'static', 14) +
          padEnd('enable', 8) +
          padEnd('disable', 8) +
          'FWD FWD FWD ' +
          desc
      );
    }
    if (arg) {
      const n = parseInt(arg, 10);
      if (!vlans.includes(n)) return [`Error: The VLAN does not exist.`];
      out.push('');
      out.push(`U: Up  D: Down  TG: Tagged  UT: Untagged`);
      out.push(`                          Untagged    Tagged`);
      for (const p of dev.ports) {
        const tags = [];
        if (p.mode === 'access' && p.vlan === n) tags.push('UT');
        if (p.mode === 'trunk' && (p.allowedVlans === 'all' || (p.allowedVlans || []).includes(n))) tags.push('TG');
        if (p.mode === 'hybrid') tags.push('UT');
        if (!tags.length) continue;
        out.push(`${p.name}${' '.repeat(Math.max(1, 26 - p.name.length))}${tags.join(' ')}`);
      }
    }
    return out;
  }

  function cmdDisplayIpRoutingTable(dev) {
    const ifaces = E.l3Interfaces(dev);
    const entries = [];

    for (const i of ifaces) {
      const net = E.networkOf(i.ip, i.mask);
      entries.push({
        dest: net,
        mask: i.mask,
        proto: 'Direct',
        pre: 0,
        cost: 0,
        nextHop: i.ip,
        iface: i.name,
        flag: 'D'
      });
      entries.push({
        dest: i.ip,
        mask: 32,
        proto: 'Direct',
        pre: 0,
        cost: 0,
        nextHop: '127.0.0.1',
        iface: i.name,
        flag: 'D'
      });
    }
    for (const r of dev.routes) {
      entries.push({
        dest: r.dest,
        mask: r.mask,
        proto: r.proto,
        pre: r.pre != null ? r.pre : r.proto === 'OSPF' ? 10 : 60,
        cost: r.cost != null ? r.cost : 0,
        nextHop: r.nextHop,
        iface: r.ifaceName || (E.routeLookup(dev, r.nextHop).iface || {}).name || '-',
        flag: 'RD'
      });
    }
    // 去重 & 排序
    const map = new Map();
    for (const e of entries) map.set(`${e.dest}/${e.mask}|${e.proto}`, e);
    const list = [...map.values()].sort((a, b) => b.mask - a.mask || a.dest.localeCompare(b.dest));

    const out = [
      'Route Flags: R - relay, D - download to fib',
      '-'.repeat(78),
      'Routing Tables: Public',
      `         Destinations : ${list.length}        Routes : ${list.length}`,
      '',
      'Destination/Mask    Proto   Pre  Cost      Flags NextHop         Interface',
      ''
    ];
    for (const e of list) {
      out.push(
        padEnd(`${e.dest}/${e.mask}`, 20) +
          padEnd(e.proto, 8) +
          padEnd(e.pre, 5) +
          padEnd(e.cost, 10) +
          padEnd(e.flag, 6) +
          padEnd(e.nextHop, 16) +
          e.iface
      );
    }
    return out;
  }

  /** 生成交换机 MAC 地址表 */
  function computeMacTable(dev) {
    const rows = [];
    const devVlans = new Set(dev.vlans);
    for (const p of dev.ports) {
      if (!p.cableId || p.shutdown) continue;
      if (p.mode === 'routed') continue;
      const peer = E.Net.peerOf(dev, p);
      if (!peer || !peer.device) continue;
      const peerDev = peer.device;
      const vlan = E.portVlan(p);
      if (!devVlans.has(vlan)) continue;
      if (peerDev.type === 'pc') {
        rows.push({ mac: E.macOf(peerDev), vlan, port: p.name, type: 'dynamic' });
      } else if (peerDev.type === 'router' && peer.port && peer.port.ip) {
        rows.push({ mac: E.macOf(peerDev), vlan, port: p.name, type: 'dynamic' });
      }
    }
    for (const sm of dev.staticMac || []) {
      rows.push({ mac: sm.mac, vlan: sm.vlan, port: sm.port, type: 'static' });
    }
    return rows;
  }

  function cmdDisplayMacAddress(dev) {
    const rows = computeMacTable(dev);
    const out = [
      'MAC Address    VLAN/VSI                          Learned-From        Type',
      '-'.repeat(78)
    ];
    if (!rows.length) {
      out.push('(no MAC address entries)');
      return out;
    }
    for (const r of rows) {
      out.push(padEnd(r.mac.replace(/:/g, '-').toLowerCase(), 15) + padEnd(r.vlan, 34) + padEnd(r.port.replace('GigabitEthernet', 'GE'), 20) + r.type);
    }
    out.push('');
    out.push(`Total: ${rows.length}    Dynamic: ${rows.filter((r) => r.type === 'dynamic').length}    Static: ${rows.filter((r) => r.type === 'static').length}`);
    return out;
  }

  function cmdDisplayArp(dev) {
    const out = [
      'IP ADDRESS      MAC ADDRESS     EXPIRE(M) TYPE        INTERFACE   VPN-INSTANCE',
      '-'.repeat(78)
    ];
    let count = 0;
    for (const i of E.l3Interfaces(dev)) {
      for (const d of E.Net.devices) {
        if (d.id === dev.id) continue;
        for (const p of d.ports) {
          if (!p.ip || !E.sameSubnet(i.ip, i.mask, p.ip)) continue;
          const res = E.ping(dev, p.ip, i.ip);
          if (!res.ok) continue;
          out.push(
            padEnd(p.ip, 16) +
              padEnd(E.macOf(d).replace(/:/g, '-').toLowerCase(), 16) +
              padEnd('20', 12) +
              padEnd('dynamic', 12) +
              i.name
          );
          count++;
        }
      }
    }
    if (!count) out.push('(no ARP entries)');
    out.push('');
    out.push(`Total: ${count}    Dynamic: ${count}    Static: 0`);
    return out;
  }

  function cmdDisplayStpBrief(dev) {
    if (dev.type !== 'switch') return errUnrecognized('display stp');
    E.recomputeStp();
    const st = dev.stpState || { portRole: {}, rootId: null };
    const rows = [];
    for (const p of dev.ports) {
      if (p.mode === 'routed' || !p.cableId) continue;
      const role = st.portRole[p.id];
      if (!role || role === 'disabled') continue;
      const roleStr = role === 'root' ? 'ROOT' : role === 'designated' ? 'DESI' : 'ALTE';
      const stateStr = role === 'alternate' ? 'DISCARDING' : 'FORWARDING';
      rows.push({ vlan: E.portVlan(p), port: p.name, role: roleStr, state: stateStr });
    }
    const out = [
      `CIST Bridge         :${String(dev.stp.priority)} .${E.macOf(dev).replace(/:/g, '-').toLowerCase()}`,
      `Bridge Times        : Hello 2s MaxAge 20s FwDly 15s MaxHop 20`,
      '',
      'MSTID  Port                        Role  STP State    Protection'
    ];
    if (!rows.length) {
      out.push('(no STP enabled ports)');
      return out;
    }
    for (const r of rows) {
      out.push(padStart(r.vlan, 5) + '  ' + padEnd(r.port.replace('GigabitEthernet', 'GE'), 28) + padEnd(r.role, 6) + padEnd(r.state, 13) + 'NONE');
    }
    return out;
  }

  function cmdDisplayOspfPeer(dev, brief) {
    if (!dev.ospf.enabled) return ['Error: OSPF is not enabled.'];

    const nbrs = dev.ospfNeighbors || [];
    const out = [`OSPF Process ${dev.ospf.pid || 1} with Router ID ${dev.ospf.routerId || '0.0.0.0'}`];
    if (brief) {
      out.push('                  Peer Statistic Information');

    if (!nbrs.length) {
      out.push(' OSPF Process has no peer.');

    for (const n of nbrs) {
      out.push('');
      out.push(` Area ${fmtArea(n.area)} interface ${n.iface}(${n.iface})`);
      out.push(` Neighbor ${n.routerId}, Neighbor state: ${n.state}`);
      out.push(` Address: ${n.address}    Priority: ${n.priority}`);
      out.push(` Dead timer due in 37 sec`);
      out.push(` Retrans timer interval: 5 sec`);
      out.push(` Up Time: 00:05:22`);
    }
    return out;
  }

  function cmdDisplayOspfRouting(dev) {
    if (!dev.ospf.enabled) return ['Error: OSPF is not enabled.'];
    E.recomputeOspf();
    const routes = dev.routes.filter((r) => r.proto === 'OSPF');
    const out = [
      'Route Flags: R - relay, D - download to fib',
      '-'.repeat(78),
      `         Destinations : ${routes.length + 1}        Routes : ${routes.length + 1}`,
      '',
      'Destination/Mask    Proto   Pre  Cost      Flags NextHop         Interface',
      ''
    ];
    for (const i of E.l3Interfaces(dev)) {
      out.push(padEnd(`${E.networkOf(i.ip, i.mask)}/${i.mask}`, 20) + padEnd('Direct', 8) + padEnd(0, 5) + padEnd(0, 10) + padEnd('D', 6) + padEnd(i.ip, 16) + i.name);
    }
    for (const r of routes) {
      out.push(padEnd(`${r.dest}/${r.mask}`, 20) + padEnd('OSPF', 8) + padEnd(r.pre != null ? r.pre : 10, 5) + padEnd(r.cost, 10) + padEnd('D', 6) + padEnd(r.nextHop, 16) + (r.ifaceName || '-'));
    }
    return out;
  }

  function cmdDisplayIpPool(dev, name) {
    if (!dev.dhcp.pools.length) return ['Error: The IP pool does not exist.'];
    const out = [];
    for (const pl of dev.dhcp.pools) {
      if (name && pl.name !== name) continue;
      const total = pl.mask >= 31 ? 2 : Math.pow(2, 32 - pl.mask) - 2;
      const used = (dev.dhcp.leases || []).filter((l) => l.poolName === pl.name).length;
      out.push(`  Pool-name        : ${pl.name}`);
      out.push(`  Network          : ${pl.network}  Mask: ${E.prefixToMask(pl.mask)}`);
      out.push(`  Gateway          : ${pl.gateway || '--'}`);
      out.push(`  DNS              : ${pl.dns || '--'}`);
      for (const e of pl.excluded || []) out.push(`  Excluded-IP      : ${e}`);
      out.push(`  Total-IP         : ${total}   Used: ${used}   Idle: ${Math.max(0, total - used)}`);
      out.push('');
    }
    return out;
  }

  function cmdDisplayPortSecurity(dev) {
    const out = ['Port Security: ' + (dev.ports.some((p) => p.portSec.enabled) ? 'Enabled' : 'Disabled')];
    for (const p of dev.ports) {
      if (!p.portSec || !p.portSec.enabled) continue;
      out.push(`  ${p.name}: max-mac-num=${p.portSec.maxMac}, status=${p.cableId && !p.shutdown ? 'up' : 'down'}`);
    }
    return out;
  }

  /* --------------------------- display acl / nat / port-group --------------------------- */

  function cmdDisplayAcl(dev, arg) {
    if (!dev.acl.length) return ['Error: The ACL does not exist.'];
    const list = dev.acl.filter(
      (a) => !arg || String(arg).toLowerCase() === 'all' || String(a.id) === String(arg)
    );
    if (!list.length) return ['Error: The ACL does not exist.'];
    const out = [];
    for (const a of list) {
      const kind = a.id >= 2000 && a.id <= 2999 ? 'Basic' : 'Advanced';
      out.push(`${kind} ACL ${a.id}, ${a.rules.length} rule${a.rules.length === 1 ? '' : 's'}`);
      out.push("Acl's step is 5");
      for (const r of a.rules) out.push(' ' + E.aclRuleText(r));
      // 列出被哪些接口引用，帮学生定位「规则配了但没生效」
      const refs = (dev.aclBindings || []).filter((b) => b.aclId === a.id);
      for (const b of refs) {
        const p = b.portId ? E.Net.getPort(dev, b.portId) : null;
        const name = p ? p.name : b.vlanifId != null ? `Vlanif${b.vlanifId}` : '?';
        out.push(`  已应用：interface ${name} (${b.direction})`);
      }
      const nats = dev.ports.filter((p) => p.nat && p.nat.aclId === a.id);
      for (const p of nats) out.push(`  已应用：interface ${p.name} (nat outbound)`);
    }
    return out;
  }

  function cmdDisplayNatSession(dev) {
    const list = dev.natSessions || [];
    if (!list.length) return ['  The number of NAT sessions is 0.'];
    const out = [`  The number of NAT sessions is ${list.length}.`, ''];
    out.push(padEnd('Protocol', 10) + padEnd('InsideAddr:Port', 23) + padEnd('OutsideAddr:Port', 24) + 'DestAddr:Port');
    out.push('-'.repeat(79));
    for (const s of list) {
      out.push(
        padEnd(s.proto, 10) +
          padEnd(`${s.inside}:${s.insidePort}`, 23) +
          padEnd(`${s.outside}:${s.outsidePort}`, 24) +
          `${s.dest}:${s.destPort}`
      );
    }
    out.push('');
    out.push(`  转换出口：${[...new Set(list.map((s) => s.iface))].join(', ')}`);
    return out;
  }

  function cmdDisplayNatOutbound(dev) {
    const rows = dev.ports.filter((p) => p.nat && p.nat.aclId != null);
    if (!rows.length) return ['  (no nat outbound configured)'];
    const out = [padEnd('Interface', 26) + padEnd('ACL', 8) + 'Address-group'];
    out.push('-'.repeat(52));
    for (const p of rows) {
      out.push(
        padEnd(p.name, 26) +
          padEnd(p.nat.aclId, 8) +
          (p.nat.addrGroup != null ? String(p.nat.addrGroup) : 'Easy IP (接口地址)')
      );
    }
    return out;
  }

  function cmdDisplayPortGroup(dev, name) {
    const all = !name || String(name).toLowerCase() === 'all';
    const list = (dev.portGroups || []).filter((g) => all || g.name === name);
    if (!list.length) return ['(no port-group configured)'];
    const out = [];
    for (const g of list) {
      out.push(`Port-group ${g.name}`);
      for (const id of g.memberIds) {
        const p = E.Net.getPort(dev, id);
        if (p) out.push(`  ${p.name}`);
      }
      out.push(`  成员数：${g.memberIds.length}`);
      out.push('');
    }
    return out;
  }

  function fmtArea(id) {
    if (typeof id === 'number') return id + '.0.0.0';
    return id;
  }

  /* ------------------- display interface（详细回显） ------------------- */

  function hwAddr(dev) {
    return E.macOf(dev).replace(/:/g, '-').toUpperCase();
  }

  /** 物理口详细回显：接近真实 VRP 的 display interface 排版 */
  function ethInterfaceLines(dev, p) {
    const up = !!p.cableId && !p.shutdown;
    const routed = p.mode === 'routed';
    const out = [];
    out.push(`${p.name} current state : ${up ? 'UP' : 'DOWN'}`);
    out.push(`Line protocol current state : ${up ? 'UP' : 'DOWN'}`);
    out.push(`Description:${p.desc || ''}`);

    if (routed) {
      out.push('Route Port,The Maximum Transmit Unit is 1500');
      out.push(`Internet Address is ${p.ip ? `${p.ip}/${p.mask}` : 'unassigned'}`);
    } else {
      out.push(`Switch Port, PVID : ${E.portVlan(p)}, TPID : 8100(Hex), The Maximum Frame Length is 9216`);
      out.push(`Port link-type : ${p.mode === 'trunk' ? 'Trunk' : p.mode === 'hybrid' ? 'Hybrid' : 'Access'}`);
      if (p.mode === 'trunk') {
        const list = p.allowedVlans === 'all' ? 'all' : (p.allowedVlans || []).join(', ');
        out.push(`Trunk VLAN List : ${list || 'none'}`);
      }
      const st = dev.stpState && dev.stpState.portRole ? dev.stpState.portRole[p.id] : null;
      if (st && st === 'alternate') out.push(`Stp Port State : DISCARDING   (端口被生成树阻塞)`);
    }

    out.push(`IP Sending Frames' Format is PKTFMT_ETHNT_2, Hardware address is ${hwAddr(dev)}`);
    out.push('Port Mode: COMMON COPPER');
    out.push('Speed : 1000,   Loopback: NONE');
    out.push('Duplex: FULL,   Negotiation: ENABLE');
    out.push('Mdi: AUTO');
    out.push('Last 300 seconds input rate 0 bits/sec, 0 packets/sec');
    out.push('Last 300 seconds output rate 0 bits/sec, 0 packets/sec');
    out.push('Input:  0 packets, 0 bytes');
    out.push('  Unicast: 0, Multicast: 0');
    out.push('  Broadcast: 0, Jumbo: 0');
    out.push('  Discard: 0, Total Error: 0');
    out.push('Output: 0 packets, 0 bytes');
    out.push('  Unicast: 0, Multicast: 0');
    out.push('  Broadcast: 0, Jumbo: 0');
    out.push('  Discard: 0, Total Error: 0');
    return out;
  }

  function vlanifInterfaceLines(dev, vi) {
    const up = vi.enabled;
    return [
      `Vlanif${vi.vlanId} current state : ${up ? 'UP' : 'DOWN'}`,
      `Line protocol current state : ${up ? 'UP' : 'DOWN'}`,
      `Description:${vi.desc || ''}`,
      'The Maximum Transmit Unit is 1500',
      `Internet Address is ${vi.ip ? `${vi.ip}/${vi.mask}` : 'unassigned'}`,
      `IP Sending Frames' Format is PKTFMT_ETHNT_2, Hardware address is ${hwAddr(dev)}`,
      '    Last 300 seconds input rate 0 bits/sec, 0 packets/sec',
      '    Last 300 seconds output rate 0 bits/sec, 0 packets/sec',
      '    Input:  0 packets, 0 bytes',
      '    Output: 0 packets, 0 bytes'
    ];
  }

  function ethTrunkInterfaceLines(dev, t) {
    const up = t.members.some((m) => m.cableId && !m.shutdown);
    const withIp = t.members.find((m) => m.ip);
    const out = [
      `Eth-Trunk${t.id} current state : ${up ? 'UP' : 'DOWN'}`,
      `Line protocol current state : ${up ? 'UP' : 'DOWN'}`,
      'Description:',
      'Switch Port, PVID : 1, TPID : 8100(Hex), The Maximum Frame Length is 9216',
      `Internet Address is ${withIp ? `${withIp.ip}/${withIp.mask}` : 'unassigned'}`,
      `IP Sending Frames' Format is PKTFMT_ETHNT_2, Hardware address is ${hwAddr(dev)}`,
      `WorkingMode: ${t.mode === 'lacp' ? 'LACP' : 'NORMAL'}`,
      `Number of members: ${t.members.length}`,
      '    Input:  0 packets, 0 bytes',
      '    Output: 0 packets, 0 bytes'
    ];
    for (const m of t.members) {
      out.push(`  ${padEnd(m.name, 24)}${padEnd(m.cableId && !m.shutdown ? 'Up' : 'Down', 8)}${t.mode === 'lacp' ? 'Selected' : 'Unselected'}`);
    }
    return out;
  }

  function cmdDisplayInterface(dev, token) {
    if (!token) return errIncomplete('display interface');
    const iface = resolveIface(dev, token);
    if (!iface) return errWrong(token);
    if (iface.kind === 'vlanif') {
      const vi = dev.vlanifs.find((v) => v.vlanId === iface.vlanId);
      if (!vi) return [`Error: The interface Vlanif${iface.vlanId} does not exist.`];
      return vlanifInterfaceLines(dev, vi);
    }
    if (iface.kind === 'trunk') {
      const t = E.ethTrunks(dev).find((x) => x.id === iface.trunkId);
      if (!t) return [`Error: The interface Eth-Trunk${iface.trunkId} does not exist.`];
      return ethTrunkInterfaceLines(dev, t);
    }
    return ethInterfaceLines(dev, iface.port);
  }

  /* ------------------------- display port vlan ------------------------- */

  function cmdDisplayPortVlan(dev) {
    const out = [
      padEnd('Port', 24) + padEnd('Link Type', 13) + padEnd('PVID', 6) + 'Trunk VLAN List',
      '-'.repeat(79)
    ];
    for (const p of dev.ports) {
      if (p.mode === 'routed') continue;
      const type = p.mode === 'trunk' ? 'trunk' : p.mode === 'hybrid' ? 'hybrid' : 'access';
      let list = '-';
      if (p.mode === 'trunk') {
        list = p.allowedVlans === 'all' ? 'all' : (p.allowedVlans || []).join(', ') || '-';
      } else if (p.mode === 'hybrid') {
        list = String(p.vlan);
      }
      out.push(padEnd(p.name, 24) + padEnd(type, 13) + padEnd(E.portVlan(p), 6) + list);
    }
    return out;
  }

  /* ------------------------ display ospf interface ------------------------ */

  /** 按 OSPF 的 DR 选举规则（网段内最高接口 IP 当选）判断接口状态 */
  function ospfIfaceState(dev, iface) {
    let best = iface.ip;
    for (const cable of E.Net.cables) {
      if (cable.aDeviceId !== dev.id && cable.bDeviceId !== dev.id) continue;
      const otherId = cable.aDeviceId === dev.id ? cable.bDeviceId : cable.aDeviceId;
      const other = E.Net.getDevice(otherId);
      if (!other || !other.ospf || !other.ospf.enabled) continue;
      for (const oi of other.ospfActiveIfaces || []) {
        if (!E.sameSubnet(iface.ip, iface.mask, oi.ip)) continue;
        if (E.ipToInt(oi.ip) > E.ipToInt(best)) best = oi.ip;
      }
    }
    return best === iface.ip ? 'DR' : 'DROther';
  }

  function cmdDisplayOspfInterface(dev) {
    if (!dev.ospf.enabled) return ['Error: OSPF is not enabled.'];
    E.recomputeOspf();
    const list = dev.ospfActiveIfaces || [];
    const out = [`OSPF Process ${dev.ospf.pid || 1} with Router ID ${dev.ospf.routerId || '0.0.0.0'}`];
    if (!list.length) {
      out.push(' No OSPF interface is up.');
      return out;
    }
    const byArea = new Map();
    for (const i of list) {
      const k = String(i.area);
      if (!byArea.has(k)) byArea.set(k, []);
      byArea.get(k).push(i);
    }
    for (const [area, ifs] of byArea) {
      out.push(' Interfaces');
      out.push(` Area: ${area}          (MPLS TE not enabled)`);
      out.push(' IP Address       State    Cost  Type       MTU   Interface');
      for (const i of ifs) {
        out.push(
          ' ' + padEnd(i.ip, 17) + padEnd(ospfIfaceState(dev, i), 9) + padEnd(1, 6) + padEnd('Broadcast', 11) + padEnd(1500, 6) + i.name
        );
      }
    }
    if (dev.ospfNeighbors && dev.ospfNeighbors.length) {
      out.push('');
      out.push(` Neighbor Count is ${dev.ospfNeighbors.length}`);
    }
    return out;
  }

  function dispatchDisplay(dev, args) {
    const a = args.map((x) => x.toLowerCase());
    const rest = args.slice(1);

    if (!a[1]) return cmdDisplayVersion(dev);
    switch (a[1]) {
      case 'version':
        return cmdDisplayVersion(dev);
      case 'current-configuration':
        return cmdDisplayCurrentConfig(dev);
      case 'this':
        return cmdDisplayThis(dev);
      case 'ip':
        if (a[2] === 'interface' && a[3] === 'brief') return cmdDisplayIpInterfaceBrief(dev);
        if (a[2] === 'routing-table') return cmdDisplayIpRoutingTable(dev);
        if (a[2] === 'pool') return cmdDisplayIpPool(dev, rest[2]);
        return errUnrecognized('display ip');
      case 'interface':
        if (a[2] === 'brief') return cmdDisplayInterfaceBrief(dev);
        return cmdDisplayInterface(dev, rest.slice(1).join(''));
      case 'port':
        if (a[2] === 'vlan') return cmdDisplayPortVlan(dev);
        return errUnrecognized('display port');
      case 'vlan':
        return cmdDisplayVlan(dev, rest[1]);
      case 'mac-address':
        return cmdDisplayMacAddress(dev);
      case 'arp':
        return cmdDisplayArp(dev);
      case 'stp':
        if (a[2] === 'brief') return cmdDisplayStpBrief(dev);
        return cmdDisplayStp(dev);
      case 'eth-trunk':
        return cmdDisplayEthTrunk(dev);
      case 'ospf':
        if (a[2] === 'peer') return cmdDisplayOspfPeer(dev, a[3] === 'brief');
        if (a[2] === 'routing') return cmdDisplayOspfRouting(dev);
        if (a[2] === 'interface') return cmdDisplayOspfInterface(dev);
        if (a[2] === 'brief') return cmdDisplayOspfPeer(dev, true);
        return errUnrecognized('display ospf');
      case 'port-security':
        return cmdDisplayPortSecurity(dev);
      case 'acl':
        return cmdDisplayAcl(dev, rest[1]);
      case 'nat':
        if (a[2] === 'session') return cmdDisplayNatSession(dev);
        if (a[2] === 'outbound') return cmdDisplayNatOutbound(dev);
        return errUnrecognized('display nat');
      case 'port-group':
        return cmdDisplayPortGroup(dev, rest[1]);
      case 'saved-configuration':
        return dev.savedConfig ? ['#', ...dev.savedConfig, 'return'] : ['Error: The saved configuration file does not exist.'];
      default:
        return errUnrecognized('display');
    }
  }

  /* --------------------------- ping / tracert --------------------------- */

  function cmdPing(dev, args) {
    // ping [-c count] <ip>
    let count = 5;
    let ip = null;
    for (let i = 0; i < args.length; i++) {
      if (args[i] === '-c') {
        count = parseInt(args[++i], 10) || 5;
      } else if (E.isValidIp(args[i])) {
        ip = args[i];
      }
    }
    if (!ip) return errIncomplete('ping');

    if (dev.type === 'pc') {
      const res = E.ping(dev, ip);
      const out = [`Pinging ${ip} with 32 bytes of data:`];
      if (res.ok) {
        for (let i = 0; i < 4; i++) out.push(`Reply from ${ip}: bytes=32 time=${2 + i}ms TTL=${20 + res.path.length * 3}`);
        out.push('');
        out.push(`Ping statistics for ${ip}:`);
        out.push('    Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),');
        return { lines: out, traffic: res };
      }
      for (let i = 0; i < 4; i++) out.push('Request timed out.');
      out.push('');
      out.push(`Ping statistics for ${ip}:`);
      out.push('    Packets: Sent = 4, Received = 0, Lost = 4 (100% loss),');
      out.push(`失败原因：${res.reason}`);
      return { lines: out, traffic: res };
    }

    const res = E.ping(dev, ip);
    const out = [`  PING ${ip}: ${count === 5 ? 5 : count} data bytes, press CTRL_C to break`];
    if (res.ok) {
      for (let i = 0; i < count; i++) {
        out.push(`    Reply from ${ip}: bytes=56 Sequence=${i + 1} ttl=${64 - res.path.length} time=${2 + i * 2} ms`);
      }
      out.push('');
      out.push(`  --- ${ip} ping statistics ---`);
      out.push(`    ${count} packet(s) transmitted`);
      out.push(`    ${count} packet(s) received`);
      out.push(`    0.00% packet loss`);
      out.push(`    round-trip min/avg/max = 2/3/6 ms`);
      return { lines: out, traffic: res };
    }
    out.push(`    Request time out`);
    out.push('');
    out.push(`  --- ${ip} ping statistics ---`);
    out.push(`    5 packet(s) transmitted`);
    out.push(`    0 packet(s) received`);
    out.push(`    100.00% packet loss`);
    out.push(`失败原因：${res.reason}`);
    return { lines: out, traffic: res };
  }

  function cmdTracert(dev, args) {
    const ip = args.find((a) => E.isValidIp(a));
    if (!ip) return errIncomplete('tracert');
    const res = E.traceroute(dev, ip);
    const isPc = dev.type === 'pc';
    const out = [];
    if (isPc) out.push(`Tracing route to ${ip} over a maximum of 30 hops:`);
    else out.push(`traceroute to ${ip}, 8 hops max, press CTRL_C to break`);

    let i = 0;
    for (const h of res.hops) {
      i++;
      if (isPc) {
        out.push(`  ${padStart(i, 2)}    ${padEnd(4 + i, 6)} ms    ${padEnd(2 + i, 6)} ms    ${padEnd(3 + i, 6)} ms  ${h.ip}`);
      } else {
        out.push(`${padStart(i, 2)}  ${padEnd(h.ip, 20)} ${padEnd(4 + i, 8)} ms  ${padEnd(2 + i, 8)} ms  ${3 + i} ms`);
      }
    }
    if (res.ok) {
      out.push('');
      if (isPc) out.push('Trace complete.');
      else out.push(`  Trace complete.`);
    } else {
      out.push(` ${isPc ? 'Trace incomplete:' : 'trace incomplete:'} ${res.reason}`);
    }
    return { lines: out, traffic: { ...res, ok: res.ok, path: res.hops.map((h) => h.device.id) } };
  }

  /* --------------------------- PC 专用命令 --------------------------- */

  function cmdIpconfig(dev, args) {
    const p = dev.ports[0];
    if (args[1] === '/renew' || args[1] === '/refresh') {
      return { lines: doDhcp(dev), device: dev };
    }
    if (args[1] === '/release') {
      p.ip = null;
      p.mask = null;
      p.gateway = null;
      return { lines: ['IP 地址已释放。'], device: dev };
    }
    const out = ['', 'Windows IP Configuration', ''];
    out.push('Ethernet adapter Ethernet0/0/0:');
    out.push('');
    out.push('   Connection-specific DNS Suffix  . :');
    out.push('   Link-local IPv6 Address . . . . . : fe80::1%4');
    out.push(`   IPv4 Address. . . . . . . . . . . : ${p.ip || '（未配置）'}`);
    out.push(`   Subnet Mask . . . . . . . . . . . : ${p.ip ? E.prefixToMask(p.mask) : '（未配置）'}`);
    out.push(`   Default Gateway . . . . . . . . . : ${p.gateway || '（未配置）'}`);
    if (p.dhcp) out.push('   DHCP Enabled. . . . . . . . . . . : Yes');
    else out.push('   DHCP Enabled. . . . . . . . . . . : No');
    return { lines: out, device: dev };
  }

  function doDhcp(pc) {
    const found = E.findDhcpServer(pc);
    if (!found) {
      return [
        'DHCP 请求失败：没有找到可用的 DHCP 服务器。',
        '请检查：① 服务器是否执行 dhcp enable ② 是否创建 ip pool ③ 三层接口是否配置 dhcp select global ④ 链路与 VLAN 是否正确。'
      ];
    }
    const { server, pool } = found;
    server.dhcp.leases = server.dhcp.leases || [];
    const usedIps = server.dhcp.leases.map((l) => l.ip);
    const ip = E.allocateFromPool(server, pool, usedIps);
    if (!ip) return ['DHCP 请求失败：地址池中没有空闲地址。'];
    const p = pc.ports[0];
    p.ip = ip;
    p.mask = pool.mask;
    p.gateway = pool.gateway;
    p.dhcp = true;
    server.dhcp.leases.push({ ip, mac: E.macOf(pc), poolName: pool.name, t: Date.now() });
    return [
      `已通过 DHCP 获取地址：${ip}/${pool.mask}`,
      `  网关：${pool.gateway || '--'}    DNS：${pool.dns || '--'}`,
      `  （来自 ${server.hostname} 的地址池 ${pool.name}）`
    ];
  }

  /* --------------------------- 主执行入口 --------------------------- */

  /**
   * 执行一条命令（对外入口，统一返回 { lines, traffic? }）
   * 错误标记在这里统一展开成 ^ 定位行 + Error 行。
   */
  function execute(dev, rawLine) {
    // 出错时的 ^ 要对齐"敲命令那一刻"显示的提示符，所以先进场先记下来
    const prompt = promptOf(dev);
    const r = executeInner(dev, rawLine);
    let out;
    if (Array.isArray(r)) out = { lines: r };
    else if (!r || typeof r !== 'object') out = { lines: [] };
    else out = r;
    if (!out.lines) out.lines = [];
    out.lines = expandErrors(prompt, rawLine, out.lines);
    return out;
  }

  /* --------------------------- 交互式确认 ---------------------------
   * save 这类命令真实设备会停下来等用户输入，这里用 dev.cli.pending 记录等待状态。
   * 下一步输入（y/n、文件名）由 handlePending 消化，不再走正常命令解析。
   * ------------------------------------------------------------------ */

  function handlePending(dev, line) {
    const p = dev.cli.pending;
    dev.cli.pending = null;
    const ans = line.trim();
    const low = ans.toLowerCase();

    if (p.kind === 'save-confirm') {
      if (low === 'y' || low === 'yes') {
        dev.cli.pending = { kind: 'save-name' };
        return { lines: ['Info: Please input the file name(*.cfg, *.zip)[vrpcfg.zip]:'] };
      }
      // 选 n 或直接回车：真实 VRP 静默返回提示符
      return { lines: [] };
    }

    if (p.kind === 'save-name') {
      dev.savedConfig = E.runningConfig(dev);
      dev.lastSaved = Date.now();
      dev.savedFile = ans || 'vrpcfg.zip';
      return {
        lines: [
          'Now saving the current configuration to the slot 0.',
          'Save the configuration successfully.'
        ]
      };
    }

    if (p.kind === 'reset-confirm') {
      if (low === 'y' || low === 'yes') {
        dev.savedConfig = null;
        return { lines: ['Configuration file are reset successfully.'] };
      }
      return { lines: [] };
    }

    return { lines: [] };
  }

  function executeInner(dev, rawLine) {
    const line = rawLine.trim();

    // ---- 交互式等待中：这一行是给上一条命令的回答 ----
    if (dev.cli.pending) return handlePending(dev, line);

    if (!line) return { lines: [] };

    const args = line.split(/\s+/);
    const cmd = args[0].toLowerCase();
    const view = dev.cli.view;

    // ---- 帮助 ----
    if (line === '?' || cmd === 'help') {
      return { lines: helpLines(dev) };
    }

    // ---- 视图切换：quit 逐级返回，return 直接回用户视图 ----
    if (cmd === 'quit') {
      if (view === 'user-view') {
        return { lines: ['  ---- 已退出登录（模拟环境中保持连接）----'] };
      }
      quitView(dev);
      return { lines: [] };
    }
    if (cmd === 'return') {
      if (view === 'user-view') return { lines: [] };
      returnUserView(dev);
      return { lines: [] };
    }
    if (cmd === 'system-view' || line.toLowerCase() === 'sys') {
      if (view !== 'user-view') return errUnrecognized(cmd);
      // 从用户视图进系统视图，视图栈一定是干净的
      dev.cli.stack = [];
      resetCliCtx(dev);
      dev.cli.view = 'system-view';
      return { lines: ['Enter system view, return user view with Ctrl+Z.'] };
    }

    // 真实 VRP 允许在接口类视图里直接敲 interface 切到另一个接口，不必先 quit。
    // VLAN 视图里则不行 —— 那里 interface 不是合法命令，真机同样报 Unrecognized。
    if (cmd === 'interface' && ['interface-view', 'portgroup-view', 'vlanif-view', 'trunk-view'].includes(view)) {
      resetToSystemView(dev);
      return executeInner(dev, line);
    }

    // ---- display / show ----
    // PC 没有 VRP 命令行，不支持 display
    if (cmd === 'display' || cmd === 'dis') {
      if (dev.type === 'pc') return errUnrecognized(cmd);
      return { lines: dispatchDisplay(dev, args) };
    }

    // ---- ping / tracert ----
    if (cmd === 'ping') return cmdPing(dev, args);
    if (cmd === 'tracert' || cmd === 'traceroute') return cmdTracert(dev, args);

    // ---- save：真实设备会先问 y/n，再问文件名 ----
    if (cmd === 'save') {
      if (view !== 'user-view') return errUnrecognized(cmd);
      if (args[1]) {
        // 直接带文件名（save vrpcfg.cfg）→ 跳过交互
        dev.savedConfig = E.runningConfig(dev);
        dev.lastSaved = Date.now();
        dev.savedFile = args[1];
        return {
          lines: [
            'Now saving the current configuration to the slot 0.',
            'Save the configuration successfully.'
          ]
        };
      }
      dev.cli.pending = { kind: 'save-confirm' };
      return {
        lines: [
          'The current configuration will be written to the device.',
          'Are you sure to continue? (y/n)[n]:'
        ]
      };
    }
    if (cmd === 'reset' && args[1] === 'saved-configuration') {
      dev.cli.pending = { kind: 'reset-confirm' };
      return {
        lines: [
          'The configuration file will be reset to the factory settings.',
          'Warning: All configuration will be lost, continue? (y/n)[n]:'
        ]
      };
    }

    /* ================= 用户视图以下为 PC 命令 ================= */
    if (dev.type === 'pc' && view === 'user-view') {
      if (cmd === 'ipconfig') return cmdIpconfig(dev, args);
      if (cmd === 'ip') {
        // ip 192.168.10.2 255.255.255.0 192.168.10.1
        const ip = args[1];
        const mask = parseMask(args[2]);
        const gw = args[3] || null;
        if (!E.isValidIp(ip) || mask == null) return errWrong('ip');
        if (gw && !E.isValidIp(gw)) return errWrong('ip');
        const p = dev.ports[0];
        p.ip = ip;
        p.mask = mask;
        p.gateway = gw;
        p.dhcp = false;
        return { lines: [`已设置 IP 地址：${ip}/${mask}${gw ? '  网关：' + gw : ''}`] };
      }
      if (cmd === 'dhcp') return { lines: doDhcp(dev) };
      return errUnrecognized(cmd);
    }

    /* ================= 系统视图 ================= */
    if (view === 'system-view') {
      if (cmd === 'sysname') {
        if (!args[1]) return errIncomplete('sysname');
        dev.hostname = args[1];
        return { lines: [] };
      }
      if (cmd === 'vlan') {
        if (args[1] === 'batch') {
          const list = vlanList(args.slice(2).join(' '));
          if (!list || list === 'all') return errWrong('vlan batch');
          list.forEach((v) => { if (!dev.vlans.includes(v)) dev.vlans.push(v); });
          return { lines: [] };
        }
        const n = parseInt(args[1], 10);
        if (isNaN(n) || n < 1 || n > 4094) return errWrong(args[1]);
        if (!dev.vlans.includes(n)) dev.vlans.push(n);
        // 关键：vlan <id> 会进入 VLAN 视图 [SW1-vlan10]，和真实 VRP 一致
        enterView(dev, 'vlan-view', { vlanId: n });
        return { lines: [] };
      }
      if (cmd === 'undo' && args[1] === 'vlan') {
        // 支持单个删除（undo vlan 10）与批量删除（undo vlan batch 10 20 / 10 to 20）
        const batchMode = String(args[2]).toLowerCase() === 'batch';
        const ids = batchMode ? vlanList(args.slice(3).join(' ')) : [parseInt(args[2], 10)];
        if (!ids || ids === 'all' || !ids.length || ids.some((n) => isNaN(n))) {
          return errWrong(batchMode ? 'vlan batch' : args[2]);
        }
        if (ids.includes(1)) return { lines: ['Error: The default VLAN cannot be deleted.'] };

        // 有接口还挂在上面时不允许直接删，真实 VRP 也是这个行为
        const inUse = (n) =>
          dev.ports.some(
            (p) => E.portVlan(p) === n || (p.mode === 'trunk' && Array.isArray(p.allowedVlans) && p.allowedVlans.includes(n))
          );
        const usedVlans = ids.filter(inUse);
        if (usedVlans.length) {
          const used = dev.ports.filter((p) => ids.some(inUse));
          return {
            lines: [
              `Error: VLAN ${usedVlans.join(', ')} is in use by ${used.length} port(s): ${used.map((p) => p.name).join(', ')}.`,
              `// 提示：请先把这些端口的 VLAN 配置改掉，再删除该 VLAN。`
            ]
          };
        }
        ids.forEach((n) => {
          dev.vlans = dev.vlans.filter((v) => v !== n);
          delete (dev.vlanMeta || {})[n];
        });
        return { lines: [] };
      }
      if (cmd === 'interface') {
        const toks = joinIfaceTokens(args.slice(1));
        if (!toks.length) return errIncomplete('interface');

        // interface range ge0/0/1 to ge0/0/5 —— 临时端口组，批量下发配置
        if (/^range$/i.test(toks[0])) {
          const ids = expandIfaceList(dev, toks.slice(1));
          if (!ids) {
            return [
              ...errWrong('range'),
              '// 提示：批量写法为 interface range gigabitethernet 0/0/1 to gigabitethernet 0/0/5。'
            ];
          }
          enterView(dev, 'portgroup-view', { ifaceIds: ids, ifaceId: ids[0], groupName: null });
          return { lines: [] };
        }

        const iface = resolveIface(dev, toks[0]);
        if (!iface) return errWrong('interface');
        if (iface.kind === 'vlanif') {
          if (dev.l2only) {
            return { lines: ['Error: This is a layer 2 switch, Vlanif is not supported.', '// 提示：S3700 是二层交换机，三层接口请用 S5700/路由器。'] };
          }
          if (!dev.vlans.includes(iface.vlanId)) dev.vlans.push(iface.vlanId);
          if (!dev.vlanifs.find((v) => v.vlanId === iface.vlanId)) {
            dev.vlanifs.push({ vlanId: iface.vlanId, enabled: true, ip: null, mask: null, desc: '', dhcpSelect: false });
          }
          enterView(dev, 'vlanif-view', { vlanifId: iface.vlanId });
          return { lines: [] };
        }
        if (iface.kind === 'trunk') {
          const members = dev.ports.filter((p) => p.trunkId === iface.trunkId);
          if (!members.length) return { lines: [`Error: Eth-Trunk${iface.trunkId} does not exist.`, `// 提示：请先进入物理端口执行 eth-trunk ${iface.trunkId} 加入成员口。`] };
          enterView(dev, 'trunk-view', { trunkId: iface.trunkId });
          return { lines: [] };
        }
        enterView(dev, 'interface-view', { ifaceId: iface.port.id, ifaceIds: [iface.port.id] });
        return { lines: [] };
      }
      if (cmd === 'port-group') {
        // 临时端口组：port-group group-member ge0/0/1 to ge0/0/8
        if (args[1] && args[1].toLowerCase() === 'group-member') {
          const ids = expandIfaceList(dev, joinIfaceTokens(args.slice(2)));
          if (!ids) {
            return [
              ...errWrong('group-member'),
              '// 提示：批量写法为 port-group group-member gigabitethernet 0/0/1 to gigabitethernet 0/0/8。'
            ];
          }
          enterView(dev, 'portgroup-view', { ifaceIds: ids, ifaceId: ids[0], groupName: null });
          return { lines: [] };
        }
        // 永久端口组：port-group <组名>
        if (!args[1]) return errIncomplete('port-group');
        const gname = args[1];
        dev.portGroups = dev.portGroups || [];
        if (!dev.portGroups.find((g) => g.name === gname)) dev.portGroups.push({ name: gname, memberIds: [] });
        enterView(dev, 'portgroup-view', { groupName: gname, ifaceIds: [] });
        return { lines: [] };
      }
      if (cmd === 'undo' && args[1] === 'port-group') {
        if (!args[2]) return errIncomplete('undo port-group');
        if (args[2].toLowerCase() === 'all') {
          dev.portGroups = [];
          return { lines: [] };
        }
        dev.portGroups = (dev.portGroups || []).filter((g) => g.name !== args[2]);
        return { lines: [] };
      }
      if (cmd === 'ip' && args[1] === 'route-static') {
        const dest = args[2];
        const mask = parseMask(args[3]);
        const nh = args[4];
        let pre = 60;
        const pIdx = args.findIndex((a) => a.toLowerCase() === 'preference');
        if (pIdx > 0) pre = parseInt(args[pIdx + 1], 10) || 60;
        if (!E.isValidIp(dest) || mask == null || !E.isValidIp(nh)) return errWrong(!E.isValidIp(dest) ? dest : mask == null ? args[3] : nh);
        dev.routes = dev.routes.filter((r) => !(r.proto === 'Static' && r.dest === dest && r.mask === mask));
        dev.routes.push({ dest, mask, nextHop: nh, proto: 'Static', pre, cost: 0 });
        return { lines: [] };
      }
      if (cmd === 'undo' && args[1] === 'ip' && args[2] === 'route-static') {
        const dest = args[3];
        const mask = parseMask(args[4]);
        dev.routes = dev.routes.filter((r) => !(r.proto === 'Static' && r.dest === dest && r.mask === mask));
        return { lines: [] };
      }
      if (cmd === 'ip' && args[1] === 'pool') {
        if (!args[2]) return errIncomplete('ip pool');
        if (!dev.dhcp.pools.find((p) => p.name === args[2])) {
          dev.dhcp.pools.push({ name: args[2], network: null, mask: null, gateway: null, dns: null, excluded: [], leaseDays: 1 });
        }
        enterView(dev, 'pool-view', { poolName: args[2] });
        return { lines: [] };
      }
      if (cmd === 'dhcp') {
        if (args[1] === 'enable') {
          dev.dhcp.enabled = true;
          return { lines: [] };
        }
        if (args[1] === 'disable') {
          dev.dhcp.enabled = false;
          return { lines: [] };
        }
        return errWrong('dhcp');
      }
      if (cmd === 'undo' && args[1] === 'dhcp' && args[2] === 'enable') {
        dev.dhcp.enabled = false;
        return { lines: [] };
      }
      if (cmd === 'nat') {
        if (args[1] !== 'address-group') {
          return [
            ...errWrong('nat'),
            '// 提示：nat outbound 要在接口视图下配置；nat address-group 在系统视图下配置。'
          ];
        }
        const gid = parseInt(args[2], 10);
        if (isNaN(gid)) return errWrong(args[2]);
        dev.natAddrGroups = dev.natAddrGroups || [];
        if (!dev.natAddrGroups.find((g) => g.id === gid)) dev.natAddrGroups.push({ id: gid, sections: [] });
        enterView(dev, 'nat-group-view', { natGroupId: gid });
        return { lines: [] };
      }
      if (cmd === 'undo' && args[1] === 'nat' && args[2] === 'address-group') {
        const gid = parseInt(args[3], 10);
        if (isNaN(gid)) return errWrong(args[3]);
        dev.natAddrGroups = (dev.natAddrGroups || []).filter((g) => g.id !== gid);
        // 引用该地址池的 nat outbound 退回 Easy IP，避免留下悬空引用
        dev.ports.forEach((p) => {
          if (p.nat && p.nat.addrGroup === gid) p.nat.addrGroup = null;
        });
        return { lines: [] };
      }
      if (cmd === 'ospf') {
        const pid = parseInt(args[1], 10);
        if (isNaN(pid)) return errWrong(args[1]);
        const ridIdx = args.findIndex((a) => a.toLowerCase() === 'router-id');
        dev.ospf.enabled = true;
        dev.ospf.pid = pid;
        if (ridIdx > 0 && E.isValidIp(args[ridIdx + 1])) dev.ospf.routerId = args[ridIdx + 1];
        enterView(dev, 'ospf-view', { ospfPid: pid });
        return { lines: [] };
      }
      if (cmd === 'undo' && args[1] === 'ospf') {
        dev.ospf = { enabled: false, pid: null, routerId: null, areas: [], ifaces: [], neighbors: [] };
        dev.routes = dev.routes.filter((r) => r.proto !== 'OSPF');
        return { lines: [] };
      }
      if (cmd === 'acl') {
        let id = args[1];
        if (id && id.toLowerCase() === 'number') id = args[2];
        const n = parseInt(id, 10);
        if (isNaN(n)) return errWrong(id);
        if (!dev.acl.find((a) => a.id === n)) dev.acl.push({ id: n, rules: [] });
        enterView(dev, 'acl-view', { aclId: n });
        return { lines: [] };
      }
      if (cmd === 'stp') {
        if (args[1] === 'mode') {
          if (!['stp', 'rstp', 'mstp'].includes(args[2])) return errWrong(args[2]);
          dev.stp.mode = args[2];
          return { lines: [] };
        }
        if (args[1] === 'priority') {
          const n = parseInt(args[2], 10);
          if (isNaN(n) || n % 4096 !== 0)
            return [...errWrong(args[2]), '// 提示：STP 优先级必须是 4096 的倍数（4096/8192/16384/32768）。'];
          dev.stp.priority = n;
          return { lines: [] };
        }
        return errWrong('stp');
      }
      if (cmd === 'traffic-filter') {
        return [...errWrong('traffic-filter'), '// 提示：traffic-filter 要在接口视图或 Vlanif 视图下配置。'];
      }
      return errUnrecognized(cmd);
    }

    /* ================= VLAN 视图 ================= */
    if (view === 'vlan-view') {
      const n = dev.cli.vlanId;
      if (!dev.vlans.includes(n)) { quitView(dev); return errUnrecognized(cmd); }
      dev.vlanMeta = dev.vlanMeta || {};
      const meta = dev.vlanMeta[n] || (dev.vlanMeta[n] = {});

      if (cmd === 'description') {
        meta.desc = args.slice(1).join(' ');
        return { lines: [] };
      }
      if (cmd === 'undo' && args[1] === 'description') {
        delete meta.desc;
        return { lines: [] };
      }
      if (cmd === 'name') {
        if (!args[1]) return errIncomplete('name');
        meta.name = args[1];
        return { lines: [] };
      }
      if (cmd === 'undo' && args[1] === 'name') {
        delete meta.name;
        return { lines: [] };
      }
      return errUnrecognized(cmd);
    }

    /* ================= 接口视图 / 端口组视图 =================
     * 两者共用同一套命令：端口组里敲的配置会批量下发到每个成员口。
     *   [SW1] port-group group-member ge0/0/1 to ge0/0/8   → [SW1-port-group]
     *   [SW1] interface range ge0/0/1 to ge0/0/8           → [SW1-port-group]
     *   [SW1] port-group 1  →  group-member ...            → [SW1-port-group-1]
     */
    if (view === 'interface-view' || view === 'portgroup-view') {
      // group-member 要放在"成员为空"检查之前：永久端口组刚创建时成员是空的，
      // 必须允许在组视图里先把成员加进来。
      if (cmd === 'group-member') {
        const g = (dev.portGroups || []).find((x) => x.name === dev.cli.groupName);
        if (!g) return errUnrecognized(cmd);
        const ids = expandIfaceList(dev, joinIfaceTokens(args.slice(1)));
        if (!ids) {
          return [
            ...errWrong('group-member'),
            '// 提示：写法为 group-member gigabitethernet 0/0/1 to gigabitethernet 0/0/8。'
          ];
        }
        ids.forEach((id) => { if (!g.memberIds.includes(id)) g.memberIds.push(id); });
        return { lines: [] };
      }
      if (cmd === 'undo' && args[1] === 'group-member') {
        const g = (dev.portGroups || []).find((x) => x.name === dev.cli.groupName);
        if (g) {
          const ids = expandIfaceList(dev, joinIfaceTokens(args.slice(2)));
          if (ids) g.memberIds = g.memberIds.filter((id) => !ids.includes(id));
        }
        return { lines: [] };
      }

      const ports = viewPorts(dev);
      if (!ports.length) { quitView(dev); return errUnrecognized(cmd); }
      if (cmd === 'description') {
        ports.forEach((p) => { p.desc = args.slice(1).join(' '); });
        return { lines: [] };
      }
      if (cmd === 'shutdown') {
        ports.forEach((p) => { p.shutdown = true; });
        return { lines: [] };
      }
      if (cmd === 'undo' && args[1] === 'shutdown') {
        ports.forEach((p) => { p.shutdown = false; });
        return { lines: [] };
      }
      if (cmd === 'port') {
        if (args[1] === 'link-type') {
          const t = args[2];
          if (!['access', 'trunk', 'hybrid'].includes(t)) return errWrong(t);
          ports.forEach((p) => {
            p.mode = t;
            if (t === 'trunk' || t === 'access') p.allowedVlans = 'all';
          });
          return { lines: [] };
        }
        if (args[1] === 'default' && args[2] === 'vlan') {
          const n = parseInt(args[3], 10);
          if (isNaN(n) || n < 1 || n > 4094) return errWrong(args[3]);
          if (!dev.vlans.includes(n)) dev.vlans.push(n);
          ports.forEach((p) => { p.vlan = n; });
          return { lines: [] };
        }
        if (args[1] === 'trunk' && args[2] === 'allow-pass' && args[3] === 'vlan') {
          const list = vlanList(args.slice(4).join(' '));
          if (!list) return errWrong('port trunk allow-pass vlan');
          if (list !== 'all') list.forEach((v) => { if (!dev.vlans.includes(v)) dev.vlans.push(v); });
          ports.forEach((p) => { p.allowedVlans = list; });
          return { lines: [] };
        }
        if (args[1] === 'hybrid') {
          const n = parseInt(args[3], 10);
          if (isNaN(n)) return errWrong('port hybrid');
          if (!dev.vlans.includes(n)) dev.vlans.push(n);
          ports.forEach((p) => { p.vlan = n; });
          return { lines: [] };
        }
        return errWrong('port');
      }
      if (cmd === 'undo' && args[1] === 'port') {
        if (args[2] === 'trunk' && args[3] === 'allow-pass') {
          ports.forEach((p) => { p.allowedVlans = []; });
          return { lines: [] };
        }
        if (args[2] === 'default') {
          ports.forEach((p) => { p.vlan = 1; });
          return { lines: [] };
        }
        return errWrong('undo port');
      }
      if (cmd === 'ip' && args[1] === 'address') {
        if (ports.some((p) => p.mode !== 'routed')) {
          return { lines: ['Error: Wrong parameter found at \'^\' position.', '// 提示：只有路由口才能直接配 IP，请先 undo portswitch，或在 Vlanif 接口下配置。'] };
        }
        const ip = args[2];
        const mask = parseMask(args[3]);
        if (!E.isValidIp(ip) || mask == null) return errWrong(!E.isValidIp(ip) ? ip : args[3]);
        ports.forEach((p) => { p.ip = ip; p.mask = mask; });
        return { lines: [] };
      }
      if (cmd === 'undo' && args[1] === 'ip' && args[2] === 'address') {
        ports.forEach((p) => { p.ip = null; p.mask = null; });
        return { lines: [] };
      }
      if (cmd === 'undo' && args[1] === 'portswitch') {
        ports.forEach((p) => { p.mode = 'routed'; });
        return { lines: [] };
      }
      if (cmd === 'eth-trunk') {
        const n = parseInt(args[1], 10);
        if (isNaN(n)) return errWrong(args[1]);
        ports.forEach((p) => {
          p.trunkId = n;
          if (p.trunkMode == null) p.trunkMode = 'lacp';
        });
        return { lines: [] };
      }
      if (cmd === 'undo' && args[1] === 'eth-trunk') {
        ports.forEach((p) => { p.trunkId = null; });
        return { lines: [] };
      }
      if (cmd === 'mode') {
        if (!['lacp-static', 'manual'].includes(args[1])) return errWrong(args[1]);
        if (args[1] === 'manual' && args[2] !== 'load-balance') return errWrong('mode');
        ports.forEach((p) => { p.trunkMode = args[1] === 'manual' ? 'manual' : 'lacp'; });
        return { lines: [] };
      }
      if (cmd === 'stp') {
        if (args[1] === 'edged-port') {
          const v = args[2] === 'enable' || args[2] === undefined;
          ports.forEach((p) => { p.stpEdged = v; });
          return { lines: [] };
        }
        return errWrong('stp');
      }
      if (cmd === 'undo' && args[1] === 'stp' && args[2] === 'edged-port') {
        ports.forEach((p) => { p.stpEdged = false; });
        return { lines: [] };
      }
      if (cmd === 'bpdu-protection' || (cmd === 'stp' && args[1] === 'bpdu-protection')) {
        ports.forEach((p) => { p.bpduProtect = true; });
        return { lines: [] };
      }
      if (cmd === 'undo' && args[1] === 'bpdu-protection') {
        ports.forEach((p) => { p.bpduProtect = false; });
        return { lines: [] };
      }
      if (cmd === 'port-security') {
        if (args[1] === 'enable') {
          ports.forEach((p) => { p.portSec.enabled = true; });
          return { lines: [] };
        }
        if (args[1] === 'max-mac-num') {
          const n = parseInt(args[2], 10);
          if (isNaN(n) || n < 1) return errWrong(args[2]);
          ports.forEach((p) => { p.portSec.maxMac = n; });
          return { lines: [] };
        }
        return errWrong('port-security');
      }
      if (cmd === 'undo' && args[1] === 'port-security') {
        if (args[2] === 'enable') ports.forEach((p) => { p.portSec.enabled = false; });
        return { lines: [] };
      }
      if (cmd === 'dhcp' && args[1] === 'select') {
        ports.forEach((p) => { p.dhcpSelect = true; });
        return { lines: [] };
      }
      if (cmd === 'traffic-filter') {
        const dir = args[1];
        const aclIdx = args.findIndex((a) => a.toLowerCase() === 'acl');
        const aclId = aclIdx > 0 ? parseInt(args[aclIdx + 1], 10) : NaN;
        if (!['inbound', 'outbound'].includes(dir) || isNaN(aclId)) return errWrong(!['inbound', 'outbound'].includes(dir) ? dir : args[aclIdx + 1]);
        if (!dev.acl.find((a) => a.id === aclId)) {
          return { lines: [`Error: ACL ${aclId} does not exist.`, `// 提示：请先在系统视图执行 acl number ${aclId} 创建该 ACL。`] };
        }
        ports.forEach((p) => {
          dev.aclBindings = dev.aclBindings.filter((b) => !(b.portId === p.id && b.direction === dir));
          dev.aclBindings.push({ portId: p.id, direction: dir, aclId });
        });
        return { lines: [] };
      }
      if (cmd === 'undo' && args[1] === 'traffic-filter') {
        const dir = args[2];
        ports.forEach((p) => {
          dev.aclBindings = dev.aclBindings.filter((b) => !(b.portId === p.id && b.direction === dir));
        });
        return { lines: [] };
      }
      if (cmd === 'nat') {
        if (args[1] !== 'outbound') {
          return [...errWrong('nat'), '// 提示：接口下 NAT 的写法为 nat outbound <ACL编号> [address-group <编号>]。'];
        }
        const aclId = parseInt(args[2], 10);
        if (isNaN(aclId)) return errWrong(args[2]);
        if (!dev.acl.find((a) => a.id === aclId)) {
          return { lines: [`Error: ACL ${aclId} does not exist.`, '// 提示：nat outbound 要用 ACL 指定需要转换的内网流量，请先创建该 ACL。'] };
        }
        const gi = args.findIndex((a) => a.toLowerCase() === 'address-group');
        const ag = gi > 0 ? parseInt(args[gi + 1], 10) : null;
        if (ag != null && !(dev.natAddrGroups || []).find((g) => g.id === ag)) {
          return { lines: [`Error: NAT address-group ${ag} does not exist.`, `// 提示：请先在系统视图执行 nat address-group ${ag} 创建公网地址池。`] };
        }
        ports.forEach((p) => { p.nat = { aclId, addrGroup: ag }; });
        return { lines: [] };
      }
      if (cmd === 'undo' && args[1] === 'nat' && args[2] === 'outbound') {
        ports.forEach((p) => { p.nat = null; });
        return { lines: [] };
      }
      return errUnrecognized(cmd);
    }

    /* ================= Vlanif 视图 ================= */
    if (view === 'vlanif-view') {
      const vi = dev.vlanifs.find((v) => v.vlanId === dev.cli.vlanifId);
      if (!vi) { quitView(dev); return errUnrecognized(cmd); }

      if (cmd === 'ip' && args[1] === 'address') {
        const ip = args[2];
        const mask = parseMask(args[3]);
        if (!E.isValidIp(ip) || mask == null) return errWrong(!E.isValidIp(ip) ? ip : args[3]);
        vi.ip = ip;
        vi.mask = mask;
        return { lines: [] };
      }
      if (cmd === 'undo' && args[1] === 'ip' && args[2] === 'address') {
        vi.ip = null;
        vi.mask = null;
        return { lines: [] };
      }
      if (cmd === 'description') { vi.desc = args.slice(1).join(' '); return { lines: [] }; }
      if (cmd === 'shutdown') { vi.enabled = false; return { lines: [] }; }
      if (cmd === 'undo' && args[1] === 'shutdown') { vi.enabled = true; return { lines: [] }; }
      if (cmd === 'dhcp' && args[1] === 'select') { vi.dhcpSelect = true; return { lines: [] }; }
      if (cmd === 'undo' && args[1] === 'dhcp' && args[2] === 'select') { vi.dhcpSelect = false; return { lines: [] }; }
      // Vlanif 上应用 ACL：过滤该 VLAN 内主机进出三层的流量（最常用的 ACL 应用方式）
      if (cmd === 'traffic-filter') {
        const dir = args[1];
        const aclIdx = args.findIndex((a) => a.toLowerCase() === 'acl');
        const aclId = aclIdx > 0 ? parseInt(args[aclIdx + 1], 10) : NaN;
        if (!['inbound', 'outbound'].includes(dir) || isNaN(aclId)) return errWrong(!['inbound', 'outbound'].includes(dir) ? dir : args[aclIdx + 1]);
        if (!dev.acl.find((a) => a.id === aclId)) {
          return { lines: [`Error: ACL ${aclId} does not exist.`, `// 提示：请先在系统视图执行 acl number ${aclId} 创建该 ACL。`] };
        }
        dev.aclBindings = dev.aclBindings.filter((b) => !(b.vlanifId === vi.vlanId && b.direction === dir));
        dev.aclBindings.push({ vlanifId: vi.vlanId, direction: dir, aclId });
        return { lines: [] };
      }
      if (cmd === 'undo' && args[1] === 'traffic-filter') {
        dev.aclBindings = dev.aclBindings.filter((b) => !(b.vlanifId === vi.vlanId && b.direction === args[2]));
        return { lines: [] };
      }
      return errUnrecognized(cmd);
    }

    /* ================= NAT 公网地址池视图 ================= */
    if (view === 'nat-group-view') {
      const g = (dev.natAddrGroups || []).find((x) => x.id === dev.cli.natGroupId);
      if (!g) { quitView(dev); return errUnrecognized(cmd); }

      if (cmd === 'section') {
        const index = parseInt(args[1], 10);
        const start = args[2];
        const end = args[3];
        if (isNaN(index)) return errWrong(args[1]);
        if (!E.isValidIp(start)) return errWrong(start);
        if (!E.isValidIp(end)) return errWrong(end);
        g.sections = g.sections.filter((s) => s.index !== index);
        g.sections.push({ index, start, end });
        g.sections.sort((a, b) => a.index - b.index);
        return { lines: [] };
      }
      if (cmd === 'undo' && args[1] === 'section') {
        const index = parseInt(args[2], 10);
        g.sections = g.sections.filter((s) => s.index !== index);
        return { lines: [] };
      }
      return errUnrecognized(cmd);
    }

    /* ================= Eth-Trunk 视图 ================= */
    if (view === 'trunk-view') {
      const members = dev.ports.filter((p) => p.trunkId === dev.cli.trunkId);
      if (!members.length) { quitView(dev); return errUnrecognized(cmd); }

      if (cmd === 'mode') {
        // 先校验再落配置，避免参数写错时配置已被改掉
        if (!['lacp-static', 'manual'].includes(args[1])) return errWrong(args[1]);
        if (args[1] === 'manual' && args[2] !== 'load-balance') return errWrong('mode');
        members.forEach((m) => { m.trunkMode = args[1] === 'manual' ? 'manual' : 'lacp'; });
        return { lines: [] };
      }
      if (cmd === 'ip' && args[1] === 'address') {
        const ip = args[2];
        const mask = parseMask(args[3]);
        if (!E.isValidIp(ip) || mask == null) return errWrong(!E.isValidIp(ip) ? ip : args[3]);
        members.forEach((m) => { m.mode = 'routed'; m.ip = ip; m.mask = mask; });
        return { lines: [] };
      }
      if (cmd === 'undo' && args[1] === 'ip' && args[2] === 'address') {
        members.forEach((m) => { m.ip = null; m.mask = null; });
        return { lines: [] };
      }
      if (cmd === 'description') {
        members.forEach((m) => (m.desc = args.slice(1).join(' ')));
        return { lines: [] };
      }
      return errUnrecognized(cmd);
    }

    /* ================= 地址池视图 ================= */
    if (view === 'pool-view') {
      const pool = dev.dhcp.pools.find((p) => p.name === dev.cli.poolName);
      if (!pool) { quitView(dev); return errUnrecognized(cmd); }

      if (cmd === 'network') {
        const net = args[1];
        const mi = args.findIndex((a) => a.toLowerCase() === 'mask');
        const mask = mi > 0 ? parseMask(args[mi + 1]) : null;
        if (!E.isValidIp(net) || mask == null) return errWrong(!E.isValidIp(net) ? net : args[mi + 1]);
        pool.network = E.networkOf(net, mask);
        pool.mask = mask;
        return { lines: [] };
      }
      if (cmd === 'gateway-list') {
        if (!E.isValidIp(args[1])) return errWrong(args[1]);
        pool.gateway = args[1];
        return { lines: [] };
      }
      if (cmd === 'dns-list') {
        if (!E.isValidIp(args[1])) return errWrong(args[1]);
        pool.dns = args[1];
        return { lines: [] };
      }
      if (cmd === 'excluded-ip-address') {
        if (!E.isValidIp(args[1])) return errWrong(args[1]);
        pool.excluded = pool.excluded || [];
        pool.excluded.push(args[1]);
        return { lines: [] };
      }
      if (cmd === 'lease') {
        const n = parseInt(args[2], 10) || 1;
        pool.leaseDays = n;
        return { lines: [] };
      }
      if (cmd === 'static-bind') {
        return { lines: ['（本模拟器暂不校验静态绑定，配置已记录）'] };
      }
      return errUnrecognized(cmd);
    }

    /* ================= ACL 视图 ================= */
    if (view === 'acl-view') {
      const acl = dev.acl.find((a) => a.id === dev.cli.aclId);
      if (!acl) { quitView(dev); return errUnrecognized(cmd); }

      if (cmd === 'rule') {
        const parsed = parseAclRule(args.slice(1));
        if (parsed.err) return parsed.err;
        const rule = parsed.rule;
        acl.rules = acl.rules.filter((r) => r.ruleId !== rule.ruleId);
        acl.rules.push(rule);
        acl.rules.sort((x, y) => x.ruleId - y.ruleId);
        return { lines: [] };
      }
      if (cmd === 'undo' && args[1] === 'rule') {
        if (String(args[2]).toLowerCase() === 'all') {
          acl.rules = [];
          return { lines: [] };
        }
        const ruleId = parseInt(args[2], 10);
        if (isNaN(ruleId)) return errWrong(args[2]);
        acl.rules = acl.rules.filter((r) => r.ruleId !== ruleId);
        return { lines: [] };
      }
      if (cmd === 'description') {
        acl.desc = args.slice(1).join(' ');
        return { lines: [] };
      }
      if (cmd === 'step') {
        const n = parseInt(args[1], 10);
        if (isNaN(n)) return errWrong(args[1]);
        acl.step = n;
        return { lines: [] };
      }
      return errUnrecognized(cmd);
    }

    /* ================= OSPF 视图 ================= */
    if (view === 'ospf-view') {
      if (cmd === 'router-id') {
        if (!E.isValidIp(args[1])) return errWrong(args[1]);
        dev.ospf.routerId = args[1];
        return { lines: [] };
      }
      if (cmd === 'area') {
        const areaId = args[1];
        if (areaId == null) return errIncomplete('area');
        const norm = areaId === '0' ? '0.0.0.0' : areaId;
        if (!dev.ospf.areas.find((a) => String(a.areaId) === String(norm))) {
          dev.ospf.areas.push({ areaId: norm, networks: [] });
        }
        enterView(dev, 'ospf-area-view', { ospfPid: dev.ospf.pid, areaId: norm });
        return { lines: [] };
      }
      return errUnrecognized(cmd);
    }

    /* ================= OSPF 区域视图 ================= */
    // quit 从这里只回上一级（OSPF 视图），不会直接跳到系统视图
    if (view === 'ospf-area-view') {
      const area = dev.ospf.areas.find((a) => String(a.areaId) === String(dev.cli.areaId));
      if (!area) { quitView(dev); return errUnrecognized(cmd); }
      if (cmd === 'network') {
        const ip = args[1];
        const wc = args[2];
        if (!E.isValidIp(ip) || !E.isValidIp(wc)) return errWrong(!E.isValidIp(ip) ? ip : wc);
        area.networks = area.networks.filter((n) => !(n.ip === ip && n.wildcard === wc));
        area.networks.push({ ip, wildcard: wc });
        return { lines: [] };
      }
      if (cmd === 'undo' && args[1] === 'network') {
        area.networks = area.networks.filter((n) => !(n.ip === args[2] && n.wildcard === args[3]));
        return { lines: [] };
      }
      return errUnrecognized(cmd);
    }

    return errUnrecognized(cmd);
  }

  /* ------------------------------ 帮助提示 ------------------------------ */

  const VIEW_LABEL = {
    'user-view': '用户视图',
    'system-view': '系统视图',
    'vlan-view': 'VLAN 视图',
    'interface-view': '接口视图',
    'portgroup-view': '端口组视图',
    'vlanif-view': 'Vlanif 视图',
    'trunk-view': 'Eth-Trunk 视图',
    'pool-view': '地址池视图',
    'acl-view': 'ACL 视图',
    'nat-group-view': 'NAT 地址池视图',
    'ospf-view': 'OSPF 视图',
    'ospf-area-view': 'OSPF 区域视图'
  };

  /** 把视图栈拼成"一级一级"的路径，帮学生搞清自己在第几层 */
  function viewChain(dev) {
    const chain = dev.cli.stack.map((f) => VIEW_LABEL[f.view] || f.view);
    chain.push(VIEW_LABEL[dev.cli.view] || dev.cli.view);
    return chain;
  }

  function helpLines(dev) {
    const v = dev.cli.view;
    const chain = viewChain(dev);
    const common = ['', `  ---- 当前视图路径：${chain.join('  ›  ')} ----`];
    if (chain.length > 1) common.push('  ---- quit 回上一级，return 直接回用户视图 ----');
    common.push('', '  ---- 本视图可用命令（模拟器提供）----');
    const map = {
      'user-view': [
        'system-view                  进入系统视图',
        'display version              查看版本信息',
        'display current-configuration  查看当前配置',
        'display ip interface brief   查看接口 IP 简要信息',
        'display interface <接口名>   查看接口详细信息',
        'display port vlan            查看端口 VLAN 归属',
        'display vlan                 查看 VLAN',
        'display ip routing-table     查看路由表',
        'display mac-address          查看 MAC 地址表',
        'display arp                  查看 ARP 表',
        'display stp brief            查看生成树状态',
        'display eth-trunk            查看链路聚合',
        'display ospf peer brief      查看 OSPF 邻居',
        'display ospf interface       查看 OSPF 接口状态',
        'display ip pool              查看 DHCP 地址池',
        'display acl all              查看所有 ACL 规则',
        'display nat session all      查看 NAT 地址转换表项',
        'display port-group all       查看永久端口组',
        'ping <ip>                    连通性测试',
        'tracert <ip>                 路由跟踪',
        'save                         保存配置（会先问 y/n，再问文件名）'
      ],
      'system-view': [
        'sysname <名字>               修改设备名',
        'vlan <id>                    创建并进入 VLAN 视图',
        'vlan batch <ids>             批量创建 VLAN（不进入视图）',
        'undo vlan <id>               删除 VLAN',
        'undo vlan batch <ids>        批量删除 VLAN',
        'interface <接口名>           进入接口视图',
        'interface range <起> to <止>   批量进入多个端口（临时端口组）',
        'port-group group-member <起> to <止>  批量进入多个端口',
        'port-group <组名>            创建永久端口组，再 group-member 加成员',
        'ip route-static <目的> <掩码> <下一跳>   配置静态路由',
        'ip pool <名字>               创建 DHCP 地址池',
        'dhcp enable                  开启 DHCP 服务',
        'nat address-group <编号>     创建 NAT 公网地址池',
        'ospf <进程号> router-id <id> 开启 OSPF',
        'acl number <2000-3999>       创建 ACL（2000-2999 基本 / 3000-3999 高级）',
        'stp mode rstp                设置生成树模式',
        'stp priority <4096的倍数>    设置桥优先级'
      ],
      'vlan-view': [
        'description <描述>           给 VLAN 加备注',
        'name <名称>                  给 VLAN 命名（display vlan 的 Description 列）',
        'display this                 查看本 VLAN 配置'
      ],
      'interface-view': [
        'description <描述>           接口描述',
        'shutdown / undo shutdown     关闭 / 开启接口',
        'port link-type access|trunk|hybrid   端口类型',
        'port default vlan <id>       Access 口加入 VLAN',
        'port trunk allow-pass vlan <列表|all>  Trunk 放行 VLAN',
        'undo portswitch              转为路由口（可配 IP）',
        'ip address <ip> <掩码>       配置 IP（路由口）',
        'eth-trunk <编号>             加入链路聚合组',
        'stp edged-port enable        配置边缘端口',
        'port-security enable         开启端口安全',
        'port-security max-mac-num <n>  限制 MAC 数量',
        'traffic-filter inbound acl <编号>  应用 ACL 过滤',
        'nat outbound <ACL编号>       出口做 NAT（Easy IP）',
        'display this                 查看本接口配置'
      ],
      'portgroup-view': [
        '（这里的命令会批量下发到端口组内每个成员口）',
        'group-member <起> to <止>    永久端口组里添加成员口',
        'shutdown / undo shutdown     批量关闭 / 开启',
        'port link-type access|trunk  批量设置端口类型',
        'port default vlan <id>       批量划入 VLAN',
        'port trunk allow-pass vlan <列表|all>  批量放行 VLAN',
        'description <描述>           批量设置描述',
        'display this                 查看组内各端口的配置',
        'quit                         退出端口组（临时端口组随即消失）'
      ],
      'vlanif-view': [
        'ip address <ip> <掩码>       配置 VLAN 三层网关地址',
        'dhcp select global           指定使用全局地址池',
        'traffic-filter inbound acl <编号>   在 VLAN 网关上下发 ACL',
        'description <描述>           接口描述',
        'shutdown / undo shutdown     关闭 / 开启接口',
        'display this                 查看本接口配置'
      ],
      'trunk-view': [
        'mode lacp-static             设置为 LACP 模式',
        'mode manual load-balance     设置为手工负载分担',
        'ip address <ip> <掩码>       配置 IP',
        'display this                 查看本接口配置'
      ],
      'pool-view': [
        'network <网段> mask <掩码>   地址池网段',
        'gateway-list <ip>            网关',
        'dns-list <ip>                DNS',
        'excluded-ip-address <ip>     排除地址',
        'lease day <n>                租期',
        'display this                 查看本地址池配置'
      ],
      'acl-view': [
        'rule <序号> permit|deny [ip] source <ip> <反掩码> [destination <ip> <反掩码>]',
        'rule 5 deny ip source 192.168.10.0 0.0.0.255 destination 192.168.20.0 0.0.0.255',
        'rule 10 permit ip            放行其余流量（ACL 末尾缺省是拒绝所有）',
        'undo rule <序号> | undo rule all    删除规则',
        'display this                 查看本 ACL 配置'
      ],
      'nat-group-view': [
        'section <序号> <起始IP> <结束IP>   指定可用的公网地址范围',
        'display this                 查看本地址池配置'
      ],
      'ospf-view': [
        'router-id <ip>               指定 Router ID',
        'area 0                       进入区域视图',
        'display this                 查看 OSPF 配置'
      ],
      'ospf-area-view': [
        'network <网段> <通配符>      通告网段',
        'display this                 查看本区域配置'
      ]
    };
    if (dev.type === 'pc') {
      return [
        '',
        '  ---- PC 可用命令 ----',
        'ipconfig                     查看 IP 配置',
        'ipconfig /renew              通过 DHCP 重新获取地址',
        'ipconfig /release            释放地址',
        'ip <地址> <掩码> <网关>      手工配置 IP',
        'ping <ip>                    连通性测试',
        'tracert <ip>                 路由跟踪'
      ];
    }
    return [...common, ...(map[v] || [])];
  }

  global.NE = global.NE || {};
  Object.assign(global.NE, {
    execute,
    promptOf,
    resolveIface,
    helpLines,
    computeMacTable,
    viewChain,
    viewPorts,
    expandIfaceList,
    resetCli,
    VIEW_LABEL
  });
})(window);
