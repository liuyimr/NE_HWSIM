  function autocomplete(d, inp) {
    const cur = inp.value;
    let list = CANDIDATES[d.cli.view] || [];
    if (d.type === 'pc') list = ['ipconfig', 'ipconfig /renew', 'ipconfig /release', 'ip ', 'sysname ', 'ping ', 'tracert ', 'help'];

    if (!cur.trim()) {
      const d2 = activeDev();
      d2.logs.push({ t: '', c: '' });
      d2.logs.push({ t: '  可输入的命令：', c: 'dim' });
      for (const c of list) d2.logs.push({ t: '    ' + c, c: 'hl' });
      renderConsole();
      return;
    }
    const hits = list.filter((c) => c.toLowerCase().startsWith(cur.toLowerCase()));
    if (hits.length === 1) {
      inp.value = hits[0];
      return;
    }
    if (hits.length > 1) {
      const common = commonPrefix(hits);
      if (common.length > cur.length) inp.value = common;
      else {
        const d2 = activeDev();
        d2.logs.push({ t: '', c: '' });
        d2.logs.push({ t: '  匹配到的命令：', c: 'dim' });
        for (const c of hits) d2.logs.push({ t: '    ' + c, c: 'hl' });
        renderConsole();
      }
    }
  }

  function commonPrefix(arr) {
    if (!arr.length) return '';
    let p = arr[0];
    for (const s of arr) {
      while (s.toLowerCase().indexOf(p.toLowerCase()) !== 0) {
        p = p.slice(0, -1);
        if (!p) return '';
      }
    }
    return p;
  }

  /* ------------------------------ 画布平移缩放 ------------------------------ */
  /** 以画布坐标 (mx,my) 为锚点缩放到 next（锚点下的内容保持不动） */
  function zoomAt(mx, my, next) {
    const old = UI.scale;
    const s = Math.min(MAX_SCALE, Math.max(MIN_SCALE, next));
    if (s === old) return;
    UI.panX = mx - (mx - UI.panX) * (s / old);
    UI.panY = my - (my - UI.panY) * (s / old);
    UI.scale = s;
    applyTransform();
  }
  /** 屏幕中心缩放（给缩放按钮用） */
  function zoomBy(factor) {
    const rect = $('stage').getBoundingClientRect();
    zoomAt(rect.width / 2, rect.height / 2, UI.scale * factor);
    persist();
  }
  /** 把所有设备统统一屏放好（加载实验、旋转屏幕、点「适应画布」都走这里） */
  function fitView() {
    const devs = E.Net.devices;
    if (!devs.length) return;
    const minX = Math.min(...devs.map((d) => d.x));
    const maxX = Math.max(...devs.map((d) => d.x + cardW(d)));
    const minY = Math.min(...devs.map((d) => d.y));
    const maxY = Math.max(...devs.map((d) => d.y)) + 180;
    const rect = $('stage').getBoundingClientRect();
    if (rect.width < 10 || rect.height < 10) return;
    const s = Math.min(1.1, Math.min(rect.width / (maxX - minX + 80), rect.height / (maxY - minY + 80)));
    // 手机上屏幕窄，自动适应容易把拓扑压得看不清端口；给一个不要太小的下限
    UI.scale = Math.min(1.1, Math.max(narrow() ? 0.45 : 0.35, s));
    UI.panX = (rect.width - (maxX - minX) * UI.scale) / 2 - minX * UI.scale;
    UI.panY = (rect.height - (maxY - minY) * UI.scale) / 2 - minY * UI.scale;
    applyTransform();
  }

  /** 当前是不是窄屏 / 手机 —— 和 index.html 的媒体查询用同一套条件，避免两处不一致。
      条件：宽度 <=760px，或者是「矮视口 + 触摸」（横屏手机 844×390 这种）。 */
  const NARROW_MQ = '(max-width: 760px), (max-width: 1024px) and (max-height: 520px)';
  function narrow() {
    return window.matchMedia(NARROW_MQ).matches;
  }

  const MIN_SCALE = 0.2;
  const MAX_SCALE = 2.6;

  function setupStage() {
    const stage = $('stage');

    /* 单指 / 左键按住空白处 = 平移画布；两指捏合 = 缩放。
       触摸端以前完全没有处理：手指拖动既不会平移也不会滚动，看着就像"卡住了"。 */
    const live = new Map(); // pointerId -> 最新坐标
    let mode = null;
    let g = null;

    const blank = (t) => t === stage || t.id === 'stageInner' || (t.tagName && t.tagName.toLowerCase() === 'svg');

    const beginPan = (ev) => {
      const rect = stage.getBoundingClientRect();
      mode = 'pan';
      g = { x: ev.clientX, y: ev.clientY, panX: UI.panX, panY: UI.panY, rect };
    };
    const beginPinch = () => {
      const rect = stage.getBoundingClientRect();
      const [p1, p2] = [...live.values()];
      const mx = (p1.x + p2.x) / 2 - rect.left;
      const my = (p1.y + p2.y) / 2 - rect.top;
      // 两指中点对应的世界坐标，缩放过程中保持它不动
      const wx = (mx - UI.panX) / UI.scale;
      const wy = (my - UI.panY) / UI.scale;
      mode = 'pinch';
      g = { dist: Math.max(1, Math.hypot(p2.x - p1.x, p2.y - p1.y)), wx, wy, rect };
    };

    stage.addEventListener('pointerdown', (ev) => {
      if (ev.pointerType !== 'touch' && ev.button !== 0 && ev.button !== 1) return;
      /* ❗必须先判断「按的是不是画布空白」，再决定要不要接管指针。
         一旦 stage.setPointerCapture()，后续 pointermove 全被 stage 收走：
           · 画布里的按钮（T 文字 / 缩放）收不到 click —— 真实鼠标点它们毫无反应；
           · 文字标签收不到 pointermove —— 拖不动。
         两根手指时 live.size 已经是 1，所以第二根手指不管按在哪都允许（捏合缩放要用）。 */
      if (live.size === 0 && !blank(ev.target)) return;
      live.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
      try { stage.setPointerCapture(ev.pointerId); } catch (e) { /* 忽略 */ }

      if (live.size === 1) {
        UI.pend = null;
        UI.selDev = null;
        UI.selCable = null;
        UI.selNote = null;
        render();
        beginPan(ev);
      } else if (live.size === 2) {
        UI.pend = null;
        UI.selDev = null;
        UI.selCable = null;
        UI.selNote = null;
        render();
        beginPinch();
      }
    });

    stage.addEventListener('pointermove', (ev) => {
      if (!live.has(ev.pointerId)) return;
      live.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
      if (mode === 'pan' && live.size === 1 && g) {
        UI.panX = g.panX + (ev.clientX - g.x);
        UI.panY = g.panY + (ev.clientY - g.y);
        applyTransform();
      } else if (mode === 'pinch' && live.size >= 2 && g) {
        const [p1, p2] = [...live.values()];
        const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
        const mx = (p1.x + p2.x) / 2 - g.rect.left;
        const my = (p1.y + p2.y) / 2 - g.rect.top;
        const next = Math.min(MAX_SCALE, Math.max(MIN_SCALE, UI.scale * (dist / g.dist)));
        UI.scale = next;
        // 锚在世界坐标 (wx,wy) 上，同时跟随中点移动（等于双指平移 + 缩放）
        UI.panX = mx - g.wx * next;
        UI.panY = my - g.wy * next;
        applyTransform();
      }
    });

    const lift = (ev) => {
      live.delete(ev.pointerId);
      try { stage.releasePointerCapture(ev.pointerId); } catch (e) { /* 忽略 */ }
      if (live.size === 0) {
        mode = null;
        g = null;
        persist();
      } else if (live.size === 1) {
        // 从双指变单指：接着平移，不要跳
        const [only] = [...live.values()];
        mode = 'pan';
        g = { x: only.x, y: only.y, panX: UI.panX, panY: UI.panY, rect: stage.getBoundingClientRect() };
      }
    };
    stage.addEventListener('pointerup', lift);
    stage.addEventListener('pointercancel', lift);

    stage.addEventListener('wheel', (ev) => {
      if (!ev.ctrlKey && !ev.metaKey) return;
      ev.preventDefault();
      const rect = stage.getBoundingClientRect();
      const mx = ev.clientX - rect.left;
      const my = ev.clientY - rect.top;
      zoomAt(mx, my, UI.scale * (ev.deltaY < 0 ? 1.12 : 0.89));
    }, { passive: false });
    document.addEventListener('keydown', (ev) => {
      // 正在命令行里打字时不要抢 Delete / Backspace（否则按退格会把选中的设备或连线删掉）
      const tag = document.activeElement && document.activeElement.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      if (ev.key === 'Escape') {
        UI.pend = null;
        UI.replug = null;
        UI.selCable = null;
        UI.selNote = null;
        render();
      }
      if (ev.key === 'Delete' || ev.key === 'Backspace') {
        if (UI.selNote) {
          const n = E.Net.getLabel(UI.selNote);
          if (n) {
            ev.preventDefault();
            removeNote(n);
            return;
          }
        }
        if (UI.selCable) {
          ev.preventDefault();
          removeCable(UI.selCable);
          return;
        }
        if (UI.selDev) {
          const d = E.Net.getDevice(UI.selDev);
          if (d) removeDevice(d);
        }
      }
    });
  }

  /* ------------------------------ 持久化 ------------------------------ */
  const LS_KEY = 'hw-netsim-lite-v1';

  function persist() {
    try {
      localStorage.setItem(
        LS_KEY,
        JSON.stringify({
          devices: E.Net.devices,
          cables: E.Net.cables,
          labels: E.Net.labels || [],
          seq: nameSeq,
          pan: { x: UI.panX, y: UI.panY, s: UI.scale }
        })
      );
    } catch (e) {
      /* 忽略存储异常 */
    }
  }

  function restore() {
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (!raw) return false;
      const data = JSON.parse(raw);
      if (!data.devices || !data.devices.length) return false;
      E.Net.devices = (data.devices || []).map((d) => E.normalizeDevice(d));
      E.Net.cables = data.cables || [];
      E.Net.labels = Array.isArray(data.labels)
        ? data.labels.map((l) => ({ id: l.id, x: l.x | 0, y: l.y | 0, text: String(l.text == null ? '' : l.text), color: l.color || '#e6edf3' }))
        : [];
      nameSeq = data.seq || {};
      if (data.pan) {
        UI.panX = data.pan.x || 0;
        UI.panY = data.pan.y || 0;
        UI.scale = data.pan.s || 1;
      }
      return true;
    } catch (e) {
      return false;
    }
  }

  /* ------------------------------ 实验预设 ------------------------------ */
  function mk(key, x, y, name) {
    const d = E.Net.addDevice(key, x, y);
    d.hostname = name;
    nameSeq[d.type === 'pc' ? 'PC' : d.type === 'router' ? 'R' : 'SW'] = Math.max(
      nameSeq[d.type === 'pc' ? 'PC' : d.type === 'router' ? 'R' : 'SW'] || 0,
      parseInt(String(name).replace(/\D/g, ''), 10) || 0
    );
    return d;
  }

  function link(a, ai, b, bi) {
    const res = E.Net.addCable(a, a.ports[ai], b, b.ports[bi]);
    if (!res.ok) console.warn('连线失败：' + res.message);
    return res.ok;
  }

  function setPort(dev, idx, patch) {
    Object.assign(dev.ports[idx], patch);
  }

  function setName(dev, name) {
    dev.hostname = name;
  }

    nameSeq = {};

    UI.selDev = null;
    UI.selNote = null;
    UI.editingNote = null;
    UI.pend = null;
    UI.panX = 0;
    UI.panY = 0;
    UI.scale = 1;
    applyTransform();
    persist();
    render();
    renderConsole();
  }

  /* ------------------------------ 弹窗 ------------------------------ */
  /* NewE 标识：真正的 <symbol> 定义在 index.html 顶部，这里只是引用，多个弹窗共用同一份，不重复占体积 */
  const LOGO_TAG = '<svg class="mh-logo" viewBox="0 0 820 232" role="img" aria-label="NewE"><use href="#neweLogo" /></svg>';

  function openModal(html) {
    $('modal').innerHTML = html;
    $('mask').classList.add('on');
  }
  function closeModal() {
    $('mask').classList.remove('on');
  }

  function showLabs() {
    const html = `
      <div class="mh">${LOGO_TAG}
        <h2>实训实验</h2>
        <button class="btn" id="mClose">关闭</button>
      </div>
      <div class="mb">
        <p style="color:var(--tx2);line-height:1.8;margin-bottom:14px">
          选择一个实验，会自动搭建好拓扑（含线缆，部分实验预置了 PC 地址），你只需要完成交换机 / 路由器的配置。
        </p>
        <div class="labgrid">
          ${LABS.map(
            (l) => `<div class="labcard" data-lab="${l.id}">
              <b>${l.name}</b>
              <span>${l.desc}</span>
              <span class="lv">${l.level}</span>
            </div>`
          ).join('')}
        </div>
      </div>`;
    openModal(html);
    $('mClose').onclick = closeModal;
    $('modal').querySelectorAll('.labcard').forEach((c) => {
      c.onclick = () => loadLab(c.dataset.lab);
    });
  }

  function loadLab(id) {
    const lab = LABS.find((l) => l.id === id);
    if (!lab) return;
    clearAll();
    const info = lab.build() || {};
    E.recomputeOspf();
    E.recomputeRip();
    E.recomputeStp();
    // 适应画布：把所有设备一屏放好
    fitView();
    UI.currentLab = lab;
    persist();
    render();
    if (info.focus) openConsole(info.focus);
    showLabBrief(lab);
  }

    const html = `
      <div class="mh">${LOGO_TAG}
        <h2>${lab.name}</h2>
        <button class="btn primary" id="mStart">开始配置</button>
      </div>
      <div class="mb">

  /* ------------------------------ 导出配置 ------------------------------ */
  function exportConfig() {
    if (!E.Net.devices.length) {
      toast('当前没有设备可导出', 'bad');
      return;
    }
    const text = E.Import.buildText();
    const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = '网络拓扑与配置_' + new Date().toISOString().slice(0, 10) + '.txt';
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 3000);
    toast(
      `已导出 ${E.Net.devices.length} 台设备、${E.Net.cables.length} 条连线` +
        ((E.Net.labels || []).length ? `、${E.Net.labels.length} 条注释` : '') +
        '（可原样导入还原）',
      'good'
    );
  }

  /* ------------------------------ 导入配置 ------------------------------ */
  /**
   * 导入「导出配置」生成的文件：把里面的每一段 running-config 重放回设备。
   *  · 拓扑里有同名设备 → 直接配到那台设备上
   *  · 没有同名设备     → 按表头里的型号自动新建一台
   *  · 文件没有表头     → 配到当前打开的那台设备上
   */
  function importConfigFile(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => importConfigText(String(reader.result || ''), file.name);
    reader.onerror = () => toast('文件读取失败', 'bad');
    reader.readAsText(file, 'utf-8');
  }

  function importConfigText(text, fileName) {
    const before = E.Net.devices.length;
    const res = E.Import.applyConfigText(text, { target: activeDev() });
    if (res.ok) {
      // 新建了设备 → 把自动命名计数器抬高，避免以后手动加设备时重名
      for (const d of E.Net.devices) {
        const base = d.type === 'pc' ? 'PC' : d.type === 'router' ? 'R' : 'SW';
        const n = parseInt(String(d.hostname).replace(/^\D+/, ''), 10);
        if (!isNaN(n)) nameSeq[base] = Math.max(nameSeq[base] || 0, n);
      }
      E.recomputeOspf();
      E.recomputeRip();
      E.recomputeStp();
      persist();
      render();
      renderConsole();
      // 带拓扑的文件：设备是按导出时的坐标摆的，直接适应一下画布，免得落在视野外
      if (res.hasTopology && E.Net.devices.length > before) {
        setTimeout(() => fitView(), 60);
      }
    }
    showImportResult(res, fileName);
    if (res.ok) toast(res.bad ? '导入完成，有部分命令未生效' : '导入成功', res.bad ? 'bad' : 'good');
    return res;
  }

  function showImportResult(res, fileName) {
    const head = res.ok
      ? `${res.message}${fileName ? `（来源：${esc(fileName)}）` : ''}`
      : res.message;

    const rows = (res.results || [])
      .map((r) => {
        if (r.skip) {
          return `<div class="improw">
            <div class="imph"><b>${esc(r.hostname)}</b><span class="impm">${esc(r.model || '')}</span>
              <span class="tag2 skip">跳过</span></div>
            <div class="implist"><div class="e">${esc(r.skip)}</div></div>
          </div>`;
        }
        const detail = [];
        for (const f of r.failed) {
          detail.push(
            `<div><code>${esc(f.cmd)}</code><div class="e">${esc(
              (f.lines || []).filter((l) => l.trim()).join('\n')
            )}</div></div>`
          );
        }
        for (const u of r.unknown || []) {
          detail.push(`<div><code>${esc(u)}</code><div class="e">该行不是可识别的设备配置，已忽略。</div></div>`);
        }
        return `<div class="improw">
          <div class="imph">
            <b>${esc(r.hostname)}</b><span class="impm">${esc(r.model || '')}</span>
            <span class="tag2 ${r.isNew ? 'new' : ''}">${r.isNew ? '新建设备' : '已有设备'}</span>
            <span class="impn ${r.failed.length ? 'bad' : ''}">${r.applied}/${r.total} 条生效</span>
          </div>
          ${detail.length ? `<div class="implist">${detail.join('')}</div>` : ''}
        </div>`;
      })
      .join('');

    const html = `
      <div class="mh">${LOGO_TAG}
        <h2>导入配置${res.ok ? '' : '失败'}</h2>
        <button class="btn" id="mClose">关闭</button>
      </div>
      <div class="mb">
        <p class="hint">${head}</p>
        ${res.ok ? `<div class="impstat">${statChips(res)}</div>` : ''}
        ${res.warnings && res.warnings.length ? `<div class="impwarn"><b>连线有 ${res.warnings.length} 处没能还原：</b>${res.warnings.map((w) => `<div>· ${esc(w)}</div>`).join('')}</div>` : ''}
        ${rows ? `<div class="imp">${rows}</div>` : ''}
        <h4 class="sec">请注意</h4>
        <p class="hint">
          ${
            res.hasTopology
              ? '这份文件里带了拓扑段：设备位置、连线、画布注释都已一并还原，配置逐条重放。<br />' +
                '只想要某台设备的配置，把它那一段（从「设备：xxx」到下一个「====」之前）单独复制到命令行粘贴也可以。'
              : '这份文件里没有拓扑段（可能是旧版导出，或从真机复制的 current-configuration）：' +
                '只还原了配置，设备是按型号新建的、线缆需要自己在画布上连回去。'
          }
        </p>
      </div>`;
    openModal(html);
    $('mClose').onclick = closeModal;
  }

  /** 导入结果的几个小统计块 */
  function statChips(res) {
    const chips = [];
    if (res.created) chips.push(`新建设备 <b>${res.created}</b> 台`);
    if (res.wires) chips.push(`还原连线 <b>${res.wires}</b> 条`);
    if (res.notes) chips.push(`恢复注释 <b>${res.notes}</b> 条`);
    if (res.bad) chips.push(`<span class="bad">${res.bad} 条命令未生效</span>`);
    if (res.skipped) chips.push(`跳过 <b>${res.skipped}</b> 段`);
    if (!chips.length) chips.push('没有需要新建的设备，配置已就地更新');
    return chips.map((c) => `<span class="chip">${c}</span>`).join('');
  }

  /* ------------------------------ 启动 ------------------------------ */
  function boot() {
    renderPalette();
    setupStage();
    setupInput();

    const acts = {
      lab: showLabs,
      help: showHelp,
      about: showAbout,
      save: exportConfig,
      import: () => $('fileImport').click(),
      clear: () => {
        if (confirm('确定清空当前拓扑吗？此操作不可撤销。')) {
          clearAll();
          toast('拓扑已清空');
        }
      }
    };
    $('btnLab').onclick = acts.lab;
    $('btnHelp').onclick = acts.help;
    $('btnAbout').onclick = acts.about;
    $('btnSave').onclick = acts.save;
    $('btnImport').onclick = acts.import;
    $('fileImport').onchange = (ev) => {
      const f = ev.target.files && ev.target.files[0];
      // 清空 value，这样连续导入同一个文件也能触发 change
      ev.target.value = '';
      importConfigFile(f);
    };
    $('btnTerm').onclick = () => {
      if (!UI.tabs.length) {
        toast('先双击一台设备打开命令行');
        return;
      }
      setTermOpen(!termIsOpen());
    };
    $('btnClear').onclick = acts.clear;
    const noteBtn = $('btnNote');
    if (noteBtn) {
      noteBtn.onclick = () => {
        addNote();
        toast('输入注释文字，点空白处完成；长按/右键可删除', 'good');
      };
    }

    // 窄屏下顶栏放不下 7 个按钮，收进「更多」菜单
    const more = $('btnMore');
    const moreMenu = $('moreMenu');
    const closeMore = () => {
      moreMenu.classList.remove('on');
      more.setAttribute('aria-expanded', 'false');
    };
    if (more && moreMenu) {
      more.onclick = (ev) => {
        ev.stopPropagation();
        const on = !moreMenu.classList.contains('on');
        moreMenu.classList.toggle('on', on);
        more.setAttribute('aria-expanded', on ? 'true' : 'false');
      };
      moreMenu.querySelectorAll('button[data-act]').forEach((b) => {
        b.onclick = () => {
          closeMore();
          const fn = acts[b.dataset.act];
          if (fn) fn();
        };
      });
      document.addEventListener('pointerdown', (ev) => {
        if (!moreMenu.classList.contains('on')) return;
        if (moreMenu.contains(ev.target) || more.contains(ev.target)) return;
        closeMore();
      });
    }

    // 画布右下角的缩放按钮（触摸端没有滚轮，也能精细放大到某个端口）
    const zb = { in: $('btnZoomIn'), out: $('btnZoomOut'), fit: $('btnZoomFit') };
    if (zb.in) zb.in.onclick = () => zoomBy(1.25);
    if (zb.out) zb.out.onclick = () => zoomBy(0.8);
    if (zb.fit) zb.fit.onclick = () => { fitView(); persist(); };

    $('mask').onclick = (ev) => {
      if (ev.target.id === 'mask') closeModal();
    };
    document.addEventListener('keydown', (ev) => {
      if (ev.key === 'Escape') {
        if (moreMenu && moreMenu.classList.contains('on')) return closeMore();
        closeModal();
      }
      // Ctrl+` 展开 / 收起命令行面板
      if (ev.ctrlKey && ev.key === '`') {
        ev.preventDefault();
        if (UI.tabs.length) setTermOpen(!termIsOpen());
      }
    });

    // 旋屏 / 窗口尺寸变化：媒体查询可能换了卡片尺寸，尺寸缓存要丢掉重算，
    // 否则连线端点会和新卡片错位。宽度变化较大时顺手重新适应画布。
    let lastW = window.innerWidth;
    const onResize = () => {
      invalidateMetrics();
      render();
      if (Math.abs(window.innerWidth - lastW) > 60) {
        lastW = window.innerWidth;
        fitView();
      }
    };
    window.addEventListener('resize', onResize);
    window.addEventListener('orientationchange', () => setTimeout(onResize, 220));

    const restored = restore();
    applyTransform();
    E.recomputeOspf();
    E.recomputeRip();
    E.recomputeStp();
    render();
    renderConsole();

    if (restored && E.Net.devices.length) {
      // 恢复上次的拓扑：自动打开第一台网络设备的命令行，学生可直接开始输入
      const first = E.Net.devices.find((d) => d.type !== 'pc') || E.Net.devices[0];
      openConsole(first);
      toast('已恢复上次的拓扑');
    } else {
      // 首次打开：直接加载实验一，让学生立刻有东西可玩
      loadLab('vlan-basic');
      toast('已加载「实验一 · VLAN 基础」，点击「开始配置」即可');
    }
    syncTermBtn();
  }

  // 对外可编程接口：便于自动化测试与二次集成（NE.UI.openConsole(dev) 等）
  UI.openConsole = openConsole;
  UI.closeConsole = closeConsole;
  UI.runCommand = runCommand;
  UI.loadLab = loadLab;
  UI.clearAll = clearAll;
  UI.toast = toast;
  UI.setTermOpen = setTermOpen;
  UI.termIsOpen = termIsOpen;
  UI.importConfigText = importConfigText;
  UI.cardW = cardW;
  UI.cardHeight = cardHeight;
  UI.showAbout = showAbout;
  UI.version = APP_VERSION;
  UI.zoomBy = zoomBy;
  UI.zoomAt = zoomAt;
  UI.fitView = fitView;
  UI.narrow = narrow;
  UI.metrics = metrics;
  /** 视口尺寸变了（旋屏、切设备模拟）后重算几何并重绘 —— 卡片尺寸来自 CSS 变量，要重新读 */
  UI.refreshLayout = () => {
    invalidateMetrics();
    render();
  };
  UI.info = APP_INFO;

  global.NE = global.NE || {};
  global.NE.UI = UI;
  global.NE.LABS = LABS;

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})(window);

</script>
</body>
</html>
